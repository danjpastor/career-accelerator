assessment_id: week_11_portfolio_execution_check
title: Week 11 Knowledge Check
order: 11
description: An eight-question check covering Week 11 topics.
estimated_minutes: 25
instructions:
- Answer all eight multiple-choice questions independently.
- Score at least 80% (seven of eight) to pass.
- Review recommendations under missed questions before retaking the check.
