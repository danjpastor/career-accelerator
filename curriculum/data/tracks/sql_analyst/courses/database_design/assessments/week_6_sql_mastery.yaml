- activity_id: w6_sql_rank
  title: Rank inventory within category
  type: mastery
  runtime: recognition
  prompt: Return category, item_name, units_on_hand, and stock_rank using DENSE_RANK from highest stock to lowest
    within category. Sort category, stock_rank, item_name.
  starter: 'SELECT

    FROM inventory;'
  solution: "SELECT category, item_name, units_on_hand,\n       DENSE_RANK() OVER (PARTITION BY category ORDER BY\
    \ units_on_hand DESC) AS stock_rank\nFROM inventory\nORDER BY category, stock_rank, item_name;"
  hints: []
  validator:
    type: exact_answer
    expected_answer: "SELECT category, item_name, units_on_hand,\n       DENSE_RANK() OVER (PARTITION BY category\
      \ ORDER BY units_on_hand DESC) AS stock_rank\nFROM inventory\nORDER BY category, stock_rank, item_name;"
  required_for_practice: false
  required_for_mastery: false
  evidence_eligible: false
  difficulty: intermediate
  estimated_minutes: 3
  presentation:
    scenario: Week 6 Knowledge Check
    introduction: Choose the best answer based on the skills you used this week.
    task: Return category, item_name, units_on_hand, and stock_rank using DENSE_RANK from highest stock to lowest
      within category. Sort category, stock_rank, item_name.
    requirements:
    - Choose one answer.
    expected_output: One selected answer.
    skills_practiced:
    - independent SQL
    after_correct: The query meets the requested grain and output.
    common_errors: []
    table: inventory
    review_recommendation: Review the Week 6 lesson or practice work related to Rank inventory within category.
  answer_options:
  - "SELECT category, item_name, units_on_hand,\n       DENSE_RANK() OVER (PARTITION BY category ORDER BY units_on_hand\
    \ DESC) AS stock_rank\nFROM inventory\nORDER BY category, stock_rank, item_name;"
  - SELECT category, item_name, units_on_hand, DENSE_RANK() OVER (ORDER BY units_on_hand DESC) AS stock_rank FROM
    inventory;
  - SELECT category, item_name, units_on_hand, ROW_NUMBER() OVER (PARTITION BY category ORDER BY units_on_hand)
    AS stock_rank FROM inventory;
  - SELECT category, item_name, units_on_hand, DENSE_RANK() OVER (PARTITION BY category ORDER BY units_on_hand ASC)
    AS stock_rank FROM inventory;
  required_for_completion: true
