  prompt: ''
  instruction:
    title: Learn — Processing, Storage, and Data Models
    objective: Explain processing, storage, and data models.
    body: '# Understand why databases are organized differently


      Transactional systems are designed to record frequent inserts and updates. Analytical systems are designed to scan and
      summarize large amounts of history.


      Row-oriented storage keeps the fields for one record together and often suits transactions. Column-oriented storage
      keeps values from the same field together and often suits analytical scans.


      In this lesson, you will connect a workload with an appropriate storage and processing approach.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
