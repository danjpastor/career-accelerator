  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Views and Materialized Views
    objective: Explain views and materialized views.
    body: '# Save a useful query as a reusable database object


      A **view** stores a query definition. Each time it is used, the database runs the underlying logic against current data.


      A **materialized view** stores the query result and must be refreshed. It can speed up expensive summaries, but the
      result may be out of date between refreshes.


      In this lesson, you will choose between current results, faster stored results, and a regular table based on the reporting
      need.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
