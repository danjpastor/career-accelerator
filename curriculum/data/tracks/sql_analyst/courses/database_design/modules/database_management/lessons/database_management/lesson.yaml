    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A reporting analyst needs to read approved analytics views but should not delete production tables. The database administrator
      grants read access only to the reporting schema.


      A separate event table contains several years of data and is usually queried by month, so date partitioning may reduce
      how much data each query scans.


      **What to notice:** Each decision solves a specific problem and has a tradeoff.'
