  prompt: ''
  instruction:
    title: Learn — Database Management Decisions
    objective: Explain database management decisions.
    body: '# Make safe and practical database choices


      Database management includes access control, indexing, partitioning, backups, and transaction safety.


      **Least privilege** gives a user only the permissions needed for their work. An index can speed up common searches but
      uses storage and adds work to updates. Partitioning divides a very large table into manageable sections, often by date.


      In this lesson, you will choose a management practice based on the actual risk or performance problem instead of applying
      every feature automatically.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
