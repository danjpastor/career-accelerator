  prompt: ''
  instruction:
    title: Learn — Schemas and Normalization
    objective: Explain schemas and normalization.
    body: '# Organize database objects and reduce repeated facts


      A **schema** is a named area that groups database objects, such as `raw`, `staging`, or `analytics` tables.


      **Normalization** separates repeated facts into related tables. For example, customer details belong in one customer
      table instead of being copied into every order row. This reduces inconsistent updates, but analysis often requires joins.


      In this lesson, you will identify table responsibilities, keys, and repeated information.'
  presentation:
    scenario: A short Academy lesson
