- activity_id: academy2_sql_window_basics_deep_guided
  title: Add a regional average
  type: guided
  runtime: sql
  prompt: Return order_id, region, order_total, and regional_average rounded to 2 decimals. Sort by order_id.
  starter: "SELECT order_id, region, order_total,\n       ROUND(AVG(order_total) OVER (PARTITION BY region), 2) AS regional_average\nFROM orders\nORDER BY order_id;"
  solution: SELECT order_id, region, order_total, ROUND(AVG(order_total) OVER (PARTITION BY region), 2) AS regional_average FROM orders ORDER BY order_id;
  hints:
  - Identify where partitioned window averages belongs in the query.
  - Build the query one clause at a time.
  - Read the task again and identify where **partitioned window averages** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
