  prompt: ''
  instruction:
    title: Example — See window functions versus group by in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      One report needs one row per department with average salary; another needs every employee plus the department average.


      ```sql

      AVG(salary) OVER (PARTITION BY department_id)

      ```


      **What to notice:** The window version repeats the group benchmark beside each employee instead of reducing the result to one row per department.'
    concept_heading: Make the Data Consistent
