  prompt: ''
  instruction:
    title: Learn — Window Functions versus GROUP BY
    objective: Explain window functions versus group by.
    body: '# Choose whether to collapse rows or keep them


      `GROUP BY` returns one row per group. A window function returns calculations beside the existing rows.


      Use `GROUP BY` when the required result itself is a summary. Use a window function when the detailed rows must remain visible alongside a group total, average, or rank.


      In this lesson, you will compare the two approaches and choose based on the intended result grain.'
    concept_heading: Turn Rows into Answers
  presentation:
    scenario: A beginner is learning window functions versus group by before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how window functions versus group by works and why an analyst would use it.
