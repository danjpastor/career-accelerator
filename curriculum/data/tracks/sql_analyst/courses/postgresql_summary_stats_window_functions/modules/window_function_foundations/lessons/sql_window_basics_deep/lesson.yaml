- activity_id: academy2_sql_window_basics_deep_independent
  title: Number orders within each region
  type: independent
  runtime: sql
  prompt: Return order_id, region, and regional_order_number using ROW_NUMBER ordered by order_date within each region. Sort by region and regional_order_number.
  starter: "SELECT order_id, region,\n       \nFROM orders\nORDER BY region, regional_order_number;"
  solution: SELECT order_id, region, ROW_NUMBER() OVER (PARTITION BY region ORDER BY order_date) AS regional_order_number FROM orders ORDER BY region, regional_order_number;
