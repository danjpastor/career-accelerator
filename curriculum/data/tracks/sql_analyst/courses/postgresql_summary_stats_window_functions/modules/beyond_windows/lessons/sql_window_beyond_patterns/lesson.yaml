  instruction:
    title: Learn — Beyond Window Functions
    objective: Explain beyond window functions.
    body: '# Produce advanced summaries without separate manual queries


      SQL offers patterns such as grouping sets, rollups, and cubes for returning detail and subtotal rows together. These
      tools are useful for reports that need several summary levels.


      The result includes rows with different grains, so labels and null handling must make each level clear.


      In this lesson, you will recognize when an advanced summary pattern is useful and keep subtotal rows understandable.'
  presentation:
    scenario: A short Academy lesson
