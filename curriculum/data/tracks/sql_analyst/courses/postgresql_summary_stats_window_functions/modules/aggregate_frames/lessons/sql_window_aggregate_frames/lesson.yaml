  instruction:
    title: Learn — Aggregate Window Functions and Frames
    objective: Explain aggregate window functions and frames.
    body: '# Control which nearby rows belong in a running calculation


      Aggregate functions can be used as window functions to create running totals, moving averages, and rolling counts.


      A **window frame** defines which ordered rows are included for the current row. For example, a three-row moving average
      can include the current row and two preceding rows.


      In this lesson, you will define the order and frame explicitly so the calculation matches the business period.'
