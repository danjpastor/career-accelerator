- activity_id: academy2_sql_window_aggregate_frames_guided
  title: Calculate running regional sales
  type: guided
  runtime: sql
  prompt: Return region, month_start, sales_total, and running_sales using SUM within region ordered by month_start. Sort
    by region and month_start.
  starter: "SELECT region, month_start, sales_total,\n       SUM(sales_total) OVER (PARTITION BY region ORDER BY month_start\
    \ ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_sales\nFROM monthly_sales\nORDER BY region, month_start;"
  solution: SELECT region, month_start, sales_total, SUM(sales_total) OVER (PARTITION BY region ORDER BY month_start ROWS
    BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_sales FROM monthly_sales ORDER BY region, month_start;
  hints:
  - Identify where running totals belongs in the query.
  - Build the query one clause at a time.
  - Read the task again and identify where **running totals** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT region, month_start, sales_total, SUM(sales_total) OVER (PARTITION BY region ORDER BY month_start
      ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running_sales FROM monthly_sales ORDER BY region, month_start;
    required_patterns:
    - SUM\s*\([^)]*\)\s+OVER
    - ROWS\s+BETWEEN
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
