- activity_id: academy2_sql_window_fetch_rank_guided
  title: Compare each month with the prior month
  type: guided
  runtime: sql
  prompt: Return region, month_start, sales_total, and prior_sales using LAG within each region. Sort by region and month_start.
  starter: "SELECT region, month_start, sales_total,\n       LAG(sales_total) OVER (PARTITION BY region ORDER BY month_start)\
    \ AS prior_sales\nFROM monthly_sales\nORDER BY region, month_start;"
  solution: SELECT region, month_start, sales_total, LAG(sales_total) OVER (PARTITION BY region ORDER BY month_start) AS prior_sales
    FROM monthly_sales ORDER BY region, month_start;
