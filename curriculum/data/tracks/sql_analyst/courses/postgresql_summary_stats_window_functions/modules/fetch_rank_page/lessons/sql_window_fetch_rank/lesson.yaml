  instruction:
    title: Learn — Fetching, Ranking, and Paging
    objective: Explain fetching, ranking, and paging.
    body: '# Compare nearby rows and return a controlled slice of results


      Ranking functions assign positions based on an order. `LAG` and `LEAD` return values from a previous or next row in
      that order. Paging patterns return a predictable portion of an ordered result.


      A stable `ORDER BY` is essential. If tied rows have no additional sort key, the returned order may change between runs.


      In this lesson, you will rank records, compare one period with another, and return results in a repeatable order.'
  presentation:
    scenario: A short Academy lesson
