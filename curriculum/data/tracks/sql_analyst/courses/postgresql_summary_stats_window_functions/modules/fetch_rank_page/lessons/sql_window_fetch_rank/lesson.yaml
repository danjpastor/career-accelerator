    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A monthly report compares each month''s revenue with the prior month.


      ```sql

      LAG(revenue) OVER (ORDER BY month) AS prior_month_revenue

      ```


      **What to notice:** `LAG` depends on the specified sequence. It does not mean “previous row” until an order is defined.'
