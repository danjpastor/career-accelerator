- activity_id: academy2_sql_window_fetch_rank_independent
  title: Rank monthly sales
  type: independent
  runtime: sql
  prompt: Return region, month_start, sales_total, and sales_rank using DENSE_RANK across all rows by sales_total descending.
    Sort by sales_rank and region.
  starter: "SELECT region, month_start, sales_total,\n       \nFROM monthly_sales\nORDER BY sales_rank, region;"
  solution: SELECT region, month_start, sales_total, DENSE_RANK() OVER (ORDER BY sales_total DESC) AS sales_rank FROM monthly_sales
    ORDER BY sales_rank, region;
  hints:
  - Start from the requested result grain, then apply ranking windows.
  - Read the task again and identify where **ranking windows** fits into the requested result.
  - Focus on the named table or source (['monthly_sales']) and check each requirement one at a time.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT region, month_start, sales_total, DENSE_RANK() OVER (ORDER BY sales_total DESC) AS sales_rank FROM
      monthly_sales ORDER BY sales_rank, region;
    required_patterns:
    - DENSE_RANK\s*\(\s*\)\s+OVER
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
  required_for_practice: false
