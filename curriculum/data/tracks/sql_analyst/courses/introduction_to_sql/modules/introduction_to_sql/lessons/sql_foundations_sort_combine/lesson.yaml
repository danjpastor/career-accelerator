    common_errors: []
  instruction:
    title: Match sort direction to business language
    objective: Choose ascending or descending order for a date request.
    action_label: Choose the sort clause
    body: 'A query result has no guaranteed business order unless it includes `ORDER BY`.


      For dates:


      - `ASC` usually means oldest to newest.

      - `DESC` usually means newest to oldest.


      For numbers, ascending means lowest to highest and descending means highest to lowest. For text, ascending generally means A–Z.


      Translate the stakeholder’s words directly. “Oldest opened first” means the earliest date should appear at the top, so the date must be sorted ascending.


      Choose the clause that places the oldest `opened_date` values first. Do not confuse “oldest” with “largest” or assume descending is always more important.'
    concept_heading: Focus on the Rows That Matter
  required_for_completion: true
  step_kind: knowledge_check
  completion_mode: validated
  xp: 50
  solution: ORDER BY opened_date ASC
- activity_id: academy2_sql_foundations_sort_combine_example
  title: Example — See complete your sql foundation in context
  type: recognition
  runtime: content
  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See complete your sql foundation in context
    objective: Study a separate example, then use the method on different data.
    body: '## A separate example


      A recruiter wants the five oldest applications that still need review:


      ```sql

      SELECT application_id, role_name, submitted_date

      FROM job_applications

      WHERE status = ''Needs Review''

      ORDER BY submitted_date ASC

      LIMIT 5;

      ```


      **What to notice:** `WHERE` defines the eligible applications, `ORDER BY` places the oldest first, and `LIMIT` keeps only five rows.'
    concept_heading: Make the Data Consistent
  presentation:
