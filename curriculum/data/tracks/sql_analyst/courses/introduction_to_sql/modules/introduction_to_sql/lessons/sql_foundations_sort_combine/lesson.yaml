lesson_id: academy2_sql_foundations_sort_combine
title: Complete Your SQL Foundation
order: 5
difficulty: beginner
description: Order results intentionally and combine foundation clauses into complete business queries.
estimated_minutes: 45
content: lesson.md
objectives:
- Sort text, numeric, and date values in either direction.
- Use multiple sort keys.
- Place SQL clauses in valid order.
- Build top-N queries with filtering, sorting, and limiting.
key_takeaways:
- A meaningful top-N result requires ORDER BY before LIMIT.
- Multiple sort keys apply from left to right.
- Build and test complex queries incrementally.
teaches:
- sql.order_by
- sql.clause_composition
requires:
- sql.where
- sql.column_selection
mastery:
  passing_score: 1.0
activities:
- activity_id: academy2_sql_foundations_sort_combine_learn
  title: Learn — Complete Your SQL Foundation
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Complete Your SQL Foundation
    objective: Understand the idea in plain language before writing a query.
    body: '# Sort a result and control its size


      A query result has no guaranteed business order unless you use `ORDER BY`.


      ```sql

      SELECT request_id, submitted_date

      FROM purchase_requests

      ORDER BY submitted_date ASC;

      ```


      `ASC` sorts low to high, A to Z, or oldest to newest. `DESC` sorts high to low, Z to A, or newest to oldest.


      You can sort by more than one field. SQL uses the first sort key, then the next key when values are tied.


      Foundation clauses normally appear in this order:


      ```sql

      SELECT ...

      FROM ...

      WHERE ...

      ORDER BY ...

      LIMIT ...;

      ```


      For a top-five question, use `ORDER BY` to define which rows are highest or newest, then use `LIMIT 5`. A limit without sorting is only a preview.


      Build a query one clause at a time and run it after each meaningful change. This makes mistakes easier to find.'
    concept_heading: Complete Your SQL Foundation
  presentation:
    scenario: A beginner is learning complete your sql foundation before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how complete your sql foundation works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.order_by
    - sql.clause_composition
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
