lesson_id: academy2_sql_foundations_select_alias
title: Write Your First SQL
order: 2
difficulty: beginner
description: Shape readable result sets with explicit columns and stakeholder-friendly aliases.
estimated_minutes: 37
content: lesson.md
objectives:
- Choose only the columns required by a question.
- Control result-column order.
- Create clear aliases with AS.
- Explain why aliases do not modify the source table.
key_takeaways:
- Explicit columns make saved queries safer.
- Aliases describe the result without changing the source.
- Readable names should preserve business meaning.
teaches:
- sql.column_selection
- sql.aliases
requires:
- sql.select_basics
mastery:
  passing_score: 1.0
activities:
- activity_id: academy2_sql_foundations_select_alias_learn
  title: Learn — Write Your First SQL
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Write Your First SQL
    objective: Understand the idea in plain language before writing a query.
    body: '# Choose the columns your result needs


      `SELECT` controls which columns appear in a query result. A table may contain many fields, but a clear analysis usually
      returns only the ones needed for the question.


      ```sql

      SELECT customer_id, signup_date, plan_name

      FROM customers;

      ```


      The order of the names in `SELECT` becomes the order of the result columns.


      An **alias** gives a result column a clearer heading. Use `AS` followed by the new name:


      ```sql

      SELECT annual_value AS contract_value

      FROM contracts;

      ```


      The source column is still named `annual_value`. The alias only changes the heading in this result.


      Clear aliases help another person understand technical field names and calculated values. Prefer names such as `monthly_revenue`
      instead of vague names such as `value`.


      `SELECT *` returns every column. It is useful for a quick first look, but a saved analysis should usually name the columns
      it depends on.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.column_selection
    - sql.aliases
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
- activity_id: academy2_sql_foundations_select_alias_check
  title: Recognize projection
  type: recognition
  runtime: recognition
  prompt: Which query operation changes which columns appear while keeping all source rows?
  answer_options:
  - Selecting an explicit column list
  - Filtering with WHERE
  - Sorting with ORDER BY
  - Removing duplicates with DISTINCT
  hints:
  - Read the task again and identify where **projection** fits into the requested result.
  - Focus on the named table or source (products) and check each requirement one at a time.
  - 'Compare your work with the success criteria. Your result should directly answer: Which query operation changes which
    columns appear while keeping all source rows?'
  validator:
    type: exact_answer
    expected_answer: Selecting an explicit column list
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 3
  presentation:
    scenario: Reporting design review
    introduction: A teammate is describing how a query changes the shape of a result.
    task: Identify the operation that controls result columns.
    table: products
    requirements:
    - Choose the option that affects columns rather than rows.
    expected_output: One selected answer.
    skills_practiced:
    - projection
    - result shape
    after_correct: An explicit SELECT list projects the requested columns while leaving row eligibility unchanged.
    common_errors: []
  instruction:
    title: Understand projection
    objective: Recognize the operation that changes result columns without filtering rows.
    action_label: Choose the operation
    body: 'In relational terminology, choosing columns is called **projection**. Projection changes the shape of the result
      horizontally: it controls which attributes appear. It does not determine which records qualify.


      ```sql

      SELECT account_id, plan_name

      FROM subscriptions;

      ```


      If the source contains seven rows and no filter is present, the result still contains seven rows. It simply contains
      fewer columns.


      This differs from **filtering**, which changes the result vertically by keeping only rows that satisfy a condition.
      Later, both operations can be combined:


      ```sql

      SELECT account_id, plan_name

      FROM subscriptions

      WHERE status = ''Active'';

      ```


      Here, `SELECT` projects columns and `WHERE` filters rows.


      The question asks specifically about changing which columns appear while retaining all source rows. Choose the operation
      that describes that behavior.'
  required_for_completion: true
  step_kind: knowledge_check
  completion_mode: validated
  xp: 50
  solution: Selecting an explicit column list
