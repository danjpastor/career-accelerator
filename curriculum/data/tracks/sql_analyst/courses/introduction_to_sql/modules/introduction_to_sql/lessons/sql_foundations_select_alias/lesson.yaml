    expected_query: 'SELECT subscriber_id AS account_id, plan_name AS subscription_plan

      FROM subscriptions;'
    required_patterns:
    - subscriber_id\s+AS\s+account_id
    - plan_name\s+AS\s+subscription_plan
    forbidden_patterns: []
    order_sensitive: false
    column_sensitive: true
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: true
  difficulty: beginner
  estimated_minutes: 8
  presentation:
    scenario: Customer-success export
    introduction: Customer Success needs a clean two-column account-and-plan export for a workflow tool.
    task: Create the requested result with stakeholder-friendly headings.
    table: subscriptions
    requirements:
    - Return exactly two columns.
    - Alias subscriber_id as account_id.
    - Alias plan_name as subscription_plan.
    expected_output: 7 rows with headings account_id and subscription_plan.
    skills_practiced:
    - independent SELECT
    - multiple aliases
    after_correct: The result is concise, readable, and stable because both source fields are explicitly selected and clearly
      renamed.
    common_errors: []
  instruction:
    title: Create a reader-friendly two-column view
    objective: Independently select and alias multiple fields.
    action_label: Build the account-plan view
    body: "A strong result set balances source traceability with reader-friendly headings. You can alias more than one selected\
      \ field:\n\n```sql\nSELECT member_id AS account_id,\n       membership_tier AS plan_name\nFROM memberships;\n```\n\n\
      Each alias applies only to the expression directly before it. Commas still separate the complete expressions.\n\nBefore\
      \ writing, translate the request into a small output contract:\n\n- First result column: source `subscriber_id`, displayed\
      \ as `account_id`\n- Second result column: source `plan_name`, displayed as `subscription_plan`\n- Source table: `subscriptions`\n\
      - Rows: all subscriptions\n\nThis is the lesson’s independent mastery step. Build the query without copying a previous\
      \ solution. If you view the full solution, you can still practice, but you must pass a later unassisted attempt to demonstrate\
      \ mastery."
  required_for_completion: true
  step_kind: transfer
  completion_mode: validated
  xp: 100
