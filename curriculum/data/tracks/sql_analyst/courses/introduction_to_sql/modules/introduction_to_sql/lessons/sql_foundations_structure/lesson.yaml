  prompt: ''
  instruction:
    title: Example — See meet databases & sql in context
    objective: Study a separate example, then use the method on different data.
    body: '## A separate example


      A library has a `loans` table with one row per borrowed book. It contains `loan_id`, `member_id`, `book_title`, and
      `due_date`.


      A librarian only needs the loan number and due date:


      ```sql

      SELECT loan_id, due_date

      FROM loans;

      ```


      The result keeps one row per loan because no rows were filtered. It simply shows fewer columns.


      **What to notice:** The analyst first identifies the grain—one row per loan—then selects only the fields needed for
      the question.'
