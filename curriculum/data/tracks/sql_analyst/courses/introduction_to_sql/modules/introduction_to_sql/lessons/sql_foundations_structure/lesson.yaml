lesson_id: academy2_sql_foundations_structure
title: Meet Databases & SQL
order: 1
difficulty: beginner
description: Learn how relational tables are structured and how to identify the correct unit of analysis before querying.
estimated_minutes: 27
content: lesson.md
objectives:
- Define the grain of a table in plain language.
- Distinguish rows, columns, cells, and tables.
- Recognize common analyst-facing data types.
- Write a basic SELECT query with multiple columns.
key_takeaways:
- Always identify what one row represents before analysis.
- IDs may contain digits but still behave as text labels.
- Selecting columns changes the result shape, not the source data.
teaches:
- sql.table_structure
- sql.data_types
- sql.select_basics
requires:
- roadmap.spreadsheet_mastery
mastery:
  passing_score: 1.0
