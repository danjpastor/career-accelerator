  instruction:
    title: Begin with the unit of analysis
    objective: Identify what one row represents before counting, filtering, or summarizing a table.
    action_label: Identify the grain
    body: 'A table is useful only when you understand its **grain**: the exact thing or event represented by one row. Grain
      is also called the *unit of analysis*. Before writing SQL, finish the sentence: “One row represents one ____.”


      A support-ticket table may contain one row per ticket, while a ticket-message table may contain many rows for the same
      ticket. Counting rows in the first table counts tickets; counting rows in the second counts messages. Both tables may
      contain a `ticket_id`, but they answer different questions.


      Use identifiers and repeated values as clues. If `ticket_id` is unique on every row, one row probably represents one
      ticket. A `customer_id` may repeat because a customer can open several tickets.


      **Worked example:** In a table containing `order_id`, `customer_id`, `order_date`, and `order_total`, a unique `order_id`
      suggests one row per order. The repeated `customer_id` does not change the grain.


      Now inspect the support-ticket context and choose the statement that precisely describes one row.'
  required_for_completion: true
