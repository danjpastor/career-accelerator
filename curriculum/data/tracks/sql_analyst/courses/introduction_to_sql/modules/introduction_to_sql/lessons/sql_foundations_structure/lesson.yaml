  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Meet Databases & SQL
    objective: Understand the idea in plain language before writing a query.
    body: '# Meet tables and SQL


      A database stores information in **tables**. A table is made of rows and columns.


      - A **row** is one record.

      - A **column** is one detail about every record.

      - A **cell** is one value where a row and column meet.


      Before you analyze a table, identify its **grain**. Grain means what one row represents. In an `orders` table, one row
      may be one order. In an `order_items` table, one row may be one product inside an order. That difference changes what
      a row count means.


      Columns also have data types. Text stores labels and IDs. Numbers store amounts or quantities. Dates store calendar
      values. A missing value is usually shown as `NULL`.


      SQL is a language for asking a database a question. A basic query uses `SELECT` to choose columns and `FROM` to choose
      the table:


      ```sql

      SELECT order_id, order_date

      FROM orders;

      ```


      The query returns a result. It does not change the source table.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.table_structure
    - sql.data_types
    - sql.select_basics
  validator: {}
  hints: []
  solution: ''
