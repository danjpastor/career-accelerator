- activity_id: w3_sql_group
  title: Grouped ticket summary
  type: mastery
  runtime: recognition
  prompt: Return status and ticket_count from support_tickets, sorted by status.
  starter: 'SELECT

    FROM support_tickets;'
  solution: 'SELECT status, COUNT(*) AS ticket_count

    FROM support_tickets

    GROUP BY status

    ORDER BY status;'
  hints: []
  validator:
    type: exact_answer
    expected_answer: 'SELECT status, COUNT(*) AS ticket_count

      FROM support_tickets

      GROUP BY status

      ORDER BY status;'
  required_for_practice: false
  required_for_mastery: false
  evidence_eligible: false
  difficulty: intermediate
  estimated_minutes: 3
  presentation:
    scenario: Week 3 Knowledge Check
    introduction: Choose the best answer based on the skills you used this week.
