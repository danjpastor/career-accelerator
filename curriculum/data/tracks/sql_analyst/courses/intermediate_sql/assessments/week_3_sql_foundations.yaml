- activity_id: w3_sql_group
  title: Grouped ticket summary
  type: mastery
  runtime: sql
  prompt: Return status and ticket_count from support_tickets, sorted by status.
  starter: 'SELECT

    FROM support_tickets;'
  solution: 'SELECT status, COUNT(*) AS ticket_count

    FROM support_tickets

    GROUP BY status

    ORDER BY status;'
  hints: []
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: 'SELECT status, COUNT(*) AS ticket_count

      FROM support_tickets

      GROUP BY status

      ORDER BY status;'
    required_patterns:
    - COUNT\s*\(
    - GROUP\s+BY\s+status
    - ORDER\s+BY\s+status
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
  required_for_practice: false
  required_for_mastery: false
  evidence_eligible: false
  difficulty: intermediate
  estimated_minutes: 8
  presentation:
    scenario: Weekly cumulative knowledge check
    introduction: Write the complete query independently.
    task: Return status and ticket_count from support_tickets, sorted by status.
    requirements:
    - Return only the requested columns.
    - Use the required SQL concepts.
    expected_output: One row per status.
    skills_practiced:
    - independent SQL
    after_correct: The query meets the requested grain and output.
    common_errors: []
    table: support_tickets
