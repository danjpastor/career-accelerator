    after_correct: The query meets the requested grain and output.
    common_errors: []
    table: support_tickets
    review_recommendation: Review the Week 3 lesson or practice work related to Grouped ticket summary.
  answer_options:
  - 'SELECT status, COUNT(*) AS ticket_count

    FROM support_tickets

    GROUP BY status

    ORDER BY status;'
  - SELECT status, COUNT(*) AS ticket_count FROM support_tickets ORDER BY status;
  - SELECT COUNT(*) AS ticket_count FROM support_tickets GROUP BY status ORDER BY status;
  - SELECT status, COUNT(*) AS ticket_count FROM support_tickets WHERE status GROUP BY status;
