  prompt: ''
  instruction:
    title: Learn — Summary Values
    objective: Explain aggregating business data.
    body: '# Summarize many rows with aggregate functions


      Aggregate functions turn many detailed rows into one summary value. Common examples are `COUNT`, `SUM`, `AVG`, `MIN`,
      and `MAX`.


      `COUNT(*)` counts rows. `COUNT(column_name)` counts only rows where that column is not `NULL`. This difference matters
      when values are missing.


      An aggregate query changes the result grain. Without grouping, the whole result is usually one row. Before writing the
      query, say what that one row should represent.


      In this lesson, you will calculate summary values and check that each function matches the business question.'
