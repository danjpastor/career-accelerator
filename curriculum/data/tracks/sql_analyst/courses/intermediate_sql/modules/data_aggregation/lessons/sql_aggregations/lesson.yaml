  prompt: ''
  instruction:
    title: Example — See summary values in context
    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nA clinic has one row per appointment. The manager wants the number of appointments and\
      \ the average wait time.\n\n```sql\nSELECT\n    COUNT(*) AS appointment_count,\n    AVG(wait_minutes) AS average_wait_minutes\n\
      FROM appointments;\n```\n\nThis returns one row for the entire table. If some wait times are missing, `AVG` ignores\
      \ those missing values.\n\n**What to notice:** Each aggregate has a specific meaning, and missing values can affect\
      \ the denominator."
  presentation:
