  prompt: ''
  instruction:
    title: Example — See multiple grouping columns in context
    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nA ticket table is grouped by Department and Priority.\n\n```sql\nSELECT\n    department,\n    priority,\n    COUNT(*) AS ticket_count\nFROM tickets\nGROUP BY department, priority;\n```\n\n**What to notice:** One row now represents one Department–Priority combination, not one ticket or one department alone."
    concept_heading: Make the Data Consistent
  presentation:
