- activity_id: academy2_sql_grouping_multiple_guided
  title: Count orders by region and status
  type: guided
  runtime: sql
  prompt: Return region, status, and order_count, sorted by region and status.
  starter: "SELECT region, status,\n       COUNT(*) AS order_count\nFROM orders\nGROUP BY region, status\nORDER BY region, status;"
  solution: SELECT region, status, COUNT(*) AS order_count FROM orders GROUP BY region, status ORDER BY region, status;
  hints:
  - Identify where multiple grouping columns belongs in the query.
  - Build the query one clause at a time.
  - Read the task again and identify where **multiple grouping columns** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT region, status, COUNT(*) AS order_count FROM orders GROUP BY region, status ORDER BY region, status;
