  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Multiple Grouping Columns
    objective: Explain multiple grouping columns.
    body: '# Build a more detailed grouped summary


      Grouping by several columns creates one row for each unique combination of those values. Grouping by Region and Status, for example, produces a separate row for each region-and-status pair.


      Adding a grouping column makes the result more detailed. Removing one makes it more summarized. Decide the result grain before choosing the fields.


      In this lesson, you will create multi-level summaries and avoid selecting fields that do not belong at the grouped grain.'
    concept_heading: Ask for the Columns You Need
  presentation:
    scenario: A beginner is learning multiple grouping columns before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how multiple grouping columns works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
