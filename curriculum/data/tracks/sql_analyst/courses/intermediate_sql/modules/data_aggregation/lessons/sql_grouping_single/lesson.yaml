  prompt: ''
  instruction:
    title: Learn — One Grouping Column
    objective: Explain one grouping column.
    body: '# Create one summary row for each category


      `GROUP BY` divides rows into groups before an aggregate is calculated. Grouping by one column creates one result row
      for each distinct value in that column.


      Every selected field must either define the group or be summarized with an aggregate. If the result should contain one
      row per product category, category belongs in both `SELECT` and `GROUP BY`.


      In this lesson, you will choose the intended result grain and build category-level summaries.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.grouping_single
  validator: {}
