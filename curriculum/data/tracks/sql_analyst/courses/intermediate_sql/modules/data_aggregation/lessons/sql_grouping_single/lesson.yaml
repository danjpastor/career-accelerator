  instruction:
    title: Example — See one grouping column in context
    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nA repair table contains one row per repair. The analyst needs one row per repair type.\n\
      \n```sql\nSELECT\n    repair_type,\n    COUNT(*) AS repair_count\nFROM repairs\nGROUP BY repair_type;\n```\n\n**What\
      \ to notice:** `GROUP BY repair_type` changes the result from one row per repair to one row per repair type."
