  prompt: ''
  instruction:
    title: Learn — Complex Transformations
    objective: Explain complex transformations.
    body: '# Combine several calculations into a clear result


      More complex transformations may use arithmetic, rounding, null handling, and several source fields at once. Break the request into small parts before writing one long expression.


      Use parentheses to make the intended order of operations clear. When a denominator might be zero, protect the calculation instead of allowing the query to fail.


      In this lesson, you will create calculated business measures that remain readable and safe.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning complex transformations before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how complex transformations works and why an analyst would use it.
