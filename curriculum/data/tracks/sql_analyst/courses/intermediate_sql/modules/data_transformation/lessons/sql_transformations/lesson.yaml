  prompt: ''
  instruction:
    title: Learn — Basic Transformations
    objective: Explain transforming values with case and cast.
    body: '# Create useful values from existing columns


      A transformation changes how a value is represented in the query result without changing the stored source data. Arithmetic can create totals or rates, while `CAST` changes a value from one data type to another.


      Give calculated fields clear aliases so someone reading the result understands them. Watch for integer division, text values that cannot be converted, and missing values.


      In this lesson, you will create calculated fields and deliberately control their data types.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning basic transformations before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how basic transformations works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.transformations
  validator: {}
