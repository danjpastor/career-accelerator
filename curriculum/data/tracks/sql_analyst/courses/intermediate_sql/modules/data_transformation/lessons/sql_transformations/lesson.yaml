- activity_id: academy2_sql_transformations_guided
  title: Create product price bands
  type: guided
  runtime: sql
  prompt: Return product_id, product_name, and a price_band of 'Premium' when unit_price is at least 30, otherwise 'Standard'. Sort by product_id.
  starter: "SELECT product_id, product_name,\n       -- create price_band\nFROM products\nORDER BY product_id;"
  solution: SELECT product_id, product_name, CASE WHEN unit_price >= 30 THEN 'Premium' ELSE 'Standard' END AS price_band FROM products ORDER BY product_id;
  hints:
  - Focus on CASE.
  - Build the result one clause at a time.
  - Read the task again and identify where **CASE** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT product_id, product_name, CASE WHEN unit_price >= 30 THEN 'Premium' ELSE 'Standard' END AS price_band FROM products ORDER BY product_id;
    required_patterns:
    - CASE\s+WHEN
    - END\s+AS
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 7
  presentation:
    scenario: The operations manager is preparing the weekly operations review.
    introduction: Write and run your own solution. Use the lesson example as a guide, not as an answer to copy.
    task: Return product_id, product_name, and a price_band of 'Premium' when unit_price is at least 30, otherwise 'Standard'. Sort by product_id.
    tables:
    - products
    requirements:
    - Return the requested fields and metrics.
    - Keep the result readable and deterministic.
    expected_output: A validated result with the requested columns.
    skills_practiced:
    - CASE
    after_correct: Your query returns the requested result and uses the intended SQL pattern.
    common_errors: []
  instruction:
