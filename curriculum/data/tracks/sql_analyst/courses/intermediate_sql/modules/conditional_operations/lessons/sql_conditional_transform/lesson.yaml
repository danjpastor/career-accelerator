- activity_id: academy2_sql_conditional_transform_example
  title: Example — See conditional transformation in context
  type: recognition
  runtime: content
  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See conditional transformation in context
    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nA delivery table labels shipments by delay length.\n\n```sql\nSELECT\n    shipment_id,\n    CASE\n        WHEN delay_days >= 7 THEN 'Severe'\n        WHEN delay_days >= 1 THEN 'Late'\n        ELSE 'On time'\n    END AS delay_band\nFROM shipments;\n```\n\n**What to notice:** The severe rule appears first because it is more specific than the general late rule."
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning conditional transformation before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
