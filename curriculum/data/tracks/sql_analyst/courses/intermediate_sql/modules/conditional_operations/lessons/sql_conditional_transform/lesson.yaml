  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Conditional Transformation
    objective: Explain conditional transformation.
    body: '# Return different values for different conditions


      `CASE` lets a query evaluate conditions in order and return a result for the first condition that is true. It is SQL''s main tool for creating categories from business rules.


      Put the most specific rule first. Include `ELSE` when rows that match no listed condition still need a clear result.


      In this lesson, you will translate written rules into a calculated category and verify the order of the conditions.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning conditional transformation before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how conditional transformation works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.conditional_transform
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
