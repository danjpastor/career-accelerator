- activity_id: academy2_sql_conditional_transform_independent
  title: Label inventory stock risk
  type: independent
  runtime: sql
  prompt: 'Return sku and stock_risk: Reorder for units_on_hand < reorder_level, otherwise OK. Sort by sku.'
  starter: "SELECT sku,\n       \nFROM inventory\nORDER BY sku;"
  solution: SELECT sku, CASE WHEN units_on_hand < reorder_level THEN 'Reorder' ELSE 'OK' END AS stock_risk FROM inventory ORDER BY sku;
  hints:
  - Start from the requested result grain, then apply business-rule labels.
  - Read the task again and identify where **business-rule labels** fits into the requested result.
  - Focus on the named table or source (['inventory']) and check each requirement one at a time.
