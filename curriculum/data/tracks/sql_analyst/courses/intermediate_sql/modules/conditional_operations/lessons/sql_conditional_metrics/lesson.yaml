  prompt: ''
  instruction:
    title: Learn — Conditional Aggregation
    objective: Explain conditional business metrics.
    body: '# Calculate several business metrics in one grouped query


      Conditional aggregation places a `CASE` expression inside an aggregate function. It lets you count or total only the
      rows that meet a condition while keeping the intended grouped result.


      This pattern is useful for measures such as open-ticket count, delayed-order revenue, or percentage of records meeting
      a target.


      In this lesson, you will build condition-specific metrics without filtering away the rows needed for other measures.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.conditional_aggregation
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
