- activity_id: academy2_sql_conditional_metrics_guided
  title: Count completed orders
  type: guided
  runtime: sql
  prompt: Return completed_orders and total_orders in one row.
  starter: 'SELECT

    FROM orders;'
  solution: SELECT SUM(CASE WHEN status = 'Completed' THEN 1 ELSE 0 END) AS completed_orders, COUNT(*) AS total_orders FROM
    orders;
  hints:
  - Focus on conditional aggregation.
  - Build the result one clause at a time.
  - Read the task again and identify where **conditional aggregation** fits into the requested result.
  validator:
