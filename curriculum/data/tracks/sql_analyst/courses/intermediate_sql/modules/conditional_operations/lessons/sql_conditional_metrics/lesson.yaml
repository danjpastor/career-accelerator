- activity_id: academy2_sql_conditional_metrics_independent
  title: Count unresolved tickets by team
  type: independent
  runtime: sql
  prompt: Return assigned_team and unresolved_tickets for Open or Pending tickets, grouped and sorted by assigned_team.
  starter: 'SELECT assigned_team,

    FROM support_tickets

    GROUP BY assigned_team

    ORDER BY assigned_team;'
  solution: SELECT assigned_team, SUM(CASE WHEN status IN ('Open', 'Pending') THEN 1 ELSE 0 END) AS unresolved_tickets FROM
    support_tickets GROUP BY assigned_team ORDER BY assigned_team;
  hints:
  - Focus on conditional grouped metrics.
  - Build the result one clause at a time.
  - Read the task again and identify where **conditional grouped metrics** fits into the requested result.
