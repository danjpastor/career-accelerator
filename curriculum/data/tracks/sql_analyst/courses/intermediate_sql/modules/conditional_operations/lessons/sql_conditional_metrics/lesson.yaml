- activity_id: academy2_sql_conditional_metrics_example
  title: Example — See conditional aggregation in context
  type: recognition
  runtime: content
  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See conditional aggregation in context
    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nA team summary needs total tickets and open tickets in the same row.\n\n```sql\nSELECT\n\
      \    team,\n    COUNT(*) AS total_tickets,\n    SUM(CASE WHEN status = 'Open' THEN 1 ELSE 0 END) AS open_tickets\nFROM\
      \ tickets\nGROUP BY team;\n```\n\n**What to notice:** A `WHERE status = 'Open'` filter would remove closed tickets and\
      \ make the total count unusable. The condition stays inside the aggregate instead."
  presentation:
    scenario: A separate worked example
    introduction: Study how the idea works before solving a different task.
    task: Read the example and focus on the reasoning rather than memorizing the answer.
    requirements: []
    expected_output: An understanding of how the method is applied.
    skills_practiced:
    - sql.conditional_aggregation
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
