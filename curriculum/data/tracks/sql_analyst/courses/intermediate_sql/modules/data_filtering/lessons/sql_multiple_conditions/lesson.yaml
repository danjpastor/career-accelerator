  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Multiple Conditions
    objective: Explain multiple conditions.
    body: '# Combine filter rules without changing their meaning


      `AND` requires every connected condition to be true. `OR` requires at least one. When both appear in the same filter, parentheses make the intended logic explicit.


      Translate the business rule into plain language first. Then decide which conditions belong together.


      In this lesson, you will filter with several conditions and avoid results changed by operator precedence.'
    concept_heading: Keep Only the Rows You Need
  presentation:
    scenario: A beginner is learning multiple conditions before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how multiple conditions works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.multiple_conditions
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
