- activity_id: academy2_sql_complex_filters_independent
  title: Find unresolved tickets without satisfaction data
  type: independent
  runtime: sql
  prompt: Return ticket_id, status, and satisfaction_score for unresolved tickets where satisfaction_score is missing. Sort
    by ticket_id.
  starter: "SELECT ticket_id, status, satisfaction_score\nFROM support_tickets\nWHERE \nORDER BY ticket_id;"
  solution: SELECT ticket_id, status, satisfaction_score FROM support_tickets WHERE status IN ('Open', 'Pending') AND satisfaction_score
    IS NULL ORDER BY ticket_id;
  hints:
  - Start from the requested result grain, then apply NULL-aware complex filters.
  - Read the task again and identify where **NULL-aware complex filters** fits into the requested result.
  - Focus on the named table or source (['support_tickets']) and check each requirement one at a time.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT ticket_id, status, satisfaction_score FROM support_tickets WHERE status IN ('Open', 'Pending')
      AND satisfaction_score IS NULL ORDER BY ticket_id;
    required_patterns:
    - satisfaction_score\s+IS\s+NULL
    - status\s+IN
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
