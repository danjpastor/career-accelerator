  prompt: ''
  instruction:
    title: Learn — Complex Filtering
    objective: Explain complex filtering.
    body: '# Filter correctly when values may be missing


      `NULL` means a value is missing or unknown. It is not equal to zero or an empty string, and it cannot be tested with
      `= NULL`.


      Use `IS NULL` or `IS NOT NULL`. When a filter combines missing-value checks with other conditions, use parentheses and
      test a few examples by hand.


      In this lesson, you will write NULL-aware filters and explain which rows should remain.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.complex_filters
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
