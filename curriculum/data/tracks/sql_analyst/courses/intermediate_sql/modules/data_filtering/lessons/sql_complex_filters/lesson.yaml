- activity_id: academy2_sql_complex_filters_guided
  title: Find midrange completed orders
  type: guided
  runtime: sql
  prompt: Return order_id and order_total for Completed orders between 100 and 200 inclusive. Sort by order_total descending.
  starter: "SELECT order_id, order_total\nFROM orders\nWHERE status = 'Completed'\n  AND order_total BETWEEN 100 AND 200\n\
    ORDER BY order_total DESC;"
  solution: SELECT order_id, order_total FROM orders WHERE status = 'Completed' AND order_total BETWEEN 100 AND 200 ORDER
    BY order_total DESC;
  hints:
  - Identify where range filtering belongs in the query.
  - Build the query one clause at a time.
  - Read the task again and identify where **range filtering** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
