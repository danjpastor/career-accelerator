- activity_id: academy2_sql_advanced_filtering_independent
  title: Filter urgent non-email tickets
  type: independent
  runtime: sql
  prompt: Return ticket_id, priority, and channel for High or Urgent tickets whose channel is not Email. Sort by ticket_id.
  starter: 'SELECT ticket_id, priority, channel

    FROM support_tickets

    WHERE

    ORDER BY ticket_id;'
  solution: SELECT ticket_id, priority, channel FROM support_tickets WHERE channel <> 'Email' AND priority IN ('High', 'Urgent')
    ORDER BY ticket_id;
  hints:
