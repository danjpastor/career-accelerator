- activity_id: academy2_sql_advanced_filtering_guided
  title: Find high-value East and West orders
  type: guided
  runtime: sql
  prompt: Return order_id, region, and order_total for East or West orders worth at least 100. Sort by order_id.
  starter: 'SELECT order_id, region, order_total

    FROM orders

    WHERE

    ORDER BY order_id;'
  solution: SELECT order_id, region, order_total FROM orders WHERE region IN ('East', 'West') AND order_total >= 100 ORDER
    BY order_id;
  hints:
  - Focus on IN and compound filters.
  - Build the result one clause at a time.
  - Read the task again and identify where **IN and compound filters** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT order_id, region, order_total FROM orders WHERE region IN ('East', 'West') AND order_total >= 100
      ORDER BY order_id;
    required_patterns:
    - \bIN\s*\(
    - \bAND\b
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 7
  presentation:
