  prompt: ''
  instruction:
    title: Learn — Basic Filtering
    objective: Explain advanced filtering patterns.
    body: '# Write readable filters for common business questions


      A `WHERE` clause keeps only rows that meet a condition. Useful patterns include `IN` for several allowed values, `BETWEEN`
      for a range, and `LIKE` for text patterns.


      A clear filter describes the business rule directly. Check boundary values and remember that text comparisons and date
      rules may behave differently across SQL systems.


      In this lesson, you will choose concise filtering patterns and inspect the returned rows before trusting a count or
      total.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
