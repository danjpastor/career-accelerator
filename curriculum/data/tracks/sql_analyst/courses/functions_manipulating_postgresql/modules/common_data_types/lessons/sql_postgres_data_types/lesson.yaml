    objective: Study a worked example before solving a different task.
    body: '## A separate example


      Postal code `00712` should be stored as text. If converted to an integer, the leading zero disappears, and adding two
      postal codes would have no useful business meaning.


      A price stored as text, however, may need to be cast to a numeric type before calculating a total.


      **What to notice:** The correct type depends on how the value is used, not only on which characters it contains.'
