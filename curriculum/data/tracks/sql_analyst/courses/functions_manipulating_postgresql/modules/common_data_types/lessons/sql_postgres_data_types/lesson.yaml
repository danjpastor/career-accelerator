  prompt: ''
  instruction:
    title: Learn — Overview of Common Data Types
    objective: Explain overview of common data types.
    body: '# Store and compare values according to their meaning


      A data type tells the database how a value should behave. Numbers can be calculated, dates can be compared by time,
      text can preserve formatting, and Boolean values represent true or false.


      An identifier that contains leading zeroes should often be text, even when it looks numeric. Converting a value with
      `CAST` is useful when the stored type does not match the operation you need.


      In this lesson, you will choose types based on meaning and convert values deliberately.'
  presentation:
    scenario: A short Academy lesson
