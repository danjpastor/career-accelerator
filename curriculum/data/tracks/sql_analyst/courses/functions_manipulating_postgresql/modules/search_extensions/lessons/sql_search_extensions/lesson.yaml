  instruction:
    title: Learn — Full-Text Search and PostgreSQL Extensions
    objective: Explain full-text search and postgresql extensions.
    body: '# Understand specialized database features


      Simple `LIKE` searches scan text for a pattern. Full-text search breaks documents into searchable terms and can rank results by relevance. Database extensions add optional features that are not part of the basic SQL language.


      These tools can be powerful, but they are dialect-specific. An analyst should understand what the feature does, whether it is available, and how portable the query needs to be.


      In this lesson, you will choose between basic text matching and specialized search features.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning full-text search and postgresql extensions before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
