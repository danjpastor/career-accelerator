  instruction:
    title: Learn — Working with DATE/TIME Functions and Operators
    objective: Explain working with date/time functions and operators.
    body: '# Turn timestamps into useful business periods


      Date and time functions can extract parts of a date, calculate intervals, and group timestamps into periods such as
      day, month, or quarter.


      A timestamp includes both a date and a time. Truncating it to a month creates a shared period value for grouping. Date
      boundaries and time zones should be stated clearly when they affect the result.


      In this lesson, you will build period-based summaries and calculate elapsed time.'
