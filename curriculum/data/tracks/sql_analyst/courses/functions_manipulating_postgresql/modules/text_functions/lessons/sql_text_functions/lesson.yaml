    title: Learn — Parsing and Manipulating Text
    objective: Explain parsing and manipulating text.
    body: '# Standardize and extract useful parts of text


      Text functions can change case, remove extra spaces, combine fields, find patterns, and extract a portion of a string.


      Text cleaning should be purposeful. Preserve the original value when the transformation may need to be audited, and confirm that the pattern works for more than one example.


      In this lesson, you will create clear display fields and parse structured text without changing the source table.'
