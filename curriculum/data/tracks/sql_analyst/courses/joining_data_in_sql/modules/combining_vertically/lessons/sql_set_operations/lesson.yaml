- activity_id: academy2_sql_set_operations_example
  title: Example — See stacking rows with union in context
  type: recognition
  runtime: content
  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See stacking rows with union in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      Two regional systems store the same fields.


      ```sql

      SELECT customer_id, signup_date, ''East'' AS source_region FROM east_customers

      UNION ALL

      SELECT customer_id, signup_date, ''West'' AS source_region FROM west_customers;

      ```


      **What to notice:** The source label keeps the origin visible, and `UNION ALL` preserves every record.'
