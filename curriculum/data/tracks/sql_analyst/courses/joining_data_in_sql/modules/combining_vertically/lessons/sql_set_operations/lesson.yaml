  prompt: ''
  instruction:
    title: Learn — Stacking Rows with UNION
    objective: Explain combining results with union.
    body: '# Combine compatible result sets vertically


      `UNION` stacks the rows from one query below the rows from another. The queries must return the same number of columns
      in the same order, with compatible data types.


      `UNION` removes duplicate rows. `UNION ALL` keeps them and is usually faster. Choose deliberately based on whether duplicates
      are meaningful.


      In this lesson, you will align two result sets and preserve or remove duplicates for a stated reason.'
