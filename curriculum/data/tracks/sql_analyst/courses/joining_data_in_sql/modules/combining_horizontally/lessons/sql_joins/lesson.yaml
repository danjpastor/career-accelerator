- activity_id: academy2_sql_joins_guided
  title: Connect orders to support tickets
  type: guided
  runtime: sql
  prompt: Return order_id, customer_id, and ticket_id for every order. Sort by order_id and ticket_id.
  starter: 'SELECT o.order_id, o.customer_id, t.ticket_id

    FROM orders AS o

    -- join support_tickets as t'
  solution: SELECT o.order_id, o.customer_id, t.ticket_id FROM orders AS o LEFT JOIN support_tickets AS t ON o.customer_id = t.customer_id ORDER BY o.order_id, t.ticket_id;
  hints:
  - Focus on LEFT JOIN.
  - Build the result one clause at a time.
  - Read the task again and identify where **LEFT JOIN** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
