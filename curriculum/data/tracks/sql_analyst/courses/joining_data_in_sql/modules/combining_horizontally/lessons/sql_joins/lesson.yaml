  instruction:
    title: Example — See keeping matching rows with inner join in context
    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nA Repairs table contains Equipment ID, while Equipment contains the model name.\n\n```sql\nSELECT r.repair_id, e.model_name\nFROM repairs AS r\nINNER JOIN equipment AS e\n  ON r.equipment_id = e.equipment_id;\n```\n\n**What to notice:** Repairs with an unknown Equipment ID do not appear. The join adds descriptive information to matching repair rows."
