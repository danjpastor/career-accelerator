  prompt: ''
  instruction:
    title: Learn — Keeping Matching Rows with INNER JOIN
    objective: Explain joining related tables.
    body: '# Combine rows that have a match in both tables


      An `INNER JOIN` connects related tables and keeps only rows whose join condition matches on both sides.


      The columns used to match are often IDs. Before joining, identify the grain and check whether the key is unique on either side. A one-to-many relationship can produce several result rows for one record from the “one” table.


      In this lesson, you will join related tables and validate the result row count instead of assuming the match is correct.'
    concept_heading: Go with the Grain
  presentation:
    scenario: A beginner is learning keeping matching rows with inner join before using it in real analysis.
