- activity_id: academy2_sql_joins_independent
  title: Count support tickets per ordering customer
  type: independent
  runtime: sql
  prompt: Return customer_id and ticket_count for every customer in orders. Sort by customer_id.
  starter: "SELECT o.customer_id,\nFROM orders AS o\nLEFT JOIN support_tickets AS t\n  ON o.customer_id = t.customer_id\nGROUP BY o.customer_id;"
  solution: SELECT o.customer_id, COUNT(t.ticket_id) AS ticket_count FROM orders AS o LEFT JOIN support_tickets AS t ON o.customer_id = t.customer_id GROUP BY o.customer_id ORDER BY o.customer_id;
  hints:
