  prompt: ''
  instruction:
    title: Learn — Joining on Multiple Columns
    objective: Explain joining on multiple columns.
    body: '# Match rows with a composite key


      Sometimes one column is not enough to identify a related row. A **composite key** uses a combination of columns, such as Store ID plus Product ID or Account ID plus Month.


      Leaving out part of the key can create false matches and duplicate rows. Confirm that the chosen combination has the uniqueness the relationship expects.


      In this lesson, you will join on several columns and compare row counts before and after the join.'
    concept_heading: Ask for the Columns You Need
  presentation:
    scenario: A beginner is learning joining on multiple columns before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how joining on multiple columns works and why an analyst would use it.
