- activity_id: academy2_sql_multi_column_join_independent
  title: Calculate target variance
  type: independent
  runtime: sql
  prompt: Return region, month_start, and variance_to_target as sales_total - sales_target. Sort by region and month_start.
  starter: "SELECT s.region, s.month_start,\n       \nFROM monthly_sales AS s\nJOIN monthly_targets AS t\n  ON \nORDER BY s.region, s.month_start;"
  solution: SELECT s.region, s.month_start, s.sales_total - t.sales_target AS variance_to_target FROM monthly_sales AS s INNER JOIN monthly_targets AS t ON s.region = t.region AND s.month_start = t.month_start ORDER BY s.region, s.month_start;
  hints:
  - Start from the requested result grain, then apply composite-key join metrics.
  - Read the task again and identify where **composite-key join metrics** fits into the requested result.
  - Focus on the named table or source (['monthly_sales', 'monthly_targets']) and check each requirement one at a time.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT s.region, s.month_start, s.sales_total - t.sales_target AS variance_to_target FROM monthly_sales AS s INNER JOIN monthly_targets AS t ON s.region = t.region AND s.month_start = t.month_start ORDER BY s.region, s.month_start;
    required_patterns:
    - sales_total\s*-\s*t\.sales_target
    - \bAND\b
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
