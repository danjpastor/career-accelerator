- activity_id: academy2_sql_multi_column_join_guided
  title: Compare sales with targets
  type: guided
  runtime: sql
  prompt: Return region, month_start, sales_total, and sales_target by joining monthly_sales to monthly_targets on region and month_start. Sort by region and month_start.
  starter: "SELECT s.region, s.month_start, s.sales_total, t.sales_target\nFROM monthly_sales AS s\nJOIN monthly_targets AS t\n  ON s.region = t.region\n AND s.month_start = t.month_start\nORDER BY s.region, s.month_start;"
  solution: SELECT s.region, s.month_start, s.sales_total, t.sales_target FROM monthly_sales AS s INNER JOIN monthly_targets AS t ON s.region = t.region AND s.month_start = t.month_start ORDER BY s.region, s.month_start;
  hints:
  - Identify where multi-column joins belongs in the query.
  - Build the query one clause at a time.
  - Read the task again and identify where **multi-column joins** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT s.region, s.month_start, s.sales_total, t.sales_target FROM monthly_sales AS s INNER JOIN monthly_targets AS t ON s.region = t.region AND s.month_start = t.month_start ORDER BY s.region, s.month_start;
    required_patterns:
    - JOIN\s+monthly_targets
    - s\.region\s*=\s*t\.region
    - s\.month_start\s*=\s*t\.month_start
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 7
  presentation:
    scenario: The commercial analytics team needs a reliable answer for an upcoming business review.
    introduction: Write and run your own solution. Use the lesson example as a guide, not as an answer to copy.
    task: Return region, month_start, sales_total, and sales_target by joining monthly_sales to monthly_targets on region and month_start. Sort by region and month_start.
    tables:
    - monthly_sales
    - monthly_targets
    requirements:
    - Return the requested columns and metrics.
    - Keep the result readable and deterministic.
    expected_output: A validated result with the requested rows and columns.
    skills_practiced:
    - multi-column joins
    after_correct: Your query returns the requested result and uses the intended SQL pattern.
    common_errors: []
  instruction:
