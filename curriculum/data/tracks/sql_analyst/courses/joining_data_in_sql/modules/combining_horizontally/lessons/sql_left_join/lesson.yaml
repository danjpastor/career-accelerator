    body: "## A separate example\n\nA manager needs every employee, including employees with no completed training.\n\n```sql\nSELECT e.employee_id, e.employee_name, t.course_name\nFROM employees AS e\nLEFT JOIN training AS t\n  ON e.employee_id = t.employee_id;\n```\n\n**What to notice:** Employees without training remain in the result, and their course name is `NULL`."
