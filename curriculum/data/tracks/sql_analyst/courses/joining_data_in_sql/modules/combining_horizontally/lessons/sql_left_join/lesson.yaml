- activity_id: academy2_sql_left_join_independent
  title: Find customers without orders
  type: independent
  runtime: sql
  prompt: Return customer_id and customer_name for customers with no matching order. Sort by customer_id.
  starter: "SELECT c.customer_id, c.customer_name\nFROM customers AS c\nLEFT JOIN orders AS o\n  ON c.customer_id = o.customer_id\nWHERE \nORDER BY c.customer_id;"
