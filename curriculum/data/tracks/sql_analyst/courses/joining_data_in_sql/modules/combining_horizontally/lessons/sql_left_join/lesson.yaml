  prompt: ''
  instruction:
    title: Learn — Keeping All Rows with LEFT JOIN
    objective: Explain keeping all rows with left join.
    body: '# Keep every row from the table you start with


      A `LEFT JOIN` keeps every row from the left table and adds matching values from the right table. When no match exists, the right-side fields are `NULL`.


      This is useful when the starting population must be preserved, such as every customer, every product, or every calendar date. It can also reveal missing relationships.


      In this lesson, you will choose which table belongs on the left and use unmatched rows as a quality check.'
    concept_heading: Go with the Grain
  presentation:
    scenario: A beginner is learning keeping all rows with left join before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
