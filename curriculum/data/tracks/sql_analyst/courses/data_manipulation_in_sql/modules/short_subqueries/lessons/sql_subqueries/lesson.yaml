  prompt: ''
  instruction:
    title: Learn — Subqueries
    objective: Explain subqueries.
    body: '# Use one query''s result inside another query


      A **subquery** is a query nested inside another query. It can calculate a benchmark, define an eligible group, or provide
      a small result that the outer query uses.


      Read from the inside out: first understand what the inner query returns, then how the outer query uses it. A scalar
      subquery must return one value; a list subquery may return several.


      In this lesson, you will use nested queries without losing track of the result grain.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.subqueries
  validator: {}
  hints: []
  solution: ''
