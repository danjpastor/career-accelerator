  prompt: ''
  instruction:
    title: Example — See subqueries in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A manager wants products priced above the overall average.


      ```sql

      SELECT product_id, product_name, price

      FROM products

      WHERE price > (SELECT AVG(price) FROM products);

      ```


      **What to notice:** The inner query returns one average. The outer query compares each product with that benchmark.'
  presentation:
    scenario: A separate worked example
