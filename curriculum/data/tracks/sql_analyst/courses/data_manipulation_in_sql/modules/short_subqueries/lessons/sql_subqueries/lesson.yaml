- activity_id: academy2_sql_subqueries_guided
  title: Find above-average orders
  type: guided
  runtime: sql
  prompt: Return order_id and order_total for orders above the overall average order_total. Sort by order_id.
  starter: "SELECT order_id, order_total\nFROM orders\nWHERE order_total > (\n    -- calculate the overall average\n)\nORDER\
    \ BY order_id;"
  solution: SELECT order_id, order_total FROM orders WHERE order_total > (SELECT AVG(order_total) FROM orders) ORDER BY order_id;
  hints:
  - Focus on scalar subquery.
  - Build the result one clause at a time.
  - Read the task again and identify where **scalar subquery** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT order_id, order_total FROM orders WHERE order_total > (SELECT AVG(order_total) FROM orders) ORDER
      BY order_id;
    required_patterns:
    - WHERE.+\(\s*SELECT
    - AVG\s*\(
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
