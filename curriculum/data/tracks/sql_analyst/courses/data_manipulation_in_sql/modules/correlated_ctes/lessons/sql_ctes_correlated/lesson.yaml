    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nAn analyst first summarizes sales by store in a CTE, then compares each store with the\
      \ company average in the final query.\n\n```sql\nWITH store_sales AS (\n    SELECT store_id, SUM(amount) AS sales\n\
      \    FROM transactions\n    GROUP BY store_id\n)\nSELECT store_id, sales\nFROM store_sales\nWHERE sales > (SELECT AVG(sales)\
      \ FROM store_sales);\n```\n\n**What to notice:** The named step can be read and tested separately before the final comparison."
