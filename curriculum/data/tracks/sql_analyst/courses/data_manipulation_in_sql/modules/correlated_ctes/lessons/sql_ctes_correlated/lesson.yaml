  instruction:
    title: Learn — Correlated Queries and CTEs
    objective: Explain correlated queries and ctes.
    body: '# Organize multi-step SQL and calculate row-specific comparisons


      A **common table expression**, or CTE, is a named query placed after `WITH`. It breaks a long query into understandable
      steps.


      A **correlated subquery** refers to a value from the outer row, so it is evaluated in that row''s context. It can be
      useful, but may be harder to read or slower than a join or window function.


      In this lesson, you will choose a structure that makes multi-step logic easier to explain and maintain.'
