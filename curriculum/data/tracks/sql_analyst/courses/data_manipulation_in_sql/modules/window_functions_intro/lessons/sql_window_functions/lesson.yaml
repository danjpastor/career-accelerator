- activity_id: academy2_sql_window_functions_guided
  title: Number orders within each region
  type: guided
  runtime: sql
  prompt: Return order_id, region, order_total, and region_order_number using ROW_NUMBER ordered by order_total descending
    within each region. Sort the final result by region and region_order_number.
  starter: "SELECT order_id, region, order_total,\n       ROW_NUMBER() OVER (\n       ) AS region_order_number\nFROM orders;"
  solution: SELECT order_id, region, order_total, ROW_NUMBER() OVER (PARTITION BY region ORDER BY order_total DESC) AS region_order_number
    FROM orders ORDER BY region, region_order_number;
  hints:
  - Focus on ROW_NUMBER and PARTITION BY.
  - Build the result one clause at a time.
