  prompt: ''
  instruction:
    title: Learn — Window Functions
    objective: Explain window functions.
    body: '# Add comparisons without collapsing detailed rows


      A window function calculates across related rows while keeping each original row in the result. This differs from `GROUP
      BY`, which usually collapses rows into one row per group.


      The `OVER` clause defines the window. `PARTITION BY` creates groups, and `ORDER BY` defines sequence within each group.


      In this lesson, you will add rankings and running calculations while preserving row-level detail.'
