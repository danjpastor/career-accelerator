- activity_id: academy2_sql_window_functions_example
  title: Example — See window functions in context
  type: recognition
  runtime: content
  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See window functions in context
    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nA sales table needs each transaction plus its rank within the salesperson.\n\n```sql\n\
      SELECT\n    salesperson_id,\n    sale_id,\n    amount,\n    RANK() OVER (\n        PARTITION BY salesperson_id\n   \
      \     ORDER BY amount DESC\n    ) AS sale_rank\nFROM sales;\n```\n\n**What to notice:** Every sale remains visible,\
      \ and the rank restarts for each salesperson."
  presentation:
