  instruction:
    title: Example — See business rules with case in context
    objective: Study a worked example before solving a different task.
    body: "## A separate example\n\nA loyalty program labels customers by annual spend.\n\n```sql\nCASE\n    WHEN annual_spend >= 5000 THEN 'Platinum'\n    WHEN annual_spend >= 2000 THEN 'Gold'\n    WHEN annual_spend >= 500 THEN 'Silver'\n    ELSE 'Standard'\nEND\n```\n\n**What to notice:** A customer with 6,000 matches several conditions, so the highest tier must appear first."
    concept_heading: Make the Data Consistent
