  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Business Rules with CASE
    objective: Explain business rules with case.
    body: '# Translate ordered business rules into SQL


      `CASE` evaluates conditions from top to bottom and returns the result for the first true condition. It can create labels, flags, and bands inside a query.


      Overlapping rules must be ordered from most specific to least specific. A final `ELSE` makes unmatched rows explicit.


      In this lesson, you will turn a written policy into transparent query logic and test boundary cases.'
    concept_heading: Business Rules with CASE
  presentation:
    scenario: A beginner is learning business rules with case before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how business rules with case works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - sql.case_logic
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
