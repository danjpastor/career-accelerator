- activity_id: academy2_sql_case_business_rules_guided
  title: Label order workflow status
  type: guided
  runtime: sql
  prompt: 'Return order_id and a workflow_label: ''Done'' for Completed, ''Active'' for Processing, otherwise ''Review''. Sort by order_id.'
  starter: "SELECT order_id,\n       CASE\n       END AS workflow_label\nFROM orders\nORDER BY order_id;"
  solution: SELECT order_id, CASE WHEN status = 'Completed' THEN 'Done' WHEN status = 'Processing' THEN 'Active' ELSE 'Review' END AS workflow_label FROM orders ORDER BY order_id;
  hints:
  - Focus on searched CASE.
  - Build the result one clause at a time.
  - Read the task again and identify where **searched CASE** fits into the requested result.
  validator:
    type: sql_result
    dataset_id: sql_foundations
    expected_query: SELECT order_id, CASE WHEN status = 'Completed' THEN 'Done' WHEN status = 'Processing' THEN 'Active' ELSE 'Review' END AS workflow_label FROM orders ORDER BY order_id;
    required_patterns:
    - CASE\s+WHEN
    - ELSE
    - END\s+AS
    forbidden_patterns: []
    order_sensitive: true
    column_sensitive: true
  required_for_practice: true
