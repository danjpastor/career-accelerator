  prompt: ''
  instruction:
    title: Learn — Dimensional Modeling
    objective: Explain the purpose of dimensional modeling.
    body: 'A dimensional model separates measurable business events from descriptive context. A **fact table** contains events
      and numbers, such as orders and revenue. A **dimension table** contains descriptive fields, such as customer segment,
      product category, or calendar month.


      Relationships allow dimension selections to filter the fact table. For a simple star model, single-direction filtering
      from dimension to fact is usually the easiest behavior to understand. Bidirectional filtering can be useful in special
      cases, but it can also create confusing or ambiguous paths.


      Good models make measures easier to write and totals easier to trust.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - powerbi.dimensional_modeling
  validator: {}
