  instruction:
    title: Example — See dimensional modeling in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A training model uses `Attendance` as a fact table and `Employees`, `Courses`, and `Calendar` as dimensions. Choosing
      a department in Employees filters attendance records, while attendance does not automatically rewrite the list of employees.
      This one-way flow keeps the model predictable.


      **What to notice:** The example teaches the method, while the graded task uses different data and asks you to make the
      decisions yourself.'
