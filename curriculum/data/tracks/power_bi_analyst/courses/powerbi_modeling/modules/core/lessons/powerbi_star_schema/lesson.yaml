  prompt: ''
  instruction:
    title: Learn — Star and Snowflake Schemas
    objective: Explain the purpose of star and snowflake schemas.
    body: 'A **star schema** places a fact table at the center and connects it directly to descriptive dimensions. The shape is simple, which helps Power BI filter efficiently and helps analysts understand where each field belongs.


      A **snowflake schema** splits a dimension into additional related tables. Snowflaking can reduce repeated descriptive data, but it also adds relationships and makes the model harder for beginners to follow. For reporting, a clean star schema is often the better starting point.


      Measures should normally aggregate values from the fact table, while labels and slicers come from dimensions.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning star and snowflake schemas before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how star and snowflake schemas works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - powerbi.star_schema
  validator: {}
