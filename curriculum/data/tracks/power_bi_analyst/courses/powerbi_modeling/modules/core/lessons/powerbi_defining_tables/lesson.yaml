  prompt: ''
  instruction:
    title: Learn — Defining Tables
    objective: Explain the purpose of defining tables.
    body: 'A reliable model begins with a clear definition of what each table represents. The **grain** tells you what one
      row means. A customer table may have one row per customer, while an orders table has one row per order and can repeat
      the same customer ID.


      A key identifies or connects records. The unique key belongs on the **one** side of a relationship. The repeating key
      belongs on the **many** side. Before creating a relationship, check for duplicates, blanks, and unmatched values. Power
      BI may allow a relationship that looks reasonable but produces misleading totals when the grain is misunderstood.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
