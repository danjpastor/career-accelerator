lesson_id: academy2_powerbi_defining_tables
title: Defining Tables
order: 1
difficulty: beginner
description: A reliable model begins with a clear definition of what each table represents. The **grain** tells you what one
  row means. A customer table may have one row per customer, while an orders table has one row per order and can repeat the
  same customer ID.
estimated_minutes: 36
content: lesson.md
objectives:
- Explain the purpose of defining tables.
- Choose an appropriate action in a realistic analyst workflow.
key_takeaways:
- Defining Tables supports a reliable, explainable analytics workflow.
