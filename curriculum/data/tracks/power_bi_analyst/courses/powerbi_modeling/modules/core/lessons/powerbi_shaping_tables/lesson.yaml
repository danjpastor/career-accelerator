  prompt: ''
  instruction:
    title: Learn — Shaping Tables
    objective: Explain the purpose of shaping tables.
    body: 'Shaping data means changing its structure so it is easier to analyze. In Power Query, you can rename fields, remove columns, split text, pivot or unpivot values, append similar tables, and merge related tables.


      **Append** stacks rows from tables with the same kind of records. **Merge** matches columns between related tables. A left outer merge keeps every row from the first table and brings in matching values from the second. Always compare row counts before and after a merge so you can spot lost or duplicated records.'
    concept_heading: Shaping Tables
  presentation:
    scenario: A beginner is learning shaping tables before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how shaping tables works and why an analyst would use it.
