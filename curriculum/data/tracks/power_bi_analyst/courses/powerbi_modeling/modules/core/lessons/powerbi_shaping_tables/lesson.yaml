  instruction:
    title: Example — See shaping tables in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A company receives one monthly expense file per office. The analyst appends the files because every file contains the same columns. They later merge the combined expenses with an office lookup table to add region names. A left outer merge keeps every expense even when one office code is missing from the lookup.


      **What to notice:** The example teaches the method, while the graded task uses different data and asks you to make the decisions yourself.'
    concept_heading: Make the Data Consistent
