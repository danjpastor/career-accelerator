lesson_id: academy2_powerbi_shaping_tables
title: Shaping Tables
order: 2
difficulty: beginner
description: Shaping data means changing its structure so it is easier to analyze. In Power Query, you can rename fields, remove columns, split text, pivot or unpivot values, append similar tables, and merge related tables.
