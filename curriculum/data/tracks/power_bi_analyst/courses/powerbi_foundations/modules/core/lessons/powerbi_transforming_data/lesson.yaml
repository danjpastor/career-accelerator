  prompt: ''
  instruction:
    title: Learn — Transforming Data
    objective: Explain the purpose of transforming data.
    body: 'Power Query is Power BI''s preparation area. It records each cleaning action as an **Applied Step** so the same work can run again when the source refreshes.


      Common steps include changing data types, removing unused columns, replacing inconsistent values, splitting text, filtering invalid rows, and combining tables. The order of the steps matters. For example, a date calculation cannot work reliably until the source column has a date type.


      Power Query does not rewrite the original CSV or Excel file. It creates a repeatable set of instructions that shapes the data before it is loaded into the model.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning transforming data before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how transforming data works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - powerbi.power_query
