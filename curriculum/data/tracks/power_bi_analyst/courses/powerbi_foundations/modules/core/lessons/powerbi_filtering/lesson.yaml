lesson_id: academy2_powerbi_filtering
title: Filtering and Interaction
order: 4
difficulty: beginner
description: 'Filters narrow the data used by a visual or report. Power BI supports filters at several levels: one visual, one page, or the entire report. A **slicer** is a filter control placed directly on the report so the reader can change the view.'
estimated_minutes: 36
content: lesson.md
objectives:
- Explain the purpose of filtering and interaction.
- Choose an appropriate action in a realistic analyst workflow.
key_takeaways:
- Filtering and Interaction supports a reliable, explainable analytics workflow.
teaches:
- powerbi.filters
requires:
- powerbi.visuals
mastery:
  passing_score: 1.0
