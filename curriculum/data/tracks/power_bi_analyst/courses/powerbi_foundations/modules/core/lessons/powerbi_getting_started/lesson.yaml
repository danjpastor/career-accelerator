  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See getting started with power bi in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A support manager receives a CSV containing ticket date, team, status, and resolution time. The analyst first imports
      the file and checks the row count in Data view. They use Power Query to set the date and duration types, Model view
      to inspect relationships, and Report view to build a workload chart. Each view supports a different part of the same
      workflow.


      The graded task uses an orders file instead, so focus on choosing the right view and checking the source before building
      a report.


      **What to notice:** The example teaches the method, while the graded task uses different data and asks you to make the
      decisions yourself.'
