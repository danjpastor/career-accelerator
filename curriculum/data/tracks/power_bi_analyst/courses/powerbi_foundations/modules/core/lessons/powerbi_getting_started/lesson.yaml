lesson_id: academy2_powerbi_getting_started
title: Getting Started with Power BI
order: 1
difficulty: beginner
description: Power BI Desktop has several work areas because an analyst does different kinds of work at different times.
estimated_minutes: 36
content: lesson.md
objectives:
- Explain the purpose of getting started with power bi.
- Choose an appropriate action in a realistic analyst workflow.
key_takeaways:
- '**Report view** is where you arrange charts, cards, slicers, and text on report pages.'
- '**Data view** lets you inspect the rows and columns already loaded into the model.'
- '**Model view** shows tables and the relationships between them.'
- '**Power Query Editor** is where you clean and reshape data before it reaches the model.'
teaches:
- powerbi.interface
requires:
- sql.window_functions
- roadmap.sql_mastery
mastery:
  passing_score: 1.0
