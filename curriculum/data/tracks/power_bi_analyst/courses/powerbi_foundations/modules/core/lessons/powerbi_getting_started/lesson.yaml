  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Getting Started with Power BI
    objective: Explain the purpose of getting started with power bi.
    body: 'Power BI Desktop has several work areas because an analyst does different kinds of work at different times.


      - **Report view** is where you arrange charts, cards, slicers, and text on report pages.

      - **Data view** lets you inspect the rows and columns already loaded into the model.

      - **Model view** shows tables and the relationships between them.

      - **Power Query Editor** is where you clean and reshape data before it reaches the model.


      A safe beginner workflow is: connect to a source, inspect it, transform what needs cleaning, build relationships, create
      calculations, design visuals, and validate the result. You do not need to memorize every button. You do need to know
      which work area matches the job you are trying to do.'
  presentation:
    scenario: A short Academy lesson
