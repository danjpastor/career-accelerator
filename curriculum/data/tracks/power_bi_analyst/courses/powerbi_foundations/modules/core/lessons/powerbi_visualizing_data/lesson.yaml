lesson_id: academy2_powerbi_visualizing_data
title: Visualizing Data
order: 3
difficulty: beginner
description: A visual should match the question the reader is trying to answer.
estimated_minutes: 36
content: lesson.md
objectives:
- Explain the purpose of visualizing data.
- Choose an appropriate action in a realistic analyst workflow.
key_takeaways:
- Use a **bar or column chart** to compare categories.
- Use a **line chart** to show change over time.
- Use a **card** for one important number.
- Use a **table or matrix** when the exact row-level values matter.
teaches:
- powerbi.visuals
requires:
- powerbi.power_query
mastery:
  passing_score: 1.0
activities:
- activity_id: academy2_powerbi_visualizing_data_learn
  title: Learn — Visualizing Data
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Visualizing Data
    objective: Explain the purpose of visualizing data.
    body: 'A visual should match the question the reader is trying to answer.


      - Use a **bar or column chart** to compare categories.

      - Use a **line chart** to show change over time.

      - Use a **card** for one important number.

      - Use a **table or matrix** when the exact row-level values matter.


      The fields placed on the axis, legend, and values areas control what the visual means. Power BI may automatically sum
      a numeric field, but you should always confirm the summarization. A chart can look polished and still answer the wrong
      question if it counts rows when the manager asked for revenue.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - powerbi.visuals
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
