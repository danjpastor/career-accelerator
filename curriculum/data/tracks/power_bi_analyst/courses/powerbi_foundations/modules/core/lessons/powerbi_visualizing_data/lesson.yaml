  instruction:
    title: Example — See visualizing data in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A facilities analyst wants to compare maintenance cost across buildings. A column chart uses Building on the axis and
      Sum of Cost as the value. A line chart would imply a time sequence that is not part of the question. Before sharing
      the chart, the analyst checks the field aggregation and sorts the buildings by cost.


      **What to notice:** The example teaches the method, while the graded task uses different data and asks you to make the
      decisions yourself.'
