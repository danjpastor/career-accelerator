  prompt: ''
  instruction:
    title: Learn — Python Lists
    objective: Explain the purpose of python lists.
    body: 'A **list** stores several values in a specific order. Lists are useful for a small sequence such as daily counts, region names, or review statuses.


      ```python

      wait_times = [4, 7, 3, 9]

      ```


      Python positions begin at 0, so `wait_times[0]` returns the first value. A **slice** selects part of a list: `wait_times[-2:]` returns the final two values. Functions such as `sum()`, `len()`, `min()`, and `max()` can summarize numeric lists.'
    concept_heading: Keep Related Values Together
  presentation:
    scenario: A beginner is learning python lists before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how python lists works and why an analyst would use it.
