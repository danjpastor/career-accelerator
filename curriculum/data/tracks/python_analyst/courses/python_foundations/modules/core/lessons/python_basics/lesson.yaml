  prompt: ''
  instruction:
    title: Learn — Python Basics
    objective: Explain the purpose of python basics.
    body: 'Python lets an analyst describe a calculation as a series of repeatable instructions. A **variable** gives a value
      a name so you can use it again later.


      ```python

      revenue = 900

      costs = 650

      profit = revenue - costs

      ```


      Python uses `=` to assign a value and `==` to compare two values. Common value types include integers, decimal numbers
      called floats, text strings, and Boolean values (`True` or `False`). Clear variable names make the business meaning
      of the code easier to review.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
