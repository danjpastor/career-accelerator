    task: Create variables named `revenue` and `costs` with values 1250 and 800. Create a third variable named `profit` by
      subtracting costs from revenue.
    requirements:
    - Use the variable names requested by the task.
    - Calculate the result with Python rather than typing the final answer.
    - Run the code, read the feedback, and revise it when needed.
    expected_output: Working Python code that creates the requested result.
    success_criteria: The code runs and the named variables or DataFrame contain the expected values.
    skills_practiced:
    - Python for analysis
    after_correct: Your code produced the result from reusable instructions rather than a manually typed answer.
  instruction:
