- activity_id: academy2_python_basics_independent
  title: Practice — Calculate an average order value
  type: independent
  runtime: python
  step_kind: independent_practice
  completion_mode: validated
  xp: 125
  estimated_minutes: 10
  prompt: A team completed 18 orders worth 2,430 in total. Store those values in clear variables and calculate `average_order_value`.
