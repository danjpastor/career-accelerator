- activity_id: academy2_python_basics_guided
  title: Try It — Calculate a simple profit
  type: guided
  runtime: python
  step_kind: guided_practice
  completion_mode: validated
  xp: 100
  estimated_minutes: 7
  prompt: Create variables named `revenue` and `costs` with values 1250 and 800. Create a third variable named `profit` by
    subtracting costs from revenue.
  starter: '# Create the three variables below.'
  solution: 'revenue = 1250

    costs = 800

    profit = revenue - costs'
  hints:
  - Name each value or result exactly as the task requests so the checker can find it.
  - Build the result from the provided variables or DataFrame instead of typing the finished answer.
  - Run the code first. Read the error or output, then change only the part that does not match the task.
  validator:
    type: python_checks
    checks:
    - expression: revenue == 1250
      feedback: Set revenue to 1250.
    - expression: costs == 800
      feedback: Set costs to 800.
    - expression: profit == 450
      feedback: Calculate profit from the two variables instead of typing an unrelated value.
    display_variable: profit
    success_feedback: Your code runs and produces the requested result. Notice how the result comes from the code, so it can
      update when the inputs change.
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
  difficulty: beginner
  answer_options: []
  presentation:
    scenario: Python analyst practice
