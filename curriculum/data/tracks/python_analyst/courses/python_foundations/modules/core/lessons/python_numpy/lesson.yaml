  prompt: ''
  instruction:
    title: Learn — NumPy Arrays
    objective: Explain the purpose of numpy arrays.
    body: 'NumPy stores numeric values in an **array**. Arrays look similar to lists, but they are designed for fast, consistent
      calculations across many values.


      ```python

      import numpy as np

      scores = np.array([82, 91, 76])

      score_average = scores.mean()

      ```


      A comparison such as `scores >= 80` creates a Boolean mask. Using that mask inside brackets keeps only the matching
      values. This is called vectorized work because one expression operates across the whole array.'
