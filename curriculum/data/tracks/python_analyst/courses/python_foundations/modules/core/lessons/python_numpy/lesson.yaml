- activity_id: academy2_python_numpy_independent
  title: Practice — Filter an array with a condition
  type: independent
  runtime: python
  step_kind: independent_practice
  completion_mode: validated
  xp: 125
  estimated_minutes: 10
  prompt: From the provided `order_values` array, create `large_orders` containing only values greater than 150. Use a Boolean
    condition on the array.
  starter: 'import numpy as np


    order_values = np.array([145, 89, 210, 175, 35])

    # Create large_orders.'
  solution: 'import numpy as np


    order_values = np.array([145, 89, 210, 175, 35])

    large_orders = order_values[order_values > 150]'
