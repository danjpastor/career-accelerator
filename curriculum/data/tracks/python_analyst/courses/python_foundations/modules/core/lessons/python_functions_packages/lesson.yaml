  instruction:
    title: Learn — Functions and Packages
    objective: Explain the purpose of functions and packages.
    body: "A **function** groups a repeatable set of instructions behind a meaningful name. Inputs are called parameters,\
      \ and `return` sends the result back to the caller.\n\n```python\ndef calculate_rate(completed, total):\n    if total\
      \ == 0:\n        return 0\n    return completed / total\n```\n\nFunctions reduce copy-and-paste errors and make a calculation\
      \ easier to test. A **package** is a collection of reusable code written by other developers. You import only the tools\
      \ you need, such as `numpy` for array calculations or `pandas` for tables."
