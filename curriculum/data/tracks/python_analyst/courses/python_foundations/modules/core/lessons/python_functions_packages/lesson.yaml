- activity_id: academy2_python_functions_packages_independent
  title: Practice — Calculate a reusable margin
  type: independent
  runtime: python
  step_kind: independent_practice
  completion_mode: validated
  xp: 125
  estimated_minutes: 10
  prompt: Write `profit_margin(revenue, costs)` so it returns profit divided by revenue. Return 0 when revenue is 0 so the
    function does not raise a division error.
  starter: "def profit_margin(revenue, costs):\n    # Handle zero revenue, then calculate the margin.\n    pass"
  solution: "def profit_margin(revenue, costs):\n    if revenue == 0:\n        return 0\n    return (revenue - costs) / revenue"
  hints:
  - Name each value or result exactly as the task requests so the checker can find it.
  - Build the result from the provided variables or DataFrame instead of typing the finished answer.
  - Run the code first. Read the error or output, then change only the part that does not match the task.
  validator:
    type: python_checks
    checks:
    - expression: abs(profit_margin(1000, 750) - 0.25) < 1e-9
      feedback: For positive revenue, return (revenue - costs) divided by revenue.
    - expression: profit_margin(0, 50) == 0
      feedback: Add a check that returns 0 when revenue is 0.
    display_variable: ''
    success_feedback: Your code runs and produces the requested result. Notice how the result comes from the code, so it can
      update when the inputs change.
  required_for_completion: true
  required_for_practice: false
  required_for_mastery: true
  difficulty: beginner
  answer_options: []
  presentation:
    scenario: Python analyst practice
    introduction: Write and run a small piece of Python. The example uses different values from this exercise.
    task: Write `profit_margin(revenue, costs)` so it returns profit divided by revenue. Return 0 when revenue is 0 so the
      function does not raise a division error.
    requirements:
    - Use the variable names requested by the task.
    - Calculate the result with Python rather than typing the final answer.
    - Run the code, read the feedback, and revise it when needed.
    expected_output: Working Python code that creates the requested result.
    success_criteria: The code runs and the named variables or DataFrame contain the expected values.
    skills_practiced:
    - Python for analysis
    after_correct: Your code produced the result from reusable instructions rather than a manually typed answer.
  instruction:
    title: Practice — Calculate a reusable margin
    objective: Use Python to produce a small, checkable analyst result.
    approach: Read the requested variable names, build the result one line at a time, and use **Run** before **Check Answer**.
    watch_for: Python is case-sensitive. Check spelling, indentation, parentheses, and column names carefully.
