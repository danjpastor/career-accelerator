  prompt: ''
  instruction:
    title: Learn — Slicing and Indexing DataFrames
    objective: Explain the purpose of slicing and indexing dataframes.
    body: 'Filtering selects rows that meet a condition. Column selection keeps only the fields needed for the next task.


      ```python

      open_high = tickets[(tickets["status"] == "Open") & (tickets["priority"] == "High")]

      review = open_high[["ticket_id", "team", "opened_date"]]

      ```


      Use `&` for AND and `|` for OR, with each condition inside parentheses. `.loc` can select rows and columns explicitly. A focused result is easier to review than carrying every source column into every step.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning slicing and indexing dataframes before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
