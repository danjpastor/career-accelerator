  prompt: ''
  instruction:
    title: Learn — Creating and Visualizing DataFrames
    objective: Explain the purpose of creating and visualizing dataframes.
    body: 'A useful chart begins with a clear question and chart-ready data. Usually you summarize or filter the DataFrame
      first, then plot the smaller result.


      Bar charts compare categories, line charts show change over time, histograms show a numeric distribution, and scatter
      plots compare two numeric measures. Labels and sorting should help the reader understand the result without guessing.


      pandas plotting returns a Matplotlib axes object. Saving that object in a variable lets you adjust labels or inspect
      the chart later.'
  presentation:
