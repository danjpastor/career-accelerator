- activity_id: academy2_pandas_visualization_independent
  title: Practice — Create a clear bar chart
  type: independent
  runtime: python
  step_kind: independent_practice
  completion_mode: validated
  xp: 125
  estimated_minutes: 10
  prompt: Create a horizontal bar chart from `regional_totals` with region labels and order total values. Store the returned
    chart object in a variable named `ax`.
  starter: 'regional_totals = (orders.groupby(''region'', as_index=False)[''order_total''].sum().sort_values(''order_total'',
    ascending=False))

    # Create the chart and store it as ax.'
  solution: 'regional_totals = (orders.groupby(''region'', as_index=False)[''order_total''].sum().sort_values(''order_total'',
    ascending=False))

    ax = regional_totals.plot.barh(x=''region'', y=''order_total'')'
  hints:
  - Name each value or result exactly as the task requests so the checker can find it.
  - Build the result from the provided variables or DataFrame instead of typing the finished answer.
  - Run the code first. Read the error or output, then change only the part that does not match the task.
  validator:
    type: python_checks
    checks:
    - expression: ax is not None
      feedback: Store the object returned by the plotting method in ax.
    - expression: len(ax.patches) == 4
      feedback: The chart should contain one bar for each of the four regions.
    display_variable: ''
    success_feedback: Your code runs and produces the requested result. Notice how the result comes from the code, so it can
      update when the inputs change.
    dataset_id: sql_foundations
