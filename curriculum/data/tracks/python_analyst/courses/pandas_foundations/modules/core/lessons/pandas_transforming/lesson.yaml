  prompt: ''
  instruction:
    title: Learn — Transforming DataFrames
    objective: Explain the purpose of transforming dataframes.
    body: 'A pandas **DataFrame** is a table with named rows and columns. Transforming a DataFrame often means creating a new column from existing fields, renaming columns, changing types, or replacing inconsistent values.


      When you want to keep the source unchanged, make a copy before editing:


      ```python

      clean_data = raw_data.copy()

      clean_data["total"] = clean_data["quantity"] * clean_data["price"]

      ```


      A calculated column should come from the source fields rather than a manually typed final answer. That keeps the analysis repeatable when new rows arrive.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning transforming dataframes before using it in real analysis.
