- activity_id: academy2_pandas_transforming_guided
  title: Try It — Add a calculated DataFrame column
  type: guided
  runtime: python
  step_kind: guided_practice
  completion_mode: validated
  xp: 100
  estimated_minutes: 7
  prompt: The `orders` DataFrame is already loaded. Create `orders_with_tax` as a copy. Add `total_with_tax`, equal to `order_total` multiplied by 1.08.
  starter: '# orders is already loaded.

    orders_with_tax = orders.copy()

    # Add total_with_tax.'
  solution: 'orders_with_tax = orders.copy()

    orders_with_tax[''total_with_tax''] = orders_with_tax[''order_total''] * 1.08'
  hints:
  - Name each value or result exactly as the task requests so the checker can find it.
  - Build the result from the provided variables or DataFrame instead of typing the finished answer.
  - Run the code first. Read the error or output, then change only the part that does not match the task.
  validator:
    type: python_checks
    checks:
    - expression: '''total_with_tax'' in orders_with_tax.columns'
      feedback: Add a new column named total_with_tax.
    - expression: abs(float(orders_with_tax.loc[0, 'total_with_tax']) - 156.6) < 1e-9
      feedback: Multiply each order_total value by 1.08.
    - expression: '''total_with_tax'' not in orders.columns'
      feedback: Keep the original orders DataFrame unchanged by working on the copy.
    display_variable: orders_with_tax
    success_feedback: Your code runs and produces the requested result. Notice how the result comes from the code, so it can update when the inputs change.
    dataset_id: sql_foundations
