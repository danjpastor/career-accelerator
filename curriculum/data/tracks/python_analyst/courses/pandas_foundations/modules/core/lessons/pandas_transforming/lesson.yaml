- activity_id: academy2_pandas_transforming_independent
  title: Practice — Create a useful business flag
  type: independent
  runtime: python
  step_kind: independent_practice
  completion_mode: validated
  xp: 125
  estimated_minutes: 10
  prompt: Create `review_orders` as a copy of `orders`. Add a Boolean column named `needs_review` that is True when `order_total` is at least 200 or `status` is Processing.
  starter: '# orders is already loaded.

    review_orders = orders.copy()

    # Add needs_review.'
  solution: 'review_orders = orders.copy()

    review_orders[''needs_review''] = (review_orders[''order_total''] >= 200) | (review_orders[''status''] == ''Processing'')'
  hints:
  - Name each value or result exactly as the task requests so the checker can find it.
  - Build the result from the provided variables or DataFrame instead of typing the finished answer.
  - Run the code first. Read the error or output, then change only the part that does not match the task.
  validator:
    type: python_checks
    checks:
    - expression: '''needs_review'' in review_orders.columns'
      feedback: Add a column named needs_review.
    - expression: int(review_orders['needs_review'].sum()) == 2
      feedback: Combine the amount and status conditions with OR.
    display_variable: review_orders
    success_feedback: Your code runs and produces the requested result. Notice how the result comes from the code, so it can update when the inputs change.
    dataset_id: sql_foundations
