    objective: Explain the purpose of aggregating dataframes.
    body: "Aggregation turns many detailed rows into a smaller business summary. In pandas, `groupby()` defines the groups,\
      \ and an aggregation such as sum, mean, count, minimum, or maximum calculates one result per group.\n\n```python\nteam_summary\
      \ = tickets.groupby(\"team\", as_index=False).agg(\n    ticket_count=(\"ticket_id\", \"count\"),\n    average_hours=(\"\
      resolution_hours\", \"mean\")\n)\n```\n\nThe result has one row per team. Choose the aggregation that matches the question:\
      \ counting records is different from summing a numeric measure."
