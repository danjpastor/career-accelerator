- activity_id: academy2_pandas_aggregating_independent
  title: Practice — Count orders and total value by status
  type: independent
  runtime: python
  step_kind: independent_practice
  completion_mode: validated
  xp: 125
  estimated_minutes: 10
  prompt: Create `status_summary` with one row per status, an `order_count` column, and a `total_value` column.
  starter: '# orders is already loaded.

    # Create status_summary.'
  solution: status_summary = (orders.groupby('status', as_index=False).agg(order_count=('order_id', 'count'), total_value=('order_total',
    'sum')))
  hints:
  - Name each value or result exactly as the task requests so the checker can find it.
  - Build the result from the provided variables or DataFrame instead of typing the finished answer.
  - Run the code first. Read the error or output, then change only the part that does not match the task.
  validator:
    type: python_checks
    checks:
    - expression: set(status_summary.columns) >= {'status', 'order_count', 'total_value'}
      feedback: Name the output columns status, order_count, and total_value.
    - expression: int(status_summary.loc[status_summary['status']=='Completed', 'order_count'].iloc[0]) == 6
      feedback: Count the number of rows in each status.
    - expression: float(status_summary.loc[status_summary['status']=='Completed', 'total_value'].iloc[0]) == 878
      feedback: Sum order_total within each status.
    display_variable: status_summary
    success_feedback: Your code runs and produces the requested result. Notice how the result comes from the code, so it can
      update when the inputs change.
    dataset_id: sql_foundations
