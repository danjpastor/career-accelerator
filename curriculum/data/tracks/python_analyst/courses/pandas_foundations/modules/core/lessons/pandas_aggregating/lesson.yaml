lesson_id: academy2_pandas_aggregating
title: Aggregating DataFrames
order: 2
difficulty: beginner
description: Aggregation turns many detailed rows into a smaller business summary. In pandas, `groupby()` defines the groups,
  and an aggregation such as sum, mean, count, minimum, or maximum calculates one result per group.
estimated_minutes: 35
content: lesson.md
objectives:
- Explain the purpose of aggregating dataframes.
- Choose an appropriate action in a realistic analyst workflow.
key_takeaways:
- Aggregating DataFrames supports a reliable, explainable analytics workflow.
teaches:
- pandas.aggregation
requires:
- python_pandas
