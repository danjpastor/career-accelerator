- activity_id: academy2_pandas_aggregating_guided
  title: Try It — Summarize order value by region
  type: guided
  runtime: python
  step_kind: guided_practice
  completion_mode: validated
  xp: 100
  estimated_minutes: 7
  prompt: Use the loaded `orders` DataFrame to create `regional_totals`, with one row per region and the sum of `order_total`.
    Keep the result as a DataFrame.
  starter: '# orders is already loaded.

    # Create regional_totals.'
  solution: regional_totals = orders.groupby('region', as_index=False)['order_total'].sum()
  hints:
