    steps:
    - Click **Open Google Sheet** to open the continuing Northstar Operations workbook.
    - Open **the worksheet named in the task** and work in the worksheet named in the task.
    - Click any cell inside the complete data table.
    - Choose **Data → Create a filter** and confirm a filter icon appears in every header cell.
    - Open the filter for the column named in the task, choose **Clear**, select only the required value or condition,
      and click **OK**.
    - Leave the filter active so Career Accelerator can verify the finished workbook.
    - 'Confirm the finished workbook matches this result: **One selected answer.**'
