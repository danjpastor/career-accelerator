- activity_id: spreadsheet_cleaning_workbook_practice
  title: Practice — Create clean phone and join-date fields
  type: mastery
  runtime: workbook
  prompt: |-
    Add Clean Phone in J1 and Clean Join Date in K1. Use formulas to standardize the phone text and convert the join-date text into usable dates. Fill both columns through row 13.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Customers**.
    2. In **J1**, type `Clean Phone`. In **K1**, type `Clean Join Date`.
    3. In **J2**, enter `=SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(SUBSTITUTE(G2,"(",""),")",""),"-",""),".","")," ","")`.
    4. The nested SUBSTITUTE functions remove parentheses, hyphens, periods, and spaces while preserving the digits.
    5. In **K2**, enter `=DATEVALUE(H2)`.
    6. Fill J2:J13 and K2:K13 down through row 13.
    7. Select K2:K13 and choose **Format → Number → Date**.
    8. Spot-check several raw phone and date formats to confirm they now follow one consistent structure.
    9. Wait until Google Sheets shows that all changes are saved.
    10. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: J2:J13 and K2:K13 contain saved cleaning formulas.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Customers
      row: 1
      expected:
      - Clean Phone
      - Clean Join Date
    - type: formula_present
      sheet: Customers
      range: J2:J13
      min_count: 12
      contains_any:
      - substitute
      - trim
    - type: formula_present
      sheet: Customers
      range: K2:K13
      min_count: 12
      contains_any:
      - datevalue
      - value
    success_feedback: The customer table now has clean, analysis-ready phone and date fields.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Customers
    columns:
    - Phone Raw
    - Join Date Raw
    - Clean Phone
    - Clean Join Date
    row_range: G1:K13
    starting_state: Phone Raw and Join Date Raw use several inconsistent formats. Columns J and K are available.
    expected_result: J2:J13 and K2:K13 contain saved cleaning formulas.
    column_descriptions:
      Phone Raw: Phone value in its original inconsistent source format.
      Join Date Raw: Customer join date in its original mixed text format.
      Clean Phone: Standardized phone value with punctuation and extra spaces removed.
      Clean Join Date: Join date converted into a true spreadsheet date value.
    sample_values:
    - 'Phone Raw: (206) 555-0131'
    - 'Join Date Raw: 1/8/2024'
    - 'Clean Phone: 2065550131'
    - 'Clean Join Date: 01/08/2024'
