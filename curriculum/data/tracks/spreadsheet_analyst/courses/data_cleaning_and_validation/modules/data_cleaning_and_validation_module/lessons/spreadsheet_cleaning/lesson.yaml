    expected_result: I2:I13 contains formulas using TRIM and PROPER.
    column_descriptions:
      Customer Name Raw: Customer name exactly as received from the source system.
      Clean Customer Name: Standardized customer name with extra spaces removed and capitalization corrected.
    sample_values:
    - 'Customer Name Raw:   summit health group'
    - 'Clean Customer Name: Summit Health Group'
