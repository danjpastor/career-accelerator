- activity_id: spreadsheet_cleaning_workbook_guided
  title: Try It — Standardize customer names
  type: guided
  runtime: workbook
  prompt: |-
    On Customers, add Clean Customer Name in I1. Use a formula that removes extra spaces and applies consistent capitalization, then fill through I13.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Customers**.
    2. In **I1**, type the header `Clean Customer Name`.
    3. In **I2**, enter `=PROPER(TRIM(B2))` and press **Enter**.
    4. TRIM removes extra spaces. PROPER applies consistent title capitalization.
    5. Fill I2 through **I13**.
    6. Compare the raw name in B2 with the cleaned name in I2, then spot-check at least two more rows.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: I2:I13 contains formulas using TRIM and PROPER.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Customers
      row: 1
      expected:
      - Clean Customer Name
    - type: formula_present
      sheet: Customers
      range: I2:I13
      min_count: 12
      contains_all:
      - trim
      - proper
    success_feedback: Customer names are standardized while the raw source remains intact.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
