- activity_id: academy2_spreadsheet_cleaning_guided
  title: Try It — Standardize customer names
  type: guided
  runtime: workbook
  prompt: Create Clean Customer Name in I2:I13 using TRIM and PROPER on Customer Name Raw.
  starter: ''
  solution: In I2 use `=PROPER(TRIM(B2))`, then fill through I13.
  hints:
  - One function removes leading, trailing, and repeated spaces; another standardizes capitalization.
  - Nest TRIM inside PROPER so spacing is corrected before capitalization.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Customers
      row: 1
      expected:
      - Clean Customer Name
      message: 'The workbook does not yet meet this requirement: Every customer has a standardized clean name while the original source remains intact.'
    - type: formula_present
      sheet: Customers
      range: I2:I13
      min_count: 12
      contains_all:
      - trim
      - proper
      message: 'The workbook does not yet meet this requirement: Every customer has a standardized clean name while the original source remains intact.'
    success_feedback: You created a repeatable transformation while preserving the original names for audit.
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
