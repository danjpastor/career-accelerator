- activity_id: academy2_spreadsheet_cleaning_independent
  title: Challenge — Standardize phone and join-date fields
  type: independent
  runtime: workbook
  prompt: Create Clean Phone in J2:J13 and Clean Join Date in K2:K13 from the raw customer fields.
  starter: ''
  solution: Use nested SUBSTITUTE functions in J2 to remove `(`, `)`, `-`, `.`, and spaces from G2. Use `=DATEVALUE(H2)` in K2. Fill both through row 13 and format K as Date.
  hints:
  - The phone task removes several unwanted characters without changing the digits.
  - Use repeated SUBSTITUTE operations for the phone and DATEVALUE for the date text.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Customers
      row: 1
      expected:
      - Clean Phone
      - Clean Join Date
      message: 'The workbook does not yet meet this requirement: Every customer has a consistent phone value and a true spreadsheet date.'
    - type: formula_present
      sheet: Customers
      range: J2:J13
      min_count: 12
      contains_any:
      - substitute
      - trim
      message: 'The workbook does not yet meet this requirement: Every customer has a consistent phone value and a true spreadsheet date.'
    - type: formula_present
      sheet: Customers
      range: K2:K13
      min_count: 12
      contains_any:
      - datevalue
      - value
      message: 'The workbook does not yet meet this requirement: Every customer has a consistent phone value and a true spreadsheet date.'
    success_feedback: You converted inconsistent source text into fields that can be searched, sorted, grouped, and compared reliably.
  required_for_practice: false
  required_for_mastery: true
