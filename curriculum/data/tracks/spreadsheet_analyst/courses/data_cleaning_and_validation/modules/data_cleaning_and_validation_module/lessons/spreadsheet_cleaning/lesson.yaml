  prompt: ''
  instruction:
    title: Learn — Text, Dates, Numbers & Duplicates
    objective: Keep source fields intact and create separate clean fields.
    body: '# Clean data without damaging the source


      Real spreadsheets often contain extra spaces, inconsistent capitalization, numbers stored as text, dates in mixed formats, and duplicate records.


      Analysts usually preserve the original columns and create cleaned fields beside them. This keeps the source traceable and makes it easier to compare the original and cleaned values.


      Text functions such as `TRIM`, `CLEAN`, `UPPER`, `LOWER`, and `PROPER` can standardize text. Date and number conversions help values behave correctly in calculations. Duplicate checks should use the fields that define a unique record, not simply delete every repeated-looking row.


      In this lesson, you will create analysis-ready fields and document what changed.'
    concept_heading: Make the Data Consistent
  presentation:
    scenario: A beginner is learning text, dates, numbers & duplicates before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how text, dates, numbers & duplicates works and why an analyst would use it.
