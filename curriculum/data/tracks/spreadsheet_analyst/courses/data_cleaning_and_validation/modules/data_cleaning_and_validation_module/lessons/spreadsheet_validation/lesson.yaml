lesson_id: academy2_spreadsheet_validation
title: Validation Rules & Reconciliation
order: 2
difficulty: beginner
description: Prevent invalid entries and reconcile row counts, unique identifiers, and duplicates.
estimated_minutes: 45
content: lesson.md
objectives:
- Create a data-validation dropdown from an approved lookup list.
- Count source records without counting the header.
- Detect duplicate identifiers with formula-driven reconciliation checks.
key_takeaways:
- Data validation reduces future entry errors but does not replace quality checks.
- Reconciliation confirms that record counts and identifiers behave as expected.
- A duplicate check compares populated IDs with unique IDs.
teaches:
- spreadsheet.validation
- spreadsheet.reconciliation
requires:
- spreadsheet.cleaning
workbook:
  workbook_name: Northstar Operations Practice Workbook.xlsx
  file_name: Northstar Operations Practice Workbook.xlsx
  template: workbooks/Northstar Operations Practice Workbook.xlsx
  save_instructions: Wait until Google Sheets finishes saving, then select Check My Work. Career Accelerator downloads the latest shared workbook automatically.
mastery:
  passing_score: 1.0
