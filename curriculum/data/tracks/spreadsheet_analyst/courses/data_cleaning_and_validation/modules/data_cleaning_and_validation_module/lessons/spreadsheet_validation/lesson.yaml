- activity_id: academy2_spreadsheet_validation_independent
  title: Challenge — Reconcile order records and duplicate IDs
  type: independent
  runtime: workbook
  prompt: Calculate the order record count in B13 and the duplicate Order ID count in B14 on Analysis Workspace.
  starter: ''
  solution: In B13 use `=COUNTA(Orders!A2:A37)`. In B14 use `=COUNTA(Orders!A2:A37)-COUNTUNIQUE(Orders!A2:A37)`.
  hints:
  - The header should not be included in the record count.
  - Duplicates equal populated IDs minus unique IDs.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B13
      min_count: 1
      contains_any:
      - counta
      - count
      message: 'The workbook does not yet meet this requirement: B13 reports the number of orders and B14 reports the number of duplicate Order IDs.'
    - type: formula_present
      sheet: Analysis Workspace
      cell: B14
      min_count: 1
      contains_any:
      - countif
      - countifs
      - unique
      message: 'The workbook does not yet meet this requirement: B13 reports the number of orders and B14 reports the number of duplicate Order IDs.'
    success_feedback: You created compact QA checks that immediately reveal missing or duplicate identifiers.
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: false
  difficulty: intermediate
  estimated_minutes: 18
  presentation:
    scenario: The operations manager is preparing the weekly operations review.
    introduction: Complete the request in the shared Google Sheet using the skill taught in this lesson.
    task: Calculate the order record count in B13 and the duplicate Order ID count in B14 on Analysis Workspace.
    requirements:
