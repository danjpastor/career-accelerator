    - Use Order ID as the uniqueness field.
    - Keep both checks formula-driven so they update with the data.
    expected_output: B13 reports the number of orders and B14 reports the number of duplicate Order IDs.
    skills_practiced:
    - spreadsheet.validation
    - spreadsheet.reconciliation
    after_correct: You created compact QA checks that immediately reveal missing or duplicate identifiers.
    common_errors:
    - Working in a different Google Sheet than the link saved in Career Accelerator.
    - Selecting Check My Work before Google Sheets finishes saving.
    - Using different cells, ranges, labels, or output text than the lesson requires.
    primary_workbook_action: Open Google Sheet
    check_action: Check My Work
    hide_download_upload: true
    hide_exact_result: true
  instruction:
    phase: CHALLENGE
