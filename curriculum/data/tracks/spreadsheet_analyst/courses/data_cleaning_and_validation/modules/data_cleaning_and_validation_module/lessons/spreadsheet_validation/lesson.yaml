- activity_id: spreadsheet_validation_workbook_practice
  title: Practice — Reconcile the Orders table
  type: mastery
  runtime: workbook
  prompt: 'On Analysis Workspace, calculate the number of order records in B13 and the number of duplicate Order
    IDs in B14.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range A13:B14.

    3. Use these columns for this task: **Order record count, Duplicate Order IDs**.

    4. Click the first required output cell and type `=` to begin the formula.

    5. Build the formula with the source cells from the current row, then press **Enter**.

    6. Drag the blue fill handle through the full required range.

    7. Spot-check the first, middle, and last result before checking your work.

    8. Confirm the finished workbook matches this result: **B13 uses a counting formula and B14 uses a duplicate-check
    formula.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: B13 uses a counting formula and B14 uses a duplicate-check formula.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B13
      min_count: 1
      contains_any:
      - counta
      - count
    - type: formula_present
      sheet: Analysis Workspace
      cell: B14
      min_count: 1
      contains_any:
      - countif
      - countifs
      - unique
    success_feedback: The workbook now exposes record-count and duplicate-ID reconciliation checks.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Analysis Workspace
    columns:
    - Order record count
    - Duplicate Order IDs
    row_range: A13:B14
    starting_state: B13 and B14 are blank. Orders contains 36 records with an Order ID in column A.
    expected_result: B13 uses a counting formula and B14 uses a duplicate-check formula.
    column_descriptions:
      Order record count: Count of source order records used for reconciliation.
      Duplicate Order IDs: Count of Order IDs that appear more than once.
    sample_values:
    - 'Order record count: 36'
    - 'Duplicate Order IDs: 0'
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: false
