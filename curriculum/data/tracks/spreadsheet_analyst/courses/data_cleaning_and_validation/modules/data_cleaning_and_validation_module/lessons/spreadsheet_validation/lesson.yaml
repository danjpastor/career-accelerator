- activity_id: academy2_spreadsheet_validation_learn
  title: Learn — Validation Rules & Reconciliation
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Validation Rules & Reconciliation
    objective: Create a data-validation dropdown from an approved lookup list.
    body: '# Prevent bad entries and prove the table is complete


      **Data validation** controls what a user may enter in a cell. A dropdown can restrict a status to approved values; a number rule can prevent negative quantities.


      Validation prevents new errors, but it does not prove that existing data is complete. Analysts also **reconcile** a table by comparing row counts, unique identifier counts, blank keys, duplicates, and totals before and after cleaning.


      A good reconciliation explains why any count changed. “The cleaned table has five fewer rows” is not enough unless you can show which rows were removed and why.


      In this lesson, you will add sensible input rules and build checks that make the workbook easier to trust.'
    concept_heading: Validation Rules & Reconciliation
  presentation:
    scenario: A beginner is learning validation rules & reconciliation before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how validation rules & reconciliation works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - spreadsheet.validation
    - spreadsheet.reconciliation
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
