lesson_id: spreadsheet_validation
title: Validation Rules & Reconciliation
order: 2
difficulty: beginner
description: Prevent invalid status values and reconcile the workbook before relying on its results.
estimated_minutes: 40
content: lesson.md
objectives:
- Create a controlled status drop-down.
- Reconcile record counts and duplicate identifiers.
key_takeaways:
- Validation rules prevent new errors at data entry.
- Reconciliation checks make silent data loss visible.
teaches: &id001
- spreadsheet.validation
- spreadsheet.reconciliation
requires:
- spreadsheet.cleaning
