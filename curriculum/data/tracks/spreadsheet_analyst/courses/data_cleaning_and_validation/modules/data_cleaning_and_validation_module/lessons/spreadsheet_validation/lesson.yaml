    On Orders, add a list validation rule to J2:J37 using the approved statuses on Lookup Tables. Existing status values should remain unchanged.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. Select the complete status-entry range **J2:J37**.
    3. Choose **Data → Data validation → Add rule**.
    4. For Criteria, choose **Dropdown (from a range)** and enter `'Lookup Tables'!C2:C5`.
    5. Keep the existing values in J2:J37. Do not replace or clear them.
    6. Select **Done**, then click one status cell and confirm the approved four choices are available.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
