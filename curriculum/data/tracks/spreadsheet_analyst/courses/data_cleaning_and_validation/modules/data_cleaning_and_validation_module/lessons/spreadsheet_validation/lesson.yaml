- activity_id: spreadsheet_validation_workbook_practice
  title: Practice — Reconcile the Orders table
  type: mastery
  runtime: workbook
  prompt: |-
    On Analysis Workspace, calculate the number of order records in B13 and the number of duplicate Order IDs in B14.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. In **B13**, enter `=COUNTA(Orders!A2:A37)` to count data rows without counting the header.
    3. In **B14**, enter `=COUNTA(Orders!A2:A37)-COUNTUNIQUE(Orders!A2:A37)`.
    4. The duplicate check subtracts the number of unique Order IDs from the number of populated Order IDs.
    5. Confirm B13 returns the number of order records and B14 returns zero when every Order ID is unique.
    6. Wait until Google Sheets shows that all changes are saved.
    7. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: B13 uses a counting formula and B14 uses a duplicate-check formula.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B13
      min_count: 1
      contains_any:
      - counta
      - count
    - type: formula_present
      sheet: Analysis Workspace
      cell: B14
      min_count: 1
      contains_any:
      - countif
      - countifs
      - unique
    success_feedback: The workbook now exposes record-count and duplicate-ID reconciliation checks.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Order record count
    - Duplicate Order IDs
    row_range: A13:B14
    starting_state: B13 and B14 are blank. Orders contains 36 records with an Order ID in column A.
    expected_result: B13 uses a counting formula and B14 uses a duplicate-check formula.
    column_descriptions:
      Order record count: Count of source order records used for reconciliation.
      Duplicate Order IDs: Count of Order IDs that appear more than once.
    sample_values:
    - 'Order record count: 36'
    - 'Duplicate Order IDs: 0'
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: false
  difficulty: intermediate
