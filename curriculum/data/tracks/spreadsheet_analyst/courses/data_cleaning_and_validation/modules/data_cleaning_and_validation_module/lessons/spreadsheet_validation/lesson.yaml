    title: Learn & Predict — Preventing and detecting data-quality problems
    objective: Distinguish preventive validation rules from reconciliation checks.
    why_it_matters: A dropdown can prevent new invalid values, while reconciliation checks reveal problems already present in the dataset. Reliable workbooks use both.
    concept: Data validation restricts what users may enter. A record-count check confirms the expected number of rows. A duplicate-ID check compares the number of populated IDs with the number of unique IDs.
