- activity_id: spreadsheet_structure_workbook_practice
  title: Practice — Document the table grain
  type: mastery
  runtime: workbook
  prompt: |-
    Go to Analysis Workspace. In cell B4, write a short grain statement explaining what one row in Orders represents.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. Click cell **B4** beside the label **Orders table grain**.
    3. Type one complete sentence explaining what a single row in Orders represents.
    4. Include both words **customer** and **order**. A suitable structure is: `One row represents one customer order.`
    5. Press **Enter** and confirm the sentence is visible in B4.
    6. Wait until Google Sheets shows that all changes are saved.
    7. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: B4 clearly states that one row represents one customer order.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: cell_text
      sheet: Analysis Workspace
      cell: B4
      contains:
      - customer
      - order
    success_feedback: Your workbook now documents the Orders table grain.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Orders table grain
    - Your Result
    row_range: A4:B4
    starting_state: Cell A4 contains the label Orders table grain and B4 is blank.
    expected_result: B4 clearly states that one row represents one customer order.
    column_descriptions:
      Orders table grain: A plain-language statement describing what one Orders row represents.
      Your Result: Learner-entered answer or calculated result.
    sample_values:
    - 'Orders table grain: One row represents one customer order.'
    - 'Your Result: One row represents one customer order.'
