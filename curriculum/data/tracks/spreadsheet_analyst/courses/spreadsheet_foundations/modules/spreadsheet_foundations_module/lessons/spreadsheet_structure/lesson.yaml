- activity_id: academy2_spreadsheet_structure_example
  title: Example — See rows, columns, tables & data types in context
  type: recognition
  runtime: content
  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See rows, columns, tables & data types in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      Imagine a table of library loans. Each row represents one borrowed book. The columns include Loan ID, Member ID, Checkout
      Date, and Return Status.


      If someone asks, “How many members borrowed a book?”, counting rows would be wrong because one member may appear several
      times. The analyst first recognizes that the table''s grain is **one loan**, then counts unique Member IDs instead.


      The analyst also checks that Checkout Date contains real dates. If some dates are stored as text, a date filter may
      leave them out.


      **What to notice:** Understanding the row meaning and data types comes before calculating anything.'
  presentation:
    scenario: A separate worked example
    introduction: Study how the idea works before solving a different task.
    task: Read the example and focus on the reasoning rather than memorizing the answer.
