  instruction:
    title: Learn — Rows, Columns, Tables & Data Types
    objective: Identify what one row and one column represent in a well-structured table.
    body: '# Understand what a spreadsheet table represents


      A spreadsheet is made of **cells** arranged in rows and columns. A group of related cells is called a **range**. When
      the first row contains field names and every row below it follows the same structure, that range works like a table.


      Before you analyze a table, ask one important question: **What does one row represent?** Analysts call this the table''s
      **grain**. One row might represent one order, one customer, or one day. Knowing the grain helps you avoid counting the
      same thing twice.


      Cells also have data types. A date should behave like a date, a number like a number, and text like text. A value that
      only looks correct can still cause sorting, filtering, or formulas to fail.


      In this lesson, you will identify the grain of a table, check its headers and data types, and use a filter without deleting
      any rows.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
