lesson_id: spreadsheet_structure
title: Rows, Columns, Tables & Data Types
order: 1
difficulty: beginner
description: Learn how a real operations workbook is organized, identify the grain of a table, and prepare
  the Orders data for analysis.
estimated_minutes: 40
content: lesson.md
objectives:
- Identify what one row represents and which fields are identifiers, categories, dates, or measures.
- Prepare the Orders sheet as a filterable analysis table without changing the raw values.
key_takeaways:
- A reliable spreadsheet starts with a clear table grain and one header row.
- Identifiers such as Order ID and Customer ID should remain text.
teaches:
- spreadsheet.structure
- spreadsheet.data_types
requires: []
workbook:
  workbook_name: Northstar Operations Practice Workbook.xlsx
  file_name: Northstar Operations Practice Workbook.xlsx
  template: workbooks/Northstar Operations Practice Workbook.xlsx
  save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
    Check Workbook.
mastery:
  passing_score: 1.0
activities:
- activity_id: spreadsheet_structure_1
  title: Learn — Quick concept check
  type: recognition
  runtime: recognition
  prompt: What does one row in the Orders sheet represent?
  answer_options:
  - One customer order
  - One customer
  - One product
  - One month
  starter: ''
  solution: One customer order
  hints:
  - Review the short explanation and focus on the role each field or formula plays.
  validator:
    type: exact_answer
    expected_answer: One customer order
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 4
  presentation:
    scenario: Northstar Operations practice workbook
    introduction: Start with one short concept check before working in the real workbook.
    task: What does one row in the Orders sheet represent?
    requirements:
    - Choose the answer that best supports a reliable spreadsheet workflow.
    expected_output: One selected answer.
    skills_practiced:
    - spreadsheet.structure
    after_correct: You are ready to apply the idea in the Northstar workbook.
  instruction:
    title: Learn — Rows, Columns, Tables & Data Types
    objective: What does one row in the Orders sheet represent?
    action_label: Choose the best answer
    body: A table is easiest to analyze when every row represents the same kind of business event. In the Orders
      sheet, the grain is one customer order. Order ID and Customer ID are identifiers, while Units and Unit
      Price are measures.
  required_for_completion: true
- activity_id: spreadsheet_structure_workbook_guided
  title: Try It — Prepare the Orders table
  type: guided
  runtime: workbook
  prompt: |-
    Open the Orders sheet. Select A1:J37 and turn the range into a filterable table, or add a filter to the header row. Keep every existing row and column unchanged.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open the **Orders** sheet.
    2. Click cell **A1**, hold **Shift**, and click **J37** so the complete Orders range is selected.
    3. Choose **Data → Create a filter** from the Google Sheets menu.
    4. Confirm that a filter icon appears in every header cell from **A1 through J1**.
    5. Confirm that row 1 is still the header row and that rows 2 through 37 are still present.
    6. Do not rename, move, sort, or delete any source columns for this task.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: The full Orders range is filterable and still contains all 36 order records.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: sheet_exists
      sheet: Orders
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Order ID
      - Order Date
      - Customer ID
      - Region
      - Sales Rep
      - Product ID
      - Units
      - Unit Price
      - Discount
      - Status
    - type: table_or_filter
      sheet: Orders
    - type: populated_range
      sheet: Orders
      range: A2:J37
      min_count: 360
    success_feedback: 'The Orders sheet is ready for real analysis: the headers are intact, every record remains,
      and the range is filterable.'
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Orders
    columns:
    - Order ID
    - Order Date
    - Customer ID
    - Region
    - Sales Rep
    - Product ID
    - Units
    - Unit Price
    - Discount
    - Status
    row_range: A1:J37
    starting_state: The Orders data has one header row and 36 order records, but no saved table or filter.
    expected_result: The full Orders range is filterable and still contains all 36 order records.
    column_descriptions:
      Order ID: Unique text identifier for one customer order.
      Order Date: Date the customer order was created.
      Customer ID: Identifier that connects an order to the Customers sheet.
      Region: Sales territory assigned to the order or customer.
      Sales Rep: Employee responsible for the order.
      Product ID: Identifier that connects an order to the Products sheet.
      Units: Number of product units ordered.
      Unit Price: Selling price for one unit, stored in U.S. dollars.
      Discount: Order discount stored as a decimal percentage.
      Status: Current order status from the approved lookup list.
    sample_values:
    - 'Order ID: NS-1001'
    - 'Order Date: 01/05/2026'
    - 'Customer ID: C001'
    - 'Region: West'
    - 'Sales Rep: Maya Chen'
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
