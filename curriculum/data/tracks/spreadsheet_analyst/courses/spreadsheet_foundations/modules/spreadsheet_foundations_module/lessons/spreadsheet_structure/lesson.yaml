  instruction:
    phase: LEARN & PREDICT
    title: Learn & Predict — How spreadsheet tables are organized
    objective: Recognize table grain, fields, records, and the effect of a filter.
    why_it_matters: Before an analyst writes a formula or builds a chart, they need to know what the table represents. Misreading
      the grain can cause double-counting, missing records, and misleading summaries.
    concept: A **record** is one row. A **field** is one column. The **grain** states exactly what one row represents. A filter
      temporarily hides rows that do not match a condition, while the underlying records remain in the sheet.
    worked_example: A support-ticket table has one row per ticket and columns for Ticket ID, Team, Priority, and Status. Filtering
      Status to Open lets the analyst focus on unresolved tickets without deleting closed tickets. A total such as “428 open
      tickets” belongs in a separate summary area, not inside the ticket rows.
    action_label: Make a prediction
  required_for_completion: true
  answer_options:
  - In a separate summary area
  - In the middle of the order rows
  - In the Order ID column
  - As another order record
  step_kind: knowledge_check
