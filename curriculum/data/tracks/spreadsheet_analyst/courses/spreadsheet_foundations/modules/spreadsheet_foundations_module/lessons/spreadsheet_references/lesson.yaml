    columns:
    - Revenue
    - Adjusted Revenue
    row_range: K1:L37
    starting_state: Revenue is available in column K, Adjusted Revenue is blank, and the Orders filter is ready
      to use.
    expected_result: Adjusted Revenue uses a locked $B$2 tax-rate reference. With Region filtered to West and Revenue
      sorted largest to smallest, NS-1017 appears first.
    column_descriptions:
      Revenue: Calculated order value after applying the row discount.
      Adjusted Revenue: Revenue adjusted by the shared tax rate in Lookup Tables!B2.
    sample_values:
    - 'Revenue: $9,450.00'
    - 'Adjusted Revenue: $10,111.50'
    evidence_prompt: Which Order ID appears first after filtering Region to West and sorting Revenue largest to
      smallest?
