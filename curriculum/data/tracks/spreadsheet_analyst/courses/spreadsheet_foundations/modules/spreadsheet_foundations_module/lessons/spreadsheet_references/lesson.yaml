- activity_id: spreadsheet_references_workbook_practice
  title: Practice — Use an absolute tax-rate reference
  type: mastery
  runtime: workbook
  prompt: |-
    Create Adjusted Revenue in column L using each row’s Revenue and the shared tax rate in 'Lookup Tables'!$B$2. Fill the formula through row 37. Then filter Region to West and sort Revenue from largest to smallest. Enter the Order ID at the top of the filtered list in Check Your Work.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. In **L1**, type the header `Adjusted Revenue`.
    3. In **L2**, enter `=K2*(1+'Lookup Tables'!$B$2)` and press **Enter**.
    4. The dollar signs in `$B$2` lock the shared tax-rate cell while the Revenue row reference changes.
    5. Fill L2 through **L37**, then format L2:L37 as currency.
    6. Open the filter in **Region (D1)**, clear Select all, choose **West**, and select **OK**.
    7. Open the filter in **Revenue (K1)** and choose **Sort Z → A** so the largest revenue is first.
    8. Read the first visible Order ID in column A and enter it in **Check Your Work** in Career Accelerator.
    9. Wait until Google Sheets shows that all changes are saved.
    10. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: Adjusted Revenue uses a locked $B$2 tax-rate reference. With Region filtered to West and Revenue
    sorted largest to smallest, NS-1017 appears first.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Adjusted Revenue
    - type: formula_present
      sheet: Orders
      range: L2:L37
      min_count: 36
      contains_all:
      - $b$2
      message: Use a locked $B$2 reference and fill Adjusted Revenue through row 37.
    - type: table_or_filter
      sheet: Orders
    - type: evidence_answer
      expected_answer: NS-1017
      message: Filter Region to West, sort Revenue largest to smallest, and enter the first Order ID.
    success_feedback: The absolute reference is correct, and the saved filter/sort workflow identifies NS-1017
      as the largest West order.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Orders
    columns:
    - Revenue
    - Adjusted Revenue
    row_range: K1:L37
    starting_state: Revenue is available in column K, Adjusted Revenue is blank, and the Orders filter is ready
      to use.
    expected_result: Adjusted Revenue uses a locked $B$2 tax-rate reference. With Region filtered to West and
      Revenue sorted largest to smallest, NS-1017 appears first.
    column_descriptions:
      Revenue: Calculated order value after applying the row discount.
      Adjusted Revenue: Revenue adjusted by the shared tax rate in Lookup Tables!B2.
    sample_values:
    - 'Revenue: $9,450.00'
    - 'Adjusted Revenue: $10,111.50'
    evidence_prompt: Which Order ID appears first after filtering Region to West and sorting Revenue largest
      to smallest?
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: false
