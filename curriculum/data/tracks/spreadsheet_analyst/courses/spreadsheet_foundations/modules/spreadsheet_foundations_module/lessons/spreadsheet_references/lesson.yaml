- activity_id: academy2_spreadsheet_references_independent
  title: Challenge — Lock a same-sheet planning rate and investigate West orders
  type: independent
  runtime: workbook
  prompt: Enter a 5% planning rate in R2, calculate Adjusted Revenue in L2:L37 using that fixed same-sheet assumption, then identify the highest-Revenue West order and enter its Order ID in Check Your Work.
  starter: ''
  solution: In R1 enter `Planning Rate`, enter `5%` in R2, use `=K2*(1+$R$2)` in L2, fill through L37, filter Region to West, sort Revenue Z→A, and enter `NS-1017`.
  hints:
  - The planning rate in R2 should not move when the formula is filled down.
  - Keep the planning rate on the Orders sheet and use dollar signs around both the row and column of R2. Then filter Region before sorting Revenue.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Adjusted Revenue
      message: 'The workbook does not yet meet this requirement: Adjusted Revenue is complete, the same-sheet planning-rate reference is fixed, and the submitted Order ID matches the top West order.'
    - type: cell_text
      sheet: Orders
      cell: R1
      expected: Planning Rate
      message: Enter the label Planning Rate in R1 on the Orders sheet.
    - type: cell_number
      sheet: Orders
      cell: R2
      expected: 0.05
      tolerance: 0.0001
      message: Enter 5% in R2 on the Orders sheet.
    - type: formula_present
      sheet: Orders
      range: L2:L37
      min_count: 36
      contains_all:
      - $r$2
      message: Use a locked $R$2 reference and fill Adjusted Revenue through row 37.
    - type: table_or_filter
      sheet: Orders
      message: 'The workbook does not yet meet this requirement: Adjusted Revenue is complete, the same-sheet planning-rate reference is fixed, and the submitted Order ID matches the top West order.'
    - type: evidence_answer
      expected_answer: NS-1017
      message: Filter Region to West, sort Revenue largest to smallest, and enter the first Order ID.
    success_feedback: You combined a moving row reference with a fixed business assumption and used sorting and filtering to answer a focused question.
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: false
  difficulty: intermediate
  estimated_minutes: 18
  presentation:
    scenario: The operations manager is preparing the weekly operations review.
    introduction: Complete the request in the shared Google Sheet using the skill taught in this lesson.
    task: Enter a 5% planning rate in R2, calculate Adjusted Revenue in L2:L37 using that fixed same-sheet assumption, then identify the highest-Revenue West order and enter its Order ID in Check Your Work.
    requirements:
    - Enter `Planning Rate` in R1 and `5%` in R2.
    - Use Revenue from the current order row.
    - Lock R2 so the planning rate does not move when filled down.
    - Filter Region to West and sort Revenue from largest to smallest.
    expected_output: Adjusted Revenue is complete, the same-sheet planning-rate reference is fixed, and the submitted Order ID matches the top West order.
