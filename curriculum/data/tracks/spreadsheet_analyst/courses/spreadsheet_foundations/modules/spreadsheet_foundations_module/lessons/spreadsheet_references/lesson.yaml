  instruction:
    title: Learn — Cell References, Sorting & Filtering
    objective: Which reference stays fixed when a formula is copied down?
    action_label: Choose the best answer
    body: Relative references change with the row. Absolute references use dollar signs to keep a cell fixed. For
      example, `=K2*(1+'Lookup Tables'!$B$2)` changes K2 as it fills down but always uses the tax rate in B2.
