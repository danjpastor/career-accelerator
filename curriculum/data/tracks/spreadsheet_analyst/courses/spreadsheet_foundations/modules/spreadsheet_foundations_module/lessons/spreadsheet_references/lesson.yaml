lesson_id: spreadsheet_references
title: Cell References, Sorting & Filtering
order: 2
difficulty: beginner
description: Create calculated columns with relative references, then use an absolute reference for a shared business
  assumption.
estimated_minutes: 40
content: lesson.md
objectives:
- Write a row-level revenue formula and fill it down.
- Lock a shared rate with an absolute reference.
key_takeaways:
- Relative references move as a formula is filled down.
- Absolute references keep a shared assumption fixed.
