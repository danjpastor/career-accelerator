  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See cell references, sorting & filtering in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A training sheet contains Hours Attended in column C and an hourly reimbursement rate in cell H2. The first formula multiplies `C2` by `$H$2`.


      When the formula is copied down, `C2` becomes `C3`, `C4`, and so on, while `$H$2` stays fixed. Each employee uses their own hours and the same rate.


      The analyst then filters Department to “Operations” and sorts Reimbursement from highest to lowest to review the largest claims first.


      **What to notice:** References control how formulas behave when copied; filters and sorts help investigate the result without changing the source records.'
    concept_heading: Keep the Right Cell Fixed
  presentation:
