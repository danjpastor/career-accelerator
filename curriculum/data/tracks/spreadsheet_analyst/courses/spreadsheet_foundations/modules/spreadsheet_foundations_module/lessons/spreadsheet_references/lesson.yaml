- activity_id: spreadsheet_references_workbook_guided
  title: Try It — Calculate order revenue
  type: guided
  runtime: workbook
  prompt: |-
    On Orders, add a new column named Revenue in K1. In K2, calculate Units × Unit Price × (1 − Discount), then fill the formula through K37.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. In **K1**, type the header `Revenue`.
    3. In **K2**, enter `=G2*H2*(1-I2)` and press **Enter**.
    4. Read the formula as Units × Unit Price × the portion left after Discount.
    5. Select K2, then double-click the small blue fill handle to copy the formula through **K37**.
    6. Select **K2:K37** and choose **Format → Number → Currency**.
    7. Spot-check K2, K18, and K37 to confirm each row uses its own G, H, and I values.
    8. Wait until Google Sheets shows that all changes are saved.
    9. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: K1 is Revenue and every order row from K2 through K37 contains a saved formula.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Revenue
    - type: formula_present
      sheet: Orders
      range: K2:K37
      min_count: 36
      contains_any:
      - g2
      - units
      message: Enter the revenue formula in K2 and fill it through K37.
    success_feedback: Revenue is calculated for every order row.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
