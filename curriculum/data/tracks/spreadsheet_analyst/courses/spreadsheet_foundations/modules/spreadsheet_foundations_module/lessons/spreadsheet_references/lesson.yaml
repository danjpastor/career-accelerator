- activity_id: spreadsheet_references_workbook_guided
  title: Try It — Calculate order revenue
  type: guided
  runtime: workbook
  prompt: 'On Orders, add a new column named Revenue in K1. In K2, calculate Units × Unit Price × (1 − Discount),
    then fill the formula through K37.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Orders** and work in Orders, range K2:K37.

    3. Use these columns for this task: **Units, Unit Price, Discount, Revenue**.

    4. Click the first required output cell and type `=` to begin the formula.

    5. Build the formula with the source cells from the current row, then press **Enter**.

    6. Drag the blue fill handle through the full required range.

    7. Spot-check the first, middle, and last result before checking your work.

    8. Confirm the finished workbook matches this result: **K1 is Revenue and every order row from K2 through K37
    contains a saved formula.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: K1 is Revenue and every order row from K2 through K37 contains a saved formula.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Revenue
    - type: formula_present
      sheet: Orders
      range: K2:K37
      min_count: 36
      contains_any:
      - g2
      - units
      message: Enter the revenue formula in K2 and fill it through K37.
    success_feedback: Revenue is calculated for every order row.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Orders
    columns:
    - Units
    - Unit Price
    - Discount
    - Revenue
    row_range: G1:K37
    starting_state: Columns G, H, and I contain Units, Unit Price, and Discount. Column K is available for Revenue.
    expected_result: K1 is Revenue and every order row from K2 through K37 contains a saved formula.
    column_descriptions:
      Units: Number of product units ordered.
      Unit Price: Selling price for one unit, stored in U.S. dollars.
      Discount: Order discount stored as a decimal percentage.
      Revenue: Calculated order value after applying the row discount.
    sample_values:
    - 'Units: 18'
    - 'Unit Price: $525.00'
    - 'Discount: 0%'
    - 'Revenue: $9,450.00'
