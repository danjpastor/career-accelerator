- activity_id: academy2_spreadsheet_references_guided
  title: Try It — Calculate order revenue
  type: guided
  runtime: workbook
  prompt: Use the Units, Unit Price, and Discount fields to calculate Revenue for every order in K2:K37.
  starter: ''
  solution: In K2 use `=G2*H2*(1-I2)`, then fill the formula through K37 and format K2:K37 as currency.
  hints:
  - First calculate the pre-discount amount from Units and Unit Price.
  - A discount of 10% means the order keeps 90% of its pre-discount value.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Revenue
      message: 'The workbook does not yet meet this requirement: Every order row has a saved Revenue formula and the results are formatted as currency.'
    - type: formula_present
      sheet: Orders
      range: K2:K37
      min_count: 36
      contains_any:
      - g2
      - units
      message: Enter the revenue formula in K2 and fill it through K37.
    success_feedback: You built one row-level formula and reused it consistently across the complete transaction table.
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
