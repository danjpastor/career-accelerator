- activity_id: academy2_spreadsheet_references_learn
  title: Learn — Cell References, Sorting & Filtering
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Cell References, Sorting & Filtering
    objective: Build a row-level arithmetic formula from fields in the same record.
    body: '# Build formulas that keep working


      A formula can use values from other cells. Those cell addresses are called **references**.


      A **relative reference**, such as `D2`, moves when a formula is copied. This is useful for row-by-row calculations. An **absolute reference**, such as `$B$1`, stays fixed. This is useful when every row must use the same rate, target, or assumption.


      Sorting changes the order of rows. Filtering temporarily hides rows that do not match your conditions. Neither action should change the underlying values.


      In this lesson, you will calculate a row-level result, decide which references should move or stay fixed, and narrow a table to answer a business question.'
    concept_heading: Keep the Right Cell Fixed
  presentation:
    scenario: A beginner is learning cell references, sorting & filtering before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how cell references, sorting & filtering works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - spreadsheet.references
    - spreadsheet.formulas
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
- activity_id: academy2_spreadsheet_references_check
  title: Learn & Predict — Relative and absolute references
  type: recognition
  runtime: recognition
  prompt: A formula uses a row-level sales reference and a fixed rate reference. When the formula is filled down, which part should change?
  starter: ''
  solution: The row-level sales reference
  hints:
  - Dollar signs lock a row and column.
  - The employee-specific value should move to the next employee row.
  - Choose the option that follows the rule explained in the worked example.
  validator:
    type: exact_answer
    expected_answer: The row-level sales reference
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 4
  presentation:
    scenario: The commercial analytics team needs a reliable answer for an upcoming business review.
    introduction: Use the lesson idea to decide the best answer for this workplace situation.
    task: A formula uses a row-level sales reference and a fixed rate reference. When the formula is filled down, which part should change?
    requirements:
    - Choose the answer that best follows the concept explained in the lesson.
    expected_output: One selected answer supported by the lesson concept.
    skills_practiced:
    - spreadsheet.references
    after_correct: The row-level input moves with the record, while the shared assumption remains fixed.
  instruction:
    phase: LEARN & PREDICT
    title: Learn & Predict — Relative and absolute references
    objective: Decide which references should move and which should stay fixed.
    why_it_matters: Analysts often calculate one result for every row while also using a shared assumption such as a tax rate, target, or commission percentage. The formula must treat those two kinds of references differently.
    concept: A relative reference such as `C2` changes when copied down. An absolute reference such as `$B$1` stays fixed. In a formula like `=C2*$B$1`, the row-level amount moves from C2 to C3, while the shared rate remains in B1.
    worked_example: A bonus worksheet stores each employee’s sales in column C and one company bonus rate in B1. The first formula uses the current employee’s sales and the fixed rate. Filling the formula down should move the sales reference but keep the rate locked.
    action_label: Make a prediction
    concept_heading: Keep the Right Cell Fixed
  required_for_completion: true
  answer_options:
  - The row-level sales reference
  - The fixed rate reference
  - Both references stay unchanged
  - Both references become text
  step_kind: knowledge_check
  completion_mode: validated
  xp: 50
- activity_id: academy2_spreadsheet_references_example
  title: Example — See cell references, sorting & filtering in context
  type: recognition
