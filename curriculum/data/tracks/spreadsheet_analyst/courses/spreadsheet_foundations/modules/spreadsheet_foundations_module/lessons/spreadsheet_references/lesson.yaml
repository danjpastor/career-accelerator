- activity_id: spreadsheet_references_workbook_practice
  title: Practice — Use an absolute tax-rate reference
  type: mastery
  runtime: workbook
  prompt: 'Create Adjusted Revenue in column L using each row’s Revenue and the shared tax rate in ''Lookup Tables''!$B$2.
    Fill the formula through row 37. Then filter Region to West and sort Revenue from largest to smallest. Enter
    the Order ID at the top of the filtered list in Check Your Work.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Orders** and work in Orders, range L2:L37.

    3. Use these columns for this task: **Revenue, Adjusted Revenue**.

    4. Click the first required output cell and begin the lookup formula with `=`.

    5. Use the current row''s key as the search key and the named lookup table as the lookup range.

    6. Use an exact match and lock the lookup range with `$` references before filling down.

    7. Verify at least three results against the source table and correct unexpected `#N/A` values.

    8. Confirm the finished workbook matches this result: **Adjusted Revenue uses a locked $B$2 tax-rate reference.
    With Region filtered to West and Revenue sorted largest to smallest, NS-1017 appears first.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: Adjusted Revenue uses a locked $B$2 tax-rate reference. With Region filtered to West and Revenue sorted
    largest to smallest, NS-1017 appears first.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Adjusted Revenue
    - type: formula_present
      sheet: Orders
      range: L2:L37
      min_count: 36
      contains_all:
      - $b$2
      message: Use a locked $B$2 reference and fill Adjusted Revenue through row 37.
    - type: table_or_filter
      sheet: Orders
    - type: evidence_answer
      expected_answer: NS-1017
      message: Filter Region to West, sort Revenue largest to smallest, and enter the first Order ID.
    success_feedback: The absolute reference is correct, and the saved filter/sort workflow identifies NS-1017 as
      the largest West order.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
