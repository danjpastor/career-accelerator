  instruction:
    phase: LEARN & PREDICT
    title: Learn & Predict — Connecting tables with exact lookups
    objective: Identify lookup keys, return ranges, and exact-match behavior.
    why_it_matters: Analysts often keep transaction data separate from reference data. A lookup can enrich each transaction with attributes from the related reference table without copying values manually.
    concept: A lookup uses a **search key**, a **lookup range**, and a **return range**. IDs are usually matched exactly. XLOOKUP directly specifies the search and return ranges; VLOOKUP uses a table range and column position.
    worked_example: A ticket table stores Agent ID, while an agent directory stores Agent ID, Agent Name, and Team. The ticket table can use Agent ID to return the Agent Name. Matching on the name itself would be less reliable because names can be duplicated or changed.
    action_label: Make a prediction
    concept_heading: Bring the Right Value Across
