lesson_id: spreadsheet_lookups
title: Exact Lookups with XLOOKUP
order: 1
difficulty: beginner
description: Bring product attributes into Orders with exact lookups and make missing matches visible.
estimated_minutes: 40
content: lesson.md
objectives:
- Return product names from a related table.
- Return category and unit-cost attributes with exact matching.
key_takeaways:
- Exact lookups connect related tables by a shared key.
- A missing match should be handled visibly, not hidden.
teaches: &id001
- spreadsheet.lookups
requires:
- spreadsheet.validation
