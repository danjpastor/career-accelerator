- activity_id: academy2_spreadsheet_lookups_guided
  title: Try It — Return the product name
  type: guided
  runtime: workbook
  prompt: Use XLOOKUP or an exact-match VLOOKUP to return Product Name in O2:O37.
  starter: ''
  solution: In O2 use `=XLOOKUP(F2,Products!$A$2:$A$9,Products!$B$2:$B$9,"Not found",0)` or an exact-match VLOOKUP, then fill through O37.
  hints:
  - The search key is the current row’s Product ID.
  - The lookup range is Products Product ID; the return range is Products Product.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Product Name
      message: 'The workbook does not yet meet this requirement: Every order has a formula-driven product name that matches the Products table.'
    - type: formula_present
      sheet: Orders
      range: O2:O37
      min_count: 36
      contains_any:
      - xlookup
      - vlookup
      - index
      message: 'The workbook does not yet meet this requirement: Every order has a formula-driven product name that matches the Products table.'
    success_feedback: You enriched transaction rows from a separate reference table using a stable identifier.
  required_for_practice: true
  required_for_mastery: false
