- activity_id: spreadsheet_lookups_workbook_practice
  title: Practice — Return category and unit cost
  type: mastery
  runtime: workbook
  prompt: |-
    Add Category in P1 and Unit Cost in Q1. Use exact lookups from Products and fill both columns through row 37.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. In **P1**, type `Category`. In **Q1**, type `Unit Cost`.
    3. In **P2**, use XLOOKUP with F2 as the key, Products A2:A9 as the locked lookup range, and Products C2:C9 as the return range.
    4. In **Q2**, use the same key and lookup range, but return Products D2:D9.
    5. Use exact matching and an optional Not found result so unmatched keys are obvious.
    6. Fill P2:P37 and Q2:Q37 down through row 37.
    7. Format Q2:Q37 as currency and verify several results against Products.
    8. Wait until Google Sheets shows that all changes are saved.
    9. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: P2:P37 and Q2:Q37 contain exact-match lookup formulas.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Category
      - Unit Cost
    - type: formula_present
      sheet: Orders
      range: P2:P37
      min_count: 36
      contains_any:
      - xlookup
      - vlookup
      - index
    - type: formula_present
      sheet: Orders
      range: Q2:Q37
      min_count: 36
      contains_any:
      - xlookup
      - vlookup
      - index
    success_feedback: Orders now carries the related category and cost attributes needed for analysis.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Orders
    columns:
    - Product ID
    - Category
    - Unit Cost
    row_range: F1:Q37
    starting_state: Products includes Category and Unit Cost for each Product ID. Columns P and Q are available.
    expected_result: P2:P37 and Q2:Q37 contain exact-match lookup formulas.
    column_descriptions:
      Product ID: Identifier that connects an order to the Products sheet.
      Category: Product category returned from the Products sheet.
      Unit Cost: Internal cost per unit returned from the Products sheet.
    sample_values:
    - 'Product ID: P002'
    - 'Category: Furniture'
    - 'Unit Cost: $310.00'
