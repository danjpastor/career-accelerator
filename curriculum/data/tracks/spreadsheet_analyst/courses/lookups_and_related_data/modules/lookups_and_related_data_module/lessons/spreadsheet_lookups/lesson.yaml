    - Product Name
    row_range: F1:O37
    starting_state: Product ID is in Orders column F. Products contains Product ID in A and Product in B.
    expected_result: O2:O37 contains exact-match lookup formulas.
    column_descriptions:
      Product ID: Identifier that connects an order to the Products sheet.
      Product Name: Product description returned from the Products sheet.
    sample_values:
    - 'Product ID: P002'
    - 'Product Name: Standing Desk'
