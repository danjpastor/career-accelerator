- activity_id: academy2_spreadsheet_lookups_learn
  title: Learn — Exact Lookups with XLOOKUP
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Exact Lookups with XLOOKUP
    objective: Identify the key that connects Orders to Products.
    body: '# Bring related information into a table


      A lookup finds a value in one table and returns related information from another. `XLOOKUP` is especially useful when the two tables share a stable identifier such as Product ID or Customer ID.


      An **exact match** means the identifier must be the same in both tables. Names are usually poor lookup keys because spelling and formatting can change. IDs are safer when they are unique and complete.


      A lookup formula needs a value to find, a range to search, and a range to return from. Before filling it down, check a few known records and decide how unmatched IDs should appear.


      In this lesson, you will connect related tables without manually copying values.'
    concept_heading: Bring the Right Value Across
  presentation:
    scenario: A beginner is learning exact lookups with xlookup before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how exact lookups with xlookup works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - spreadsheet.lookups
  validator: {}
  hints: []
  solution: ''
