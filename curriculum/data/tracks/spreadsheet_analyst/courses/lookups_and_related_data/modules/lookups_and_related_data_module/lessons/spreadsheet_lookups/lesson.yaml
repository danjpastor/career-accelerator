- activity_id: spreadsheet_lookups_workbook_guided
  title: Try It — Return the product name
  type: guided
  runtime: workbook
  prompt: 'On Orders, add Product Name in O1. Use XLOOKUP or an exact-match VLOOKUP to return the product name from
    Products for each Product ID. Fill through O37.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Orders** and work in Orders, range O2:O37.

    3. Use these columns for this task: **Product ID, Product Name**.

    4. Click the first required output cell and begin the lookup formula with `=`.

    5. Use the current row''s key as the search key and the named lookup table as the lookup range.

    6. Use an exact match and lock the lookup range with `$` references before filling down.

    7. Verify at least three results against the source table and correct unexpected `#N/A` values.

    8. Confirm the finished workbook matches this result: **O2:O37 contains exact-match lookup formulas.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: O2:O37 contains exact-match lookup formulas.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Product Name
    - type: formula_present
      sheet: Orders
      range: O2:O37
      min_count: 36
      contains_any:
      - xlookup
      - vlookup
      - index
    success_feedback: Every order now shows the related product name.
  workbook:
