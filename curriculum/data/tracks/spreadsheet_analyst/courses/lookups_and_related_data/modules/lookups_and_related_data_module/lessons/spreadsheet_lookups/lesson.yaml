- activity_id: academy2_spreadsheet_lookups_independent
  title: Challenge — Return category and unit cost
  type: independent
  runtime: workbook
  prompt: Create Category in P2:P37 and Unit Cost in Q2:Q37 using exact lookups from Products.
  starter: ''
  solution: In P2 return Products Category (column C) with an exact lookup. In Q2 return Products Unit Cost (column D). Lock the lookup ranges and fill both formulas through row 37.
  hints:
  - Both formulas use the same search key and lookup ID range.
  - 'Only the return range changes: Category for one formula and Unit Cost for the other.'
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
