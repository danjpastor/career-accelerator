- activity_id: spreadsheet_lookups_workbook_guided
  title: Try It — Return the product name
  type: guided
  runtime: workbook
  prompt: |-
    On Orders, add Product Name in O1. Use XLOOKUP or an exact-match VLOOKUP to return the product name from Products for each Product ID. Fill through O37.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. In **O1**, type the header `Product Name`.
    3. In **O2**, enter `=XLOOKUP(F2,Products!$A$2:$A$9,Products!$B$2:$B$9,"Not found")`.
    4. F2 is the Product ID to find. Products A2:A9 is the locked key range, and Products B2:B9 is the return range.
    5. Fill O2 through **O37**.
    6. Compare at least three returned product names with the Products sheet and investigate any Not found result.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: O2:O37 contains exact-match lookup formulas.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Product Name
    - type: formula_present
      sheet: Orders
      range: O2:O37
      min_count: 36
      contains_any:
      - xlookup
      - vlookup
      - index
    success_feedback: Every order now shows the related product name.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
