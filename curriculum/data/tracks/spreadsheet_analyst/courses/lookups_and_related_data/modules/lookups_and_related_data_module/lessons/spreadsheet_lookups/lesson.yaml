  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See exact lookups with xlookup in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A repair table contains Equipment ID, while an equipment directory contains Equipment ID, Model, and Site. The analyst uses Equipment ID to return the Site for each repair.


      One Equipment ID has no match. Instead of silently returning a blank, the analyst displays “ID not found” and investigates the reference table.


      **What to notice:** The ID defines the relationship. A missing match is useful quality information, not something to hide.'
    concept_heading: Make the Data Consistent
  presentation:
