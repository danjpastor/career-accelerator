- activity_id: academy2_spreadsheet_relationships_guided
  title: Try It — Check for unmatched Product IDs
  type: guided
  runtime: workbook
  prompt: Calculate the number of Orders Product IDs that do not appear in Products and place the result in B17.
  starter: ''
  solution: One valid approach is `=SUM(ARRAYFORMULA(--ISNA(MATCH(Orders!F2:F37,Products!A2:A9,0))))` in B17. Equivalent COUNTIF-based checks are acceptable.
  hints:
  - For each Orders Product ID, test whether an exact match exists in Products.
  - MATCH can return a position, and ISNA can identify missing matches.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B17
      min_count: 1
      contains_any:
      - countif
      - match
      - xlookup
      message: 'The workbook does not yet meet this requirement: B17 reports the number of unmatched Product IDs.'
    success_feedback: You verified that the product relationship is complete before relying on the lookup results.
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
