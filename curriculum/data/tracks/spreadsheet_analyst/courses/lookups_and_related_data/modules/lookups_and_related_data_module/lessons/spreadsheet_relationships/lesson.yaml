lesson_id: spreadsheet_relationships
title: Matching Tables & Understanding Grain
order: 2
difficulty: beginner
description: Validate table relationships and build a customer-level summary without losing the Orders table
  grain.
estimated_minutes: 40
content: lesson.md
objectives:
- Check for unmatched Product IDs.
- Create a summary at customer grain.
key_takeaways:
- Joining data changes which fields are available, not the grain unless rows are duplicated.
- Relationship checks should identify unmatched and duplicate keys.
