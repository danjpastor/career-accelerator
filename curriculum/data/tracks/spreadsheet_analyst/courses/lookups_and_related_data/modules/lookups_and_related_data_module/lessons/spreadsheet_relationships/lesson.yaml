  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Matching Tables & Understanding Grain
    objective: Check whether every transaction key exists in the related reference table.
    body: '# Match tables without changing what the numbers mean


      Related tables often have different grains. A Customers table may have one row per customer, while an Orders table has many rows for the same customer.


      Before combining or summarizing them, check that the key on the reference side is unique and that every transaction key has a match. An **unmatched-key check** finds values used in one table that do not exist in the related table.


      When you create a customer summary from orders, you intentionally change the grain from one row per order to one row per customer. Measures such as order count and revenue must be aggregated at that new grain.


      In this lesson, you will validate a relationship and build a summary without duplicating values.'
    concept_heading: Go with the Grain
  presentation:
    scenario: A beginner is learning matching tables & understanding grain before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how matching tables & understanding grain works and why an analyst would use it.
