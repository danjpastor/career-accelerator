- activity_id: spreadsheet_relationships_workbook_guided
  title: Try It — Check for unmatched Product IDs
  type: guided
  runtime: workbook
  prompt: |-
    On Analysis Workspace, calculate the number of Product IDs in Orders that do not appear in Products. Put the result in B17.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. Click **B17** beside Unmatched Product IDs.
    3. Enter `=SUM(ARRAYFORMULA(--(COUNTIF(Products!$A$2:$A$9,Orders!F2:F37)=0)))`.
    4. COUNTIF tests each Orders Product ID against Products. The `=0` test marks IDs that were not found, and SUM counts them.
    5. Press **Enter** and confirm the result is a count rather than a list.
    6. A result of 0 means every Orders Product ID has a matching Products row.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: B17 contains a formula that counts unmatched Product IDs.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B17
      min_count: 1
      contains_any:
      - countif
      - match
      - xlookup
    success_feedback: The workbook now has a relationship-quality check for Product ID.
  workbook:
