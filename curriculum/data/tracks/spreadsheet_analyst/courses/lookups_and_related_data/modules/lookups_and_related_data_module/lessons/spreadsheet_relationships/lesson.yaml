    phase: LEARN & PREDICT
    title: Learn & Predict — Matching tables without changing the meaning
    objective: Reason about keys, unmatched records, and summary grain.
    why_it_matters: Combining tables can duplicate or omit values when the relationship is misunderstood. Analysts should identify each table’s grain and validate matching keys before trusting the result.
    concept: Orders has one row per order, while Customers has one row per customer. A customer may therefore match many orders. An unmatched-key check finds Orders values that have no corresponding record in the reference table. A customer summary changes the grain to one row per customer.
    worked_example: A project table has one row per project and a time-entry table has many rows per project. Summing project budget after joining it to every time entry would duplicate the budget. The analyst must aggregate at the intended grain or keep the measures separate.
    action_label: Make a prediction
    concept_heading: Go with the Grain
