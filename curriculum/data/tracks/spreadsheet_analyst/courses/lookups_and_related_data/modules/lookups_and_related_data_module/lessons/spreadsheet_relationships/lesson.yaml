- activity_id: spreadsheet_relationships_workbook_guided
  title: Try It — Check for unmatched Product IDs
  type: guided
  runtime: workbook
  prompt: 'On Analysis Workspace, calculate the number of Product IDs in Orders that do not appear in Products.
    Put the result in B17.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range A17:B17.

    3. Use these columns for this task: **Unmatched Product IDs**.

    4. Click the first required output cell and type `=` to begin the formula.

    5. Build the formula with the source cells from the current row, then press **Enter**.

    6. Drag the blue fill handle through the full required range.

    7. Spot-check the first, middle, and last result before checking your work.

    8. Confirm the finished workbook matches this result: **B17 contains a formula that counts unmatched Product
    IDs.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: B17 contains a formula that counts unmatched Product IDs.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B17
      min_count: 1
      contains_any:
      - countif
      - match
      - xlookup
    success_feedback: The workbook now has a relationship-quality check for Product ID.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Analysis Workspace
    columns:
    - Unmatched Product IDs
    row_range: A17:B17
    starting_state: B17 is blank. Orders and Products share Product ID.
    expected_result: B17 contains a formula that counts unmatched Product IDs.
    column_descriptions:
      Unmatched Product IDs: Count of order Product IDs not found in Products.
    sample_values:
    - 'Unmatched Product IDs: 0'
