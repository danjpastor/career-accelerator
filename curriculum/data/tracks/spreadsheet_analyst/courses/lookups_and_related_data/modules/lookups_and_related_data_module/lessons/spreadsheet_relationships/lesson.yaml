  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See matching tables & understanding grain in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A Projects table has one row per project. A Time Entries table has many rows per project. If the project budget is joined to every time entry and then summed, the budget is repeated and the total becomes too large.


      The analyst first checks that every Project ID in Time Entries exists in Projects. They then summarize time by project before comparing hours with the one-time project budget.


      **What to notice:** A valid key match does not automatically guarantee a valid total. You must also protect the intended grain.'
    concept_heading: Go with the Grain
