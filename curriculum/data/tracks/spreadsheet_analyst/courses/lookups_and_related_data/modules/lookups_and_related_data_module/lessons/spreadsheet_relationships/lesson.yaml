- activity_id: spreadsheet_relationships_workbook_practice
  title: Practice — Build a customer revenue summary
  type: mastery
  runtime: workbook
  prompt: |-
    In Analysis Workspace A20:D26, create a customer summary with Customer ID, Customer Name, Order Count, and Revenue. Use one row per customer and include at least six customers.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. In **A20:D20**, enter these headers in order: `Customer ID`, `Customer Name`, `Order Count`, `Revenue`.
    3. Copy at least six Customer IDs from Customers into A21:A26, using one ID per row.
    4. In B21, look up the cleaned customer name from Customers using the Customer ID in A21.
    5. In C21, use COUNTIF to count Orders whose Customer ID equals A21.
    6. In D21, use SUMIF to add Orders Revenue for the Customer ID in A21.
    7. Lock source ranges with `$`, then fill B21:D21 down through row 26.
    8. Format D21:D26 as currency and confirm each summary row represents one customer.
    9. Wait until Google Sheets shows that all changes are saved.
    10. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: Row 20 contains the four requested headers and rows below contain one record per customer.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Analysis Workspace
      row: 20
      expected:
      - Customer ID
      - Customer Name
      - Order Count
      - Revenue
      exact: false
    - type: populated_range
      sheet: Analysis Workspace
      range: A20:D26
      min_count: 20
    success_feedback: The customer summary uses a clear customer grain and contains the requested measures.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Customer ID
    - Customer Name
    - Order Count
    - Revenue
    row_range: A20:D26
    starting_state: A20:D26 is reserved for a customer-level summary.
    expected_result: Row 20 contains the four requested headers and rows below contain one record per customer.
    column_descriptions:
      Customer ID: Identifier that connects an order to the Customers sheet.
      Customer Name: The Customer Name field used in this workbook task.
      Order Count: Number of orders associated with one customer.
      Revenue: Calculated order value after applying the row discount.
    sample_values:
    - 'Customer ID: C001'
    - 'Order Count: 4'
    - 'Revenue: $9,450.00'
