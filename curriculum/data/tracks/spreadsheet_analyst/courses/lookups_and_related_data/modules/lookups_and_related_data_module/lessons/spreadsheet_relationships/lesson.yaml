  instruction:
    title: Learn — Matching Tables & Understanding Grain
    objective: What should one row represent in a customer summary?
    action_label: Choose the best answer
    body: The Orders table is at order grain. A customer summary is at customer grain, so each customer should appear
      once with aggregated order measures.
