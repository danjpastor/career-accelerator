- activity_id: spreadsheet_relationships_workbook_practice
  title: Practice — Build a customer revenue summary
  type: mastery
  runtime: workbook
  prompt: 'In Analysis Workspace A20:D26, create a customer summary with Customer ID, Customer Name, Order Count,
    and Revenue. Use one row per customer and include at least six customers.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range A20:D26.

    3. Use these columns for this task: **Customer ID, Customer Name, Order Count, Revenue**.

    4. Click the first required output cell and type `=` to begin the formula.

    5. Build the formula with the source cells from the current row, then press **Enter**.

    6. Drag the blue fill handle through the full required range.

    7. Spot-check the first, middle, and last result before checking your work.

    8. Confirm the finished workbook matches this result: **Row 20 contains the four requested headers and rows
    below contain one record per customer.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: Row 20 contains the four requested headers and rows below contain one record per customer.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Analysis Workspace
      row: 20
      expected:
      - Customer ID
      - Customer Name
      - Order Count
      - Revenue
      exact: false
    - type: populated_range
      sheet: Analysis Workspace
      range: A20:D26
      min_count: 20
    success_feedback: The customer summary uses a clear customer grain and contains the requested measures.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Analysis Workspace
    columns:
    - Customer ID
    - Customer Name
    - Order Count
    - Revenue
    row_range: A20:D26
    starting_state: A20:D26 is reserved for a customer-level summary.
    expected_result: Row 20 contains the four requested headers and rows below contain one record per customer.
    column_descriptions:
      Customer ID: Identifier that connects an order to the Customers sheet.
      Customer Name: The Customer Name field used in this workbook task.
      Order Count: Number of orders associated with one customer.
      Revenue: Calculated order value after applying the row discount.
    sample_values:
    - 'Customer ID: C001'
    - 'Order Count: 4'
    - 'Revenue: $9,450.00'
