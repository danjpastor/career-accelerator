  instruction:
    phase: LEARN & PREDICT
    title: Learn & Predict — What final spreadsheet QA should cover
    objective: Recognize the checks required before analytical work is considered complete.
    why_it_matters: A workbook can look polished while containing incomplete formulas, stale pivots, broken lookups, or hidden filters. Final QA tests the entire analytical chain.
    concept: Final review should confirm source row counts, formula coverage, lookup completeness, validation controls, summary accuracy, chart freshness, and documentation. Important KPIs should be traceable to the underlying data rather than typed manually.
    worked_example: Before distributing a workforce dashboard, an analyst verifies that all imported rows are present, employee IDs match the roster, formulas extend to the final row, pivots were refreshed, and the headline total agrees with an independent check.
