lesson_id: spreadsheet_mastery_review
title: Spreadsheet Mastery Review
order: 2
difficulty: beginner
description: Finish the Northstar operations workbook, verify the major outputs, and demonstrate spreadsheet
  readiness for SQL.
estimated_minutes: 40
content: lesson.md
objectives:
- Verify that the workbook contains the complete analysis workflow.
- Confirm the final total revenue from the finished workbook.
key_takeaways:
- A finished analysis is not complete until formulas, relationships, summaries, and communication are validated.
- The completed workbook can become demonstrated evidence.
teaches:
- spreadsheet.reconciliation
requires:
- spreadsheet.structure
- spreadsheet.formulas
- spreadsheet.conditional_logic
- spreadsheet.cleaning
- spreadsheet.validation
- spreadsheet.lookups
- spreadsheet.relationships
- spreadsheet.pivots
- spreadsheet.kpis
- spreadsheet.reconciliation
workbook:
  workbook_name: Northstar Operations Practice Workbook.xlsx
  file_name: Northstar Operations Practice Workbook.xlsx
  template: workbooks/Northstar Operations Practice Workbook.xlsx
  save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
    Check Workbook.
mastery:
  passing_score: 1.0
activities:
- activity_id: spreadsheet_mastery_review_1
  title: Learn — Quick concept check
  type: recognition
  runtime: recognition
  prompt: |-
    What should happen before a spreadsheet analysis is considered complete?

    <!-- DCA GOOGLE SHEETS STEPS START -->
    ### Complete this task in Google Sheets

    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.
    2. Open **the worksheet named in the task** and work in the worksheet named in the task.
    3. Select the completed summary range, including its labels.
    4. Choose **Insert → Chart**.
    5. Select the chart type named in the task and verify the data range, X-axis, and series.
    6. Add the required title and confirm no requested category is hidden.
    7. Confirm the finished workbook matches this result: **One selected answer.**
    8. Wait until Google Sheets shows that saving is complete.
    9. Return to Career Accelerator and click **Check My Work**.
    <!-- DCA GOOGLE SHEETS STEPS END -->
  answer_options:
  - Validate formulas, totals, relationships, and outputs
  - Delete the raw sheets
  - Replace formulas with typed values
  - Hide all assumptions
  starter: ''
  solution: Validate formulas, totals, relationships, and outputs
  hints:
  - Review the short explanation and focus on the role each field or formula plays.
  validator:
    type: exact_answer
    expected_answer: Validate formulas, totals, relationships, and outputs
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 4
  presentation:
    scenario: Northstar Operations practice workbook
    introduction: Start with one short concept check before working in the real workbook.
    task: What should happen before a spreadsheet analysis is considered complete?
    requirements:
    - Choose the answer that best supports a reliable spreadsheet workflow.
    expected_output: One selected answer.
    skills_practiced:
    - spreadsheet.reconciliation
    after_correct: You are ready to apply the idea in the Northstar workbook.
    primary_workbook_action: Open Google Sheet
    check_action: Check My Work
    hide_download_upload: true
  instruction:
    title: Learn — Spreadsheet Mastery Review
    objective: What should happen before a spreadsheet analysis is considered complete?
    action_label: Choose the best answer
    body: 'The mastery review checks the full workflow: preserved source data, calculated columns, conditional
      logic, cleaning, validation, lookups, summaries, KPIs, visualization, and documentation.'
  required_for_completion: true
  google_sheets:
    source_of_truth: Google Sheets
    steps:
    - Click **Open Google Sheet** to open the continuing Northstar Operations workbook.
    - Open **the worksheet named in the task** and work in the worksheet named in the task.
    - Select the completed summary range, including its labels.
    - Choose **Insert → Chart**.
    - Select the chart type named in the task and verify the data range, X-axis, and series.
    - Add the required title and confirm no requested category is hidden.
    - 'Confirm the finished workbook matches this result: **One selected answer.**'
    - Wait until Google Sheets shows that saving is complete.
    - Return to Career Accelerator and click **Check My Work**.
    workbook_flow: one_continuing_linked_google_sheet
    primary_action: Open Google Sheet
    check_action: Check My Work
    hide_download_upload: true
- activity_id: spreadsheet_mastery_review_workbook_guided
  title: Try It — Run the final workbook QA
  type: guided
  runtime: workbook
  prompt: |-
    Review the completed workbook. Confirm that the Orders calculations, customer cleaning, lookups, validation rules, analysis summaries, KPI block, chart, and workflow checklist are all saved.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet** and review the workbook from beginning to end.
    2. On Orders, confirm Revenue, Adjusted Revenue, both flags, Product Name, Category, and Unit Cost are filled through row 37.
    3. On Customers, confirm the three cleaned fields are filled through row 13 and the raw fields remain unchanged.
    4. Confirm Orders Status has the approved dropdown rule.
    5. On Analysis Workspace, confirm conditional summaries, reconciliation checks, customer summary, both pivots, KPI block, chart, workflow checklist, and handoff note are present.
    6. Correct any blank formulas, `#N/A`, `#VALUE!`, or obviously inconsistent result before checking.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: The major calculation and analysis areas are populated and the Orders formulas remain filled through
    row 37.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Orders
      range: K2:N37
      min_count: 120
    - type: formula_present
      sheet: Orders
      range: O2:Q37
      min_count: 100
    - type: formula_present
      sheet: Analysis Workspace
      range: I3:I6
      min_count: 4
    - type: populated_range
      sheet: Analysis Workspace
      range: A28:J34
      min_count: 14
    - type: populated_range
      sheet: Analysis Workspace
      range: B46:B50
      min_count: 5
    success_feedback: The final workbook contains the major formulas, summaries, and QA documentation required
      for the mastery review.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - KPI Dashboard
    - Region Pivot / Summary
    - Reproducible Workflow Checklist
    row_range: A1:J52
    starting_state: Your continuing workbook contains the work completed throughout the Spreadsheet Academy.
    expected_result: The major calculation and analysis areas are populated and the Orders formulas remain
      filled through row 37.
    column_descriptions:
      KPI Dashboard: Compact area containing the workbook’s primary business metrics.
      Region Pivot / Summary: Saved region-level revenue summary used for comparison.
      Reproducible Workflow Checklist: Documented sequence for refreshing and quality-checking the workbook.
    sample_values:
    - 'KPI Dashboard: Total Revenue — $165,096.85'
    - 'Region Pivot / Summary: West — $115,106.00'
    - 'Reproducible Workflow Checklist: Confirm source row counts'
