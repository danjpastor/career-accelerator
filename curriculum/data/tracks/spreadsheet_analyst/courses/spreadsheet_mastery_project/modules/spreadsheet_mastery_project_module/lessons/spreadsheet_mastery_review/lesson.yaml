lesson_id: academy2_spreadsheet_mastery_review
title: Spreadsheet Mastery Review
order: 2
difficulty: beginner
description: Run a final quality review, confirm the central KPI, and decide whether the workbook is ready to share.
estimated_minutes: 45
content: lesson.md
objectives:
- Review formulas, cleaning, lookups, validation, summaries, and documentation as one system.
- Confirm the final Total Revenue from the formula-driven KPI.
- Apply a final readiness standard before sharing analytical work.
key_takeaways:
- A completed workbook is not necessarily a validated workbook.
- Final QA should cover source integrity, formulas, relationships, summaries, and presentation outputs.
- A key result should be traceable back to formula-driven source data.
teaches:
- spreadsheet.reconciliation
requires:
- spreadsheet.structure
- spreadsheet.formulas
- spreadsheet.conditional_logic
- spreadsheet.cleaning
- spreadsheet.validation
- spreadsheet.lookups
- spreadsheet.relationships
- spreadsheet.pivots
- spreadsheet.kpis
- spreadsheet.reconciliation
workbook:
  workbook_name: Northstar Operations Practice Workbook.xlsx
  file_name: Northstar Operations Practice Workbook.xlsx
  template: workbooks/Northstar Operations Practice Workbook.xlsx
  save_instructions: Wait until Google Sheets finishes saving, then select Check My Work. Career Accelerator downloads the latest shared workbook automatically.
mastery:
  passing_score: 1.0
