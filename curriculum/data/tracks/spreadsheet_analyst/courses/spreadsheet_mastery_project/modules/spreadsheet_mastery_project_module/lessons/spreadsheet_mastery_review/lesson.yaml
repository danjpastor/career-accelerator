- activity_id: spreadsheet_mastery_review_workbook_practice
  title: Practice — Confirm the final total revenue
  type: mastery
  runtime: workbook
  prompt: |-
    Use the finished workbook to confirm Total Revenue. Enter the value shown by your KPI formula in I3, rounded to two decimal places.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. Locate the Total Revenue KPI in **I3**.
    3. Confirm I3 contains a formula that sums the complete Orders Revenue range rather than a typed value.
    4. Read the displayed Total Revenue and round it to two decimal places.
    5. Enter that number in **Check Your Work** in Career Accelerator without a dollar sign or comma.
    6. Do not change the workbook after the final value is confirmed unless you are correcting an error.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: The evidence answer matches the final total revenue of $165,096.85.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: I3
      min_count: 1
    - type: evidence_answer
      expected_number: 165096.85
      tolerance: 0.01
      message: Recheck the Total Revenue formula in I3 and enter the displayed value.
    success_feedback: Spreadsheet mastery confirmed. The completed Northstar workbook produces the correct
      final revenue total and a validated snapshot has been added to Demonstrated Evidence.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Total Revenue
    - Value
    row_range: H3:I3
    starting_state: I3 should contain the final Total Revenue formula.
    expected_result: The final Total Revenue is $165,096.85 and the validated workbook is preserved as demonstrated
      evidence.
    column_descriptions:
      Total Revenue: Revenue across all orders in the workbook.
      Value: Calculated KPI or summary value.
    sample_values:
    - 'Total Revenue: $165,096.85'
    - 'Value: $165,096.85'
    evidence_prompt: Enter the Total Revenue shown in Analysis Workspace cell I3.
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: true
  difficulty: intermediate
  estimated_minutes: 18
