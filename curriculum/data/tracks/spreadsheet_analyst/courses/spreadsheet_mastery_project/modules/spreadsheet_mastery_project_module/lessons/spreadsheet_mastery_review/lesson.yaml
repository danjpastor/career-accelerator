  google_sheets:
    source_of_truth: Google Sheets
    workbook_flow: one_continuing_shared_google_sheet
    primary_action: Open Google Sheet
    check_action: Check My Work
    hide_download_upload: true
    steps:
    - Open the continuing Google Sheet from Career Accelerator.
    - Go to **Analysis Workspace** and locate **H3:I3**.
    - Locate Total Revenue in the KPI block and confirm it is calculated from the complete Orders Revenue range. Read the displayed value only after verifying the formula, then enter it in Check Your Work without a currency symbol or comma.
    - Spot-check the result and confirm the source data was not unintentionally changed.
    - Wait until Google Sheets shows that saving is complete, then return and select **Check My Work**.
