- activity_id: academy2_spreadsheet_mastery_review_guided
  title: Try It — Run the final workbook QA
  type: guided
  runtime: workbook
  prompt: Review the completed Northstar workbook and correct any incomplete major formula, summary, chart, validation, or documentation area.
  starter: ''
  solution: Review each prior lesson output and repair any missing area. Orders formulas should extend through row 37; Analysis Workspace should contain the KPI block, region and category summaries, chart, validation checks, workflow checklist, and handoff note.
  hints:
  - Start with source and formula coverage before reviewing summaries.
  - Check Orders K:Q, then Analysis Workspace KPIs, summaries, checklist, and handoff note.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Orders
      range: K2:N37
      min_count: 120
      message: 'The workbook does not yet meet this requirement: The workbook passes the final structural QA checks across calculations, summaries, and documentation.'
    - type: formula_present
      sheet: Orders
      range: O2:Q37
      min_count: 100
      message: 'The workbook does not yet meet this requirement: The workbook passes the final structural QA checks across calculations, summaries, and documentation.'
    - type: formula_present
      sheet: Analysis Workspace
      range: I3:I6
      min_count: 4
      message: 'The workbook does not yet meet this requirement: The workbook passes the final structural QA checks across calculations, summaries, and documentation.'
    - type: populated_range
      sheet: Analysis Workspace
      range: A28:J34
      min_count: 14
      message: 'The workbook does not yet meet this requirement: The workbook passes the final structural QA checks across calculations, summaries, and documentation.'
    - type: populated_range
      sheet: Analysis Workspace
      range: B46:B50
      min_count: 5
      message: 'The workbook does not yet meet this requirement: The workbook passes the final structural QA checks across calculations, summaries, and documentation.'
    success_feedback: You tested the workbook as an integrated analytical product rather than as a collection of isolated exercises.
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 12
  presentation:
    scenario: A data analyst is preparing a trustworthy report for the team.
    introduction: Complete the request in the shared Google Sheet using the skill taught in this lesson.
    task: Review the completed Northstar workbook and correct any incomplete major formula, summary, chart, validation, or documentation area.
    requirements:
    - Verify Orders calculated and lookup columns extend through row 37.
    - Verify the KPI block and both grouped summaries are populated.
    - Verify the workflow checklist and handoff documentation are complete.
    expected_output: The workbook passes the final structural QA checks across calculations, summaries, and documentation.
    skills_practiced:
    - spreadsheet.reconciliation
    after_correct: You tested the workbook as an integrated analytical product rather than as a collection of isolated exercises.
    common_errors:
    - Working in a different Google Sheet than the link saved in Career Accelerator.
    - Selecting Check My Work before Google Sheets finishes saving.
    - Using different cells, ranges, labels, or output text than the lesson requires.
