- activity_id: spreadsheet_mastery_review_workbook_practice
  title: Practice — Confirm the final total revenue
  type: mastery
  runtime: workbook
  prompt: 'Use the finished workbook to confirm Total Revenue. Enter the value shown by your KPI formula in I3,
    rounded to two decimal places.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range H3:I3.

    3. Use these columns for this task: **Total Revenue, Value**.

    4. Select the source date cells and choose **Format → Number → Date** if they are not recognized as dates.

    5. Enter the required date formula using the function named in the task, such as `DATE`, `YEAR`, `MONTH`, `TEXT`,
    or `WEEKDAY`.

    6. Fill the formula down and verify the result across several different dates.

    7. Correct any `#VALUE!`, `#N/A`, or unexpected serial-number result.

    8. Confirm the finished workbook matches this result: **The final Total Revenue is $165,096.85 and the validated
    workbook is preserved as demonstrated evidence.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: The evidence answer matches the final total revenue of $165,096.85.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: I3
      min_count: 1
    - type: evidence_answer
      expected_number: 165096.85
      tolerance: 0.01
      message: Recheck the Total Revenue formula in I3 and enter the displayed value.
    success_feedback: Spreadsheet mastery confirmed. The completed Northstar workbook produces the correct final
      revenue total and a validated snapshot has been added to Demonstrated Evidence.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Analysis Workspace
    columns:
    - Total Revenue
    - Value
    row_range: H3:I3
    starting_state: I3 should contain the final Total Revenue formula.
    expected_result: The final Total Revenue is $165,096.85 and the validated workbook is preserved as demonstrated
      evidence.
    column_descriptions:
      Total Revenue: Revenue across all orders in the workbook.
      Value: Calculated KPI or summary value.
    sample_values:
    - 'Total Revenue: $165,096.85'
    - 'Value: $165,096.85'
    evidence_prompt: Enter the Total Revenue shown in Analysis Workspace cell I3.
