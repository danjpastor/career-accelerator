- activity_id: academy2_spreadsheet_mastery_review_independent
  title: Challenge — Confirm the final Total Revenue
  type: independent
  runtime: workbook
  prompt: Verify the formula-driven Total Revenue in Analysis Workspace I3 and submit the displayed value rounded to two decimal places.
  starter: ''
  solution: I3 should sum the complete Orders Revenue range. The validated Total Revenue is 165096.85.
  hints:
  - The answer is displayed by the Total Revenue KPI in I3.
  - Verify that I3 sums every Revenue value in Orders K2:K37 before reading it.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: I3
      min_count: 1
      message: 'The workbook does not yet meet this requirement: The submitted amount matches the validated formula-driven Total Revenue.'
    - type: evidence_answer
      expected_number: 165096.85
      tolerance: 0.01
      message: Recheck the Total Revenue formula in I3 and enter the displayed value.
    success_feedback: You confirmed a headline KPI by tracing it back to its formula and complete source range.
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: true
  difficulty: intermediate
  estimated_minutes: 18
  presentation:
    scenario: The commercial analytics team needs a reliable answer for an upcoming business review.
    introduction: Complete the request in the shared Google Sheet using the skill taught in this lesson.
    task: Verify the formula-driven Total Revenue in Analysis Workspace I3 and submit the displayed value rounded to two decimal places.
    requirements:
    - Confirm I3 contains a formula rather than a typed value.
    - Confirm the formula uses the complete Orders Revenue range.
    - Enter the displayed numeric result in Check Your Work.
    expected_output: The submitted amount matches the validated formula-driven Total Revenue.
    skills_practiced:
    - spreadsheet.reconciliation
    after_correct: You confirmed a headline KPI by tracing it back to its formula and complete source range.
    common_errors:
    - Working in a different Google Sheet than the link saved in Career Accelerator.
    - Selecting Check My Work before Google Sheets finishes saving.
    - Using different cells, ranges, labels, or output text than the lesson requires.
    primary_workbook_action: Open Google Sheet
    check_action: Check My Work
    hide_download_upload: true
    hide_exact_result: true
  instruction:
    phase: CHALLENGE
    title: Challenge — Confirm the final Total Revenue
    objective: Trace and submit the workbook’s central KPI without being given the answer.
    approach: Locate Total Revenue in the KPI block and confirm it is calculated from the complete Orders Revenue range. Read the displayed value only after verifying the formula, then enter it in Check Your Work without a currency symbol or comma.
    action_label: Open the workbook and solve the task
    concept_heading: Spreadsheet Mastery Review
  required_for_completion: true
