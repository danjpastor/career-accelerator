- activity_id: academy2_spreadsheet_mastery_review_learn
  title: Learn — Spreadsheet Mastery Review
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Spreadsheet Mastery Review
    objective: Review formulas, cleaning, lookups, validation, summaries, and documentation as one system.
    body: '# Review the workbook before sharing it


      A final review asks whether the workbook is correct, complete, understandable, and safe to refresh.


      Check the source row count, unique identifiers, formulas, lookup matches, summary totals, pivot source ranges, chart labels, and visible error values. Then compare the main KPI with an independent calculation when possible.


      A workbook is not ready simply because it opens without an error. The result must answer the business question and be explainable to someone who did not build it.


      In this lesson, you will run a structured quality review and decide whether the workbook is ready to share.'
    concept_heading: Spreadsheet Mastery Review
  presentation:
    scenario: A beginner is learning spreadsheet mastery review before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how spreadsheet mastery review works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - spreadsheet.reconciliation
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
