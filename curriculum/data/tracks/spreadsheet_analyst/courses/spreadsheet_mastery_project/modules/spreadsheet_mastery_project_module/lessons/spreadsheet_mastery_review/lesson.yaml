  type: recognition
  runtime: recognition
  prompt: Which action should happen before final analysis?
  answer_options:
  - Reconcile cleaned and summarized outputs to the source
  - Delete unresolved rows
  - Hide errors
  - Convert identifiers to numbers
  starter: ''
  solution: Reconcile cleaned and summarized outputs to the source
