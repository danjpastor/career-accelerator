lesson_id: spreadsheet_mastery_review
title: Spreadsheet Mastery Review
order: 2
difficulty: beginner
description: Build practical analyst skill in spreadsheet mastery review.
estimated_minutes: 30
content: lesson.md
objectives:
- Apply spreadsheet mastery review in a data-analysis workflow.
- Explain the validation or quality check that makes the result reliable.
key_takeaways:
- Preserve raw data and document transformations.
- Validate the result before using it in a business decision.
