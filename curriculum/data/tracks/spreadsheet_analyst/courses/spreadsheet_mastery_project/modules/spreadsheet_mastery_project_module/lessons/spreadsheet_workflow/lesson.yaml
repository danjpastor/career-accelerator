    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A monthly staffing workbook has Raw Import, Clean Staff, QA Checks, and Dashboard sheets. The handoff note explains
      how to paste the new export, extend formulas, refresh the pivot table, and confirm that blank Employee IDs equal zero.


      A second analyst follows the note and reproduces the report without asking the original author which cells to edit.


      **What to notice:** Reproducibility depends on structure, checks, and clear instructions—not only correct formulas.'
