    - Use specific notes such as Complete, Checked, or the location of documentation.
    - Save the workbook.
    expected_output: Every checklist row has a clear status or note.
    skills_practiced: *id001
    after_correct: The workbook now records the core reproducibility and QA steps.
    common_errors:
