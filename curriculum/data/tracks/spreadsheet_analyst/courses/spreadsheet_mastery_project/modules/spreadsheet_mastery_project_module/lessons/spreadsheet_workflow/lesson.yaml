- activity_id: academy2_spreadsheet_workflow_guided
  title: Try It — Complete the workflow checklist
  type: guided
  runtime: workbook
  prompt: Complete B46:B50 with a status or note for each workflow item.
  starter: ''
  solution: Enter a truthful status in each cell, such as “Preserved — raw sheets unchanged,” “Documented — clean columns
    retained,” “Checked — formulas filled through row 37,” “Refreshed — pivots and chart updated,” and “Saved — Google Sheets
    changes complete.”
  hints:
  - Each note should answer whether the step is complete and how you know.
  - Reference specific workbook evidence such as row counts, filled formulas, or refreshed pivots.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and
    last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: populated_range
      sheet: Analysis Workspace
      range: B46:B50
      min_count: 5
      message: 'The workbook does not yet meet this requirement: Every checklist item contains a clear, accurate status or
        QA note.'
    success_feedback: You turned an implicit process into a repeatable checklist another analyst can follow.
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 12
  presentation:
    scenario: Northstar Operations practice workbook
    introduction: Apply the named skill to a real business task. The lesson explains the method, but you choose the cell references,
      ranges, and final formula.
    task: Complete B46:B50 with a status or note for each workflow item.
    requirements:
    - Complete every checklist row.
    - Use specific notes that reflect the current workbook.
    - Cover source preservation, documentation, formula validation, refreshed outputs, and saving.
    expected_output: Every checklist item contains a clear, accurate status or QA note.
    skills_practiced:
    - spreadsheet.reconciliation
    after_correct: You turned an implicit process into a repeatable checklist another analyst can follow.
    common_errors:
    - Working in a different Google Sheet than the link saved in Career Accelerator.
    - Selecting Check My Work before Google Sheets finishes saving.
    - Using different cells, ranges, labels, or output text than the lesson requires.
    primary_workbook_action: Open Google Sheet
    check_action: Check My Work
    hide_download_upload: true
    success_criteria: Every checklist item contains a clear, accurate status or QA note.
    hide_exact_result: true
  instruction:
    phase: TRY IT
    title: Try It — Complete the workflow checklist
    objective: Document the current status of the workbook’s refresh and QA steps.
    approach: Review each workflow item in Analysis Workspace and enter a short, specific status or note. The notes should
      describe what is true in the current workbook rather than repeating the same generic word.
    action_label: Open the workbook and solve the task
    watch_for: Use the named spreadsheet skill, verify a few results, and avoid changing source values that are not part of
      the task.
  required_for_completion: true
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving, then select Check My Work. Career Accelerator downloads the
      latest shared workbook automatically.
    sheet: Analysis Workspace
    columns:
    - Reproducible Workflow Checklist
    - Status / Note
    row_range: A45:B50
    starting_state: The five checklist labels are present in A46:A50 and B46:B50 is blank.
    expected_result: Every checklist item contains a clear, accurate status or QA note.
    column_descriptions:
