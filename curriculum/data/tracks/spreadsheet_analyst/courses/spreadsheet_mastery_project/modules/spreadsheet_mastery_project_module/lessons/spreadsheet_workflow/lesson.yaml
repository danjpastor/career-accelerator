- activity_id: spreadsheet_workflow_workbook_practice
  title: Practice — Add a concise analyst handoff note
  type: mastery
  runtime: workbook
  prompt: 'In Analysis Workspace B52, write a short handoff note explaining where the source data lives, which sheet
    contains the final analysis, and what another analyst should refresh first.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range A52:B52.

    3. Use these columns for this task: **Handoff note**.

    4. Open the worksheet or documentation area named in the task.

    5. Record the source, purpose, steps, assumptions, checks, and unresolved issues in plain language.

    6. Include enough detail for another analyst to repeat the work without asking what changed.

    7. Review the workbook for clear sheet names, readable headers, and no unexplained temporary output.

    8. Confirm the finished workbook matches this result: **B52 contains a concise note mentioning source data,
    Analysis Workspace, and refresh or validation.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: B52 contains a concise note mentioning source data, Analysis Workspace, and refresh or validation.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: cell_text
      sheet: Analysis Workspace
      cell: B52
      contains:
      - analysis workspace
      message: Write the handoff note in B52 and mention Analysis Workspace.
    success_feedback: The workbook includes a useful handoff note for the next analyst.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Analysis Workspace
    columns:
    - Handoff note
    row_range: A52:B52
    starting_state: Row 52 is available for a final handoff note.
    expected_result: B52 contains a concise note mentioning source data, Analysis Workspace, and refresh or validation.
    column_descriptions:
      Handoff note: Instructions that help another analyst understand and reuse the workbook.
    sample_values:
    - 'Handoff note: Start with the KPI Dashboard on Analysis Workspace.'
