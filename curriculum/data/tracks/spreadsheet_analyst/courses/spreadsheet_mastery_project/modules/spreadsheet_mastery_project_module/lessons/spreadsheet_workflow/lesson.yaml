- activity_id: spreadsheet_workflow_workbook_practice
  title: Practice — Add a concise analyst handoff note
  type: mastery
  runtime: workbook
  prompt: |-
    In Analysis Workspace B52, write a short handoff note explaining where the source data lives, which sheet contains the final analysis, and what another analyst should refresh first.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. Click **B52**.
    3. Write a concise handoff note that identifies the source-data sheets, names **Analysis Workspace** as the final analysis sheet, and states what another analyst should refresh or validate first.
    4. Use complete sentences and keep the note short enough to scan quickly.
    5. Confirm the note contains the words `Analysis Workspace` before checking your work.
    6. Wait until Google Sheets shows that all changes are saved.
    7. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: B52 contains a concise note mentioning source data, Analysis Workspace, and refresh or validation.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: cell_text
      sheet: Analysis Workspace
      cell: B52
      contains:
      - analysis workspace
      message: Write the handoff note in B52 and mention Analysis Workspace.
    success_feedback: The workbook includes a useful handoff note for the next analyst.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Handoff note
    row_range: A52:B52
    starting_state: Row 52 is available for a final handoff note.
    expected_result: B52 contains a concise note mentioning source data, Analysis Workspace, and refresh or
      validation.
    column_descriptions:
      Handoff note: Instructions that help another analyst understand and reuse the workbook.
    sample_values:
    - 'Handoff note: Start with the KPI Dashboard on Analysis Workspace.'
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: false
