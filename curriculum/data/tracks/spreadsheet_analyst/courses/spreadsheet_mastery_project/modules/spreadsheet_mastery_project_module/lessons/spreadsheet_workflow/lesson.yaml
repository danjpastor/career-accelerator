lesson_id: spreadsheet_workflow
title: Plan a Reproducible Spreadsheet Workflow
order: 1
difficulty: beginner
description: Document a reproducible spreadsheet workflow so another analyst can understand, refresh, and verify
  the workbook.
estimated_minutes: 40
content: lesson.md
objectives:
- Document the workbook process.
- Confirm that raw data, formulas, outputs, and saving steps are complete.
key_takeaways:
- A reproducible workbook explains where data came from and how outputs were produced.
- A final QA checklist reduces silent errors.
teaches: &id001
- spreadsheet.reconciliation
requires:
- spreadsheet.kpis
workbook:
  workbook_name: Northstar Operations Practice Workbook.xlsx
  file_name: Northstar Operations Practice Workbook.xlsx
  template: workbooks/Northstar Operations Practice Workbook.xlsx
  save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
    Check Workbook.
mastery:
  passing_score: 1.0
activities:
- activity_id: spreadsheet_workflow_1
  title: Learn — Quick concept check
  type: recognition
  runtime: recognition
  prompt: Which item belongs in a reproducible spreadsheet workflow?
  answer_options:
  - A record of transformations and validation checks
  - Only a screenshot of the final chart
  - A hidden raw-data deletion step
  - Unlabeled hard-coded totals
  starter: ''
  solution: A record of transformations and validation checks
  hints:
  - Review the short explanation and focus on the role each field or formula plays.
  validator:
    type: exact_answer
    expected_answer: A record of transformations and validation checks
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 4
  presentation:
    scenario: Northstar Operations practice workbook
    introduction: Start with one short concept check before working in the real workbook.
    task: Which item belongs in a reproducible spreadsheet workflow?
    requirements:
    - Choose the answer that best supports a reliable spreadsheet workflow.
    expected_output: One selected answer.
    skills_practiced:
    - spreadsheet.reconciliation
    after_correct: You are ready to apply the idea in the Northstar workbook.
  instruction:
    title: Learn — Plan a Reproducible Spreadsheet Workflow
    objective: Which item belongs in a reproducible spreadsheet workflow?
    action_label: Choose the best answer
    body: A professional workbook should preserve raw data, document the major transformations, validate totals,
      refresh outputs, and save a clear final file.
  required_for_completion: true
- activity_id: spreadsheet_workflow_workbook_guided
  title: Try It — Complete the workflow checklist
  type: guided
  runtime: workbook
  prompt: 'On Analysis Workspace, complete B46:B50 with a short status or note for each workflow item: raw data
    preserved, changes documented, formulas validated, outputs refreshed, and workbook saved.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range B46:B50.

    3. Use these columns for this task: **Reproducible Workflow Checklist, Status / Note**.

    4. Select the source date cells and choose **Format → Number → Date** if they are not recognized as dates.

    5. Enter the required date formula using the function named in the task, such as `DATE`, `YEAR`, `MONTH`, `TEXT`,
    or `WEEKDAY`.

    6. Fill the formula down and verify the result across several different dates.

    7. Correct any `#VALUE!`, `#N/A`, or unexpected serial-number result.

    8. Confirm the finished workbook matches this result: **Every checklist row has a clear status or note.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: Every checklist row has a clear status or note.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: populated_range
      sheet: Analysis Workspace
      range: B46:B50
      min_count: 5
    success_feedback: The workbook now records the core reproducibility and QA steps.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Analysis Workspace
    columns:
    - Reproducible Workflow Checklist
    - Status / Note
    row_range: A45:B50
    starting_state: The five checklist labels are present in A46:A50 and B46:B50 is blank.
    expected_result: Every checklist row has a clear status or note.
    column_descriptions:
      Reproducible Workflow Checklist: Documented sequence for refreshing and quality-checking the workbook.
      Status / Note: Completion status or brief QA note for each workflow step.
    sample_values:
    - 'Reproducible Workflow Checklist: Confirm source row counts'
    - 'Status / Note: Complete — 36 Orders rows'
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 12
  presentation:
    scenario: Northstar Operations practice workbook
    introduction: Complete this task in Excel or Google Sheets using your continuing workbook.
    task: 'On Analysis Workspace, complete B46:B50 with a short status or note for each workflow item: raw data
      preserved, changes documented, formulas validated, outputs refreshed, and workbook saved.'
    requirements:
