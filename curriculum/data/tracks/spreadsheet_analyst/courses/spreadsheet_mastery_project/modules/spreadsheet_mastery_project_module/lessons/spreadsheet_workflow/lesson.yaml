- activity_id: academy2_spreadsheet_workflow_learn
  title: Learn — Plan a Reproducible Spreadsheet Workflow
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Plan a Reproducible Spreadsheet Workflow
    objective: Identify the steps that make a spreadsheet workflow reproducible.
    body: '# Make the workbook repeatable


      A reproducible workflow can be repeated with new data and produce the same type of result without rebuilding everything
      by hand.


      A clear workbook usually separates raw data, cleaned data, calculations, and presentation. It documents where new data
      belongs, which steps should be refreshed, what quality checks must pass, and which outputs are ready to share.


      Hardcoded totals, unexplained manual edits, and formulas that cover only today''s rows make a workbook fragile.


      In this lesson, you will document a simple refresh and handoff process so another analyst can use the workbook safely.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - spreadsheet.reconciliation
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
