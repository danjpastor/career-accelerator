assessment_id: week_1_spreadsheet_foundations_check
title: Week 1 Knowledge Check
order: 99
description: An eight-question mastery check covering the required Week 1 topics.
estimated_minutes: 25
instructions:
- Answer all eight multiple-choice questions independently.
- A score of 80% or higher is required. With eight questions, you must answer at least seven correctly.
- After grading, review every answer and use the recommendations beneath missed questions before retaking the check.
