    scenario: The operations manager is preparing the weekly operations review.
    introduction: Use the lesson idea to decide the best answer for this workplace situation.
    task: A record should be flagged when either its status is Backordered or its stock is below the reorder level. Which logical operator matches the rule?
    requirements:
    - Choose the answer that best follows the concept explained in the lesson.
    expected_output: One selected answer supported by the lesson concept.
    skills_practiced:
    - spreadsheet.conditional_logic
    after_correct: OR is appropriate because either condition is enough to trigger the flag.
  instruction:
    phase: LEARN & PREDICT
    title: Learn & Predict — Turning rules into spreadsheet logic
    objective: Choose the right logical structure for a business rule.
    why_it_matters: Operational data often needs labels such as Complete, At Risk, or Review. Logical formulas apply the same rule consistently to every record instead of relying on manual judgment.
    concept: '`IF` returns one result when a condition is true and another when it is false. `AND` is used when every condition must be true. `OR` is used when any one of several conditions is enough.'
    worked_example: An inventory team marks an item **Reorder** only when On Hand is below Reorder Level. A second rule marks an item **Urgent** when stock is low **and** the supplier lead time exceeds 10 days. The first rule needs IF; the second needs IF with AND.
    action_label: Make a prediction
    concept_heading: Let the Formula Decide
  required_for_completion: true
  answer_options:
  - OR
  - AND
  - SUMIFS
  - XLOOKUP
  step_kind: knowledge_check
  completion_mode: validated
