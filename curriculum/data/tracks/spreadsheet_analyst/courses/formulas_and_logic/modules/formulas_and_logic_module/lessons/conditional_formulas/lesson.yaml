- activity_id: conditional_formulas_workbook_guided
  title: Try It — Flag completed orders
  type: guided
  runtime: workbook
  prompt: |-
    On Orders, add Fulfillment Flag in M1. Return Complete when Status is Delivered; otherwise return Open. Fill the formula through M37.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. In **M1**, type the header `Fulfillment Flag`.
    3. In **M2**, enter `=IF(J2="Delivered","Complete","Open")` and press **Enter**.
    4. The IF test checks the Status in the same row. Delivered returns Complete; every other status returns Open.
    5. Fill M2 through **M37**.
    6. Filter or spot-check several Delivered and non-Delivered rows to confirm both results appear correctly.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: Every row in M2:M37 contains an IF formula returning Complete or Open.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Fulfillment Flag
    - type: formula_present
      sheet: Orders
      range: M2:M37
      min_count: 36
      contains_all:
      - if
      contains_any:
      - j2
      - status
    success_feedback: Every order now has a consistent fulfillment classification.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Orders
    columns:
    - Status
    - Fulfillment Flag
    row_range: J1:M37
    starting_state: Status is stored in column J and column M is available.
    expected_result: Every row in M2:M37 contains an IF formula returning Complete or Open.
    column_descriptions:
      Status: Current order status from the approved lookup list.
      Fulfillment Flag: Plain-language classification based on the order status.
    sample_values:
    - 'Status: Delivered'
    - 'Fulfillment Flag: Complete'
