- activity_id: conditional_formulas_workbook_practice
  title: Practice — Identify large orders for review
  type: mastery
  runtime: workbook
  prompt: |-
    Add Large Order Flag in N1. Return Review when Units are at least 20 and Revenue is at least $1,000; otherwise return Standard. Fill through N37.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. In **N1**, type the header `Large Order Flag`.
    3. In **N2**, enter `=IF(AND(G2>=20,K2>=1000),"Review","Standard")` and press **Enter**.
    4. AND requires both conditions to be true: Units must be at least 20 and Revenue must be at least $1,000.
    5. Fill N2 through **N37**.
    6. Spot-check one Review row and one Standard row against the Units and Revenue values.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: N2:N37 uses IF with AND to classify each order as Review or Standard.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Large Order Flag
    - type: formula_present
      sheet: Orders
      range: N2:N37
      min_count: 36
      contains_all:
      - if
      - and
    success_feedback: The workbook consistently identifies large orders that need review.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Orders
    columns:
    - Units
    - Revenue
    - Large Order Flag
    row_range: G1:N37
    starting_state: Units is in G and Revenue is in K. Column N is available.
    expected_result: N2:N37 uses IF with AND to classify each order as Review or Standard.
    column_descriptions:
      Units: Number of product units ordered.
      Revenue: Calculated order value after applying the row discount.
      Large Order Flag: Review indicator for orders that meet the lesson thresholds.
    sample_values:
    - 'Units: 18'
    - 'Revenue: $9,450.00'
    - 'Large Order Flag: Review'
