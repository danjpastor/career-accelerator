- activity_id: academy2_conditional_formulas_learn
  title: Learn — IF, AND, OR & Error Handling
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — IF, AND, OR & Error Handling
    objective: Use IF to return different results for true and false conditions.
    body: '# Turn business rules into clear labels


      The `IF` function returns one result when a condition is true and another when it is false. `AND` checks whether **every** condition is true. `OR` checks whether **at least one** condition is true.


      These functions help analysts turn written rules into repeatable classifications. For example, an order might need review when it is late **and** above a value threshold.


      Spreadsheet errors are messages that explain why a formula could not produce a result. `IFERROR` can replace an expected error with a clearer message, but it should not be used to hide a problem you have not understood.


      In this lesson, you will build classifications from business rules and handle expected errors without typing the final labels by hand.'
    concept_heading: Let the Formula Decide
  presentation:
    scenario: A beginner is learning if, and, or & error handling before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how if, and, or & error handling works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - spreadsheet.conditional_logic
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
- activity_id: academy2_conditional_formulas_check
  title: Learn & Predict — Turning rules into spreadsheet logic
  type: recognition
  runtime: recognition
  prompt: A record should be flagged when either its status is Backordered or its stock is below the reorder level. Which logical operator matches the rule?
  starter: ''
  solution: OR
  hints:
  - Ask whether all conditions must be true or whether any one condition is enough.
  - The rule says “either.”
  - Choose the option that follows the rule explained in the worked example.
  validator:
    type: exact_answer
    expected_answer: OR
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 4
