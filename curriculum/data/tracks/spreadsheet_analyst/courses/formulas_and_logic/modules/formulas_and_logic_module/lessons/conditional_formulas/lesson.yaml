- activity_id: academy2_conditional_formulas_example
  title: Example — See if, and, or & error handling in context
  type: recognition
  runtime: content
  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See if, and, or & error handling in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A service team marks a ticket “Urgent” when its priority is High **and** its age is more than 24 hours. Otherwise, it is marked “Standard.”


      The analyst first identifies the two conditions, then combines them with `AND` inside `IF`. A separate lookup may return an error when a ticket owner is missing; the analyst uses `IFERROR` to show “Owner not assigned.”


      **What to notice:** The formula mirrors the written rule. The error message is meaningful and only handles a known, expected case.'
    concept_heading: Let the Formula Decide
  presentation:
