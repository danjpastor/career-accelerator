lesson_id: academy2_conditional_formulas
title: IF, AND, OR & Error Handling
order: 1
difficulty: beginner
description: Use IF, AND, and OR to turn business rules into clear classifications.
estimated_minutes: 45
content: lesson.md
objectives:
- Use IF to return different results for true and false conditions.
- Combine conditions with AND or OR.
- Create readable flags that support operational review.
key_takeaways:
- IF evaluates a condition and returns one of two outcomes.
- AND requires every condition to be true.
- OR requires at least one condition to be true.
teaches:
- spreadsheet.conditional_logic
requires:
- spreadsheet.formulas
