- activity_id: academy2_conditional_formulas_independent
  title: Challenge — Identify large orders for review
  type: independent
  runtime: workbook
  prompt: In N2:N37, classify orders as Review when Units are at least 20 and Revenue is at least $1,000; otherwise classify them as Standard.
  starter: ''
  solution: In N2 use `=IF(AND(G2>=20,K2>=1000),"Review","Standard")`, then fill through N37.
  hints:
  - The order should be reviewed only when two conditions are true at the same time.
  - Place both comparisons inside AND, then use that result as the IF condition.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Large Order Flag
      message: 'The workbook does not yet meet this requirement: Every order is classified with a formula that combines IF and AND.'
    - type: formula_present
      sheet: Orders
      range: N2:N37
      min_count: 36
      contains_all:
      - if
      - and
      message: 'The workbook does not yet meet this requirement: Every order is classified with a formula that combines IF and AND.'
    success_feedback: You used AND to enforce a rule in which both thresholds must be satisfied.
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: false
  difficulty: intermediate
  estimated_minutes: 18
  presentation:
