- activity_id: academy2_conditional_formulas_guided
  title: Try It — Classify fulfilled orders
  type: guided
  runtime: workbook
  prompt: Use IF to classify each order in M2:M37 as Complete or Open based on Status.
  starter: ''
  solution: In M2 use `=IF(J2="Delivered","Complete","Open")`, then fill through M37.
  hints:
  - IF needs a condition, a result when true, and a result when false.
  - Compare the current row’s Status with the text Delivered.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Fulfillment Flag
      message: 'The workbook does not yet meet this requirement: Every order has a formula-driven Complete or Open flag.'
    - type: formula_present
      sheet: Orders
      range: M2:M37
      min_count: 36
      contains_all:
      - if
      contains_any:
      - j2
      - status
      message: 'The workbook does not yet meet this requirement: Every order has a formula-driven Complete or Open flag.'
    success_feedback: You translated one business rule into a repeatable row-level classification.
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 12
  presentation:
