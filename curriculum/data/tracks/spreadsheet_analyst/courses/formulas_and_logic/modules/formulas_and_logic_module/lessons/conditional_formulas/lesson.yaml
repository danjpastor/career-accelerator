- activity_id: conditional_formulas_workbook_guided
  title: Try It — Flag completed orders
  type: guided
  runtime: workbook
  prompt: 'On Orders, add Fulfillment Flag in M1. Return Complete when Status is Delivered; otherwise return Open.
    Fill the formula through M37.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Orders** and work in Orders, range M2:M37.

    3. Use these columns for this task: **Status, Fulfillment Flag**.

    4. Click the first required output cell and begin the lookup formula with `=`.

    5. Use the current row''s key as the search key and the named lookup table as the lookup range.

    6. Use an exact match and lock the lookup range with `$` references before filling down.

    7. Verify at least three results against the source table and correct unexpected `#N/A` values.

    8. Confirm the finished workbook matches this result: **Every row in M2:M37 contains an IF formula returning
    Complete or Open.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: Every row in M2:M37 contains an IF formula returning Complete or Open.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: headers
      sheet: Orders
      row: 1
      expected:
      - Fulfillment Flag
    - type: formula_present
      sheet: Orders
      range: M2:M37
      min_count: 36
      contains_all:
      - if
      contains_any:
      - j2
      - status
    success_feedback: Every order now has a consistent fulfillment classification.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Orders
    columns:
    - Status
    - Fulfillment Flag
    row_range: J1:M37
    starting_state: Status is stored in column J and column M is available.
    expected_result: Every row in M2:M37 contains an IF formula returning Complete or Open.
    column_descriptions:
      Status: Current order status from the approved lookup list.
      Fulfillment Flag: Plain-language classification based on the order status.
    sample_values:
    - 'Status: Delivered'
    - 'Fulfillment Flag: Complete'
