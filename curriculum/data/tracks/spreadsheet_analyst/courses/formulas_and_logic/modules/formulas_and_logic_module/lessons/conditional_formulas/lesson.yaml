lesson_id: conditional_formulas
title: IF, AND, OR & Error Handling
order: 1
difficulty: beginner
description: Turn operational rules into clear IF and AND formulas that classify each order.
estimated_minutes: 40
content: lesson.md
objectives:
- Create a simple status flag with IF.
- Combine conditions with IF and AND.
key_takeaways:
- IF converts a business rule into a repeatable classification.
- AND requires every included condition to be true.
teaches: &id001
- spreadsheet.conditional_logic
requires:
- spreadsheet.formulas
