- activity_id: conditional_formulas_1
  title: Learn — Quick concept check
  type: recognition
  runtime: recognition
  prompt: 'Which formula structure returns one result when a condition is true and another when it is false?


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **the worksheet named in the task** and work in the worksheet named in the task.

    3. Click the first required output cell and start an `IF` formula with `=`.

    4. Enter the condition, the result when TRUE, and the result when FALSE.

    5. Use `AND(...)` inside the condition when every listed requirement must be true.

    6. Fill the formula down and test at least one TRUE row and one FALSE row.

    7. Confirm the finished workbook matches this result: **One selected answer.**

    8. Wait until Google Sheets shows that saving is complete.

    9. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
