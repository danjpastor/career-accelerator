    requirements:
    - Add Fulfillment Flag in M1.
    - Base the condition on the current row’s Status.
    - Fill the formula through row 37.
    expected_output: Every order has a formula-driven Complete or Open flag.
    skills_practiced:
    - spreadsheet.conditional_logic
    after_correct: You translated one business rule into a repeatable row-level classification.
    common_errors:
