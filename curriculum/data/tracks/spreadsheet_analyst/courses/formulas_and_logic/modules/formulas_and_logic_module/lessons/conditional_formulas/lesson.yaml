    requirements:
    - Add Large Order Flag in N1.
    - Use both Units and Revenue in the condition.
    - Require both thresholds to be met before returning Review.
    expected_output: Every order is classified with a formula that combines IF and AND.
    skills_practiced:
    - spreadsheet.conditional_logic
    after_correct: You used AND to enforce a rule in which both thresholds must be satisfied.
    common_errors:
    - Working in a different Google Sheet than the link saved in Career Accelerator.
    - Selecting Check My Work before Google Sheets finishes saving.
    - Using different cells, ranges, labels, or output text than the lesson requires.
    primary_workbook_action: Open Google Sheet
    check_action: Check My Work
    hide_download_upload: true
    hide_exact_result: true
