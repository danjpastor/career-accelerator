  instruction:
    title: Learn — COUNTIFS, SUMIFS & Variance
    objective: Which function is designed to sum values that meet one or more conditions?
    action_label: Choose the best answer
    body: '`SUMIFS` adds a measure for rows that meet conditions. `COUNTIFS` counts qualifying rows. Keep the criteria
      explicit so another analyst can audit the calculation.'
  required_for_completion: true
- activity_id: conditional_summaries_workbook_guided
  title: Try It — Calculate West-region revenue
  type: guided
  runtime: workbook
  prompt: 'On Analysis Workspace, calculate total West-region Revenue in B8 using the Orders sheet. Keep the target
    in B7 unchanged.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range A7:B8.

    3. Use these columns for this task: **West revenue target, West revenue**.

    4. Click the first required output cell and type `=` to begin the formula.

    5. Build the formula with the source cells from the current row, then press **Enter**.

    6. Drag the blue fill handle through the full required range.

    7. Spot-check the first, middle, and last result before checking your work.

    8. Confirm the finished workbook matches this result: **B8 contains a conditional-sum formula that returns West
    revenue.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
