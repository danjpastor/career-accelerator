- activity_id: conditional_summaries_workbook_practice
  title: Practice — Count delivered orders and calculate variance
  type: mastery
  runtime: workbook
  prompt: |-
    In B9, count orders with Status equal to Delivered. In B10, calculate West revenue minus the target in B7.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. In **B9**, enter `=COUNTIF(Orders!J2:J37,"Delivered")` to count delivered orders.
    3. In **B10**, enter `=B8-B7` to calculate actual West revenue minus the target.
    4. Format B10 as currency.
    5. Confirm B9 is a whole-number count and B10 is positive when actual revenue is above target.
    6. Wait until Google Sheets shows that all changes are saved.
    7. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: B9 contains a COUNTIF or COUNTIFS formula and B10 contains a variance formula.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B9
      min_count: 1
      contains_any:
      - countif
      - countifs
    - type: formula_present
      sheet: Analysis Workspace
      cell: B10
      min_count: 1
      contains_all:
      - b8
      - b7
    success_feedback: The summary now shows both delivered-order volume and performance against target.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Delivered orders
    - Variance to target
    row_range: A9:B10
    starting_state: B9 and B10 are blank. B7 contains the target and B8 contains West revenue.
    expected_result: B9 contains a COUNTIF or COUNTIFS formula and B10 contains a variance formula.
    column_descriptions:
      Delivered orders: Count of orders whose status is Delivered.
      Variance to target: Difference between West revenue and its target.
    sample_values:
    - 'Delivered orders: 19'
    - 'Variance to target: $100,106.00'
