- activity_id: academy2_conditional_summaries_independent
  title: Challenge — Count delivered orders and calculate variance
  type: independent
  runtime: workbook
  prompt: Calculate the delivered-order count in B9 and the West revenue variance to target in B10.
  starter: ''
  solution: In B9 use `=COUNTIF(Orders!J2:J37,"Delivered")`. In B10 use `=B8-B7`.
  hints:
  - The first result asks how many rows meet a text condition.
  - The second result compares the actual value already calculated in B8 with the target in B7.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and
    last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B9
      min_count: 1
      contains_any:
      - countif
      - countifs
      message: 'The workbook does not yet meet this requirement: B9 contains a conditional count and B10 contains the actual-minus-target
        variance.'
    - type: formula_present
      sheet: Analysis Workspace
      cell: B10
      min_count: 1
      contains_all:
      - b8
      - b7
      message: 'The workbook does not yet meet this requirement: B9 contains a conditional count and B10 contains the actual-minus-target
        variance.'
    success_feedback: You paired a conditional operational count with a target variance that can be interpreted as favorable
      or unfavorable.
