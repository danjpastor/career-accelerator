  starter: ''
  solution: In B8 use `=SUMIF(Orders!D2:D37,"West",Orders!K2:K37)` or an equivalent SUMIFS formula.
  hints:
  - Identify the range containing Region and the range containing Revenue.
  - The condition is West; the values to add are in the Revenue column.
