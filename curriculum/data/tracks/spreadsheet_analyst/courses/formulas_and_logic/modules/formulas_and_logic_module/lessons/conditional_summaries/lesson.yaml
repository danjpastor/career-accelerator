lesson_id: conditional_summaries
title: COUNTIFS, SUMIFS & Variance
order: 2
difficulty: beginner
description: Summarize the order table with SUMIFS, COUNTIFS, and a simple variance calculation.
estimated_minutes: 40
content: lesson.md
objectives:
- Calculate revenue for one region.
- Count orders that meet a status condition and compare performance with a target.
key_takeaways:
- Conditional summary functions aggregate only qualifying rows.
- A variance explains how actual performance compares with a target.
teaches: &id001
- spreadsheet.conditional_aggregation
requires:
- spreadsheet.conditional_logic
