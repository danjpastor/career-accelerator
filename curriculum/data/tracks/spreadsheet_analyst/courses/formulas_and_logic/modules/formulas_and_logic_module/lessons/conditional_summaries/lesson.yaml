  title: Learn — COUNTIFS, SUMIFS & Variance
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — COUNTIFS, SUMIFS & Variance
    objective: Use SUMIF or SUMIFS to total values that meet criteria.
    body: '# Summarize rows that meet several conditions


      `COUNTIFS` counts rows that meet all of the conditions you provide. `SUMIFS` adds values from rows that meet all of
      those conditions.


      Each condition uses a **criteria range** and a **criterion**. The ranges should cover the same rows. A mismatch can
      produce a wrong result or an error.


      **Variance** compares an actual value with a target or budget. A common calculation is actual minus target, but the
      business meaning depends on the measure: a positive sales variance may be good, while a positive cost variance may be
      bad.


      In this lesson, you will create conditional counts and totals, then explain what a variance means instead of reporting
      a number without context.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
