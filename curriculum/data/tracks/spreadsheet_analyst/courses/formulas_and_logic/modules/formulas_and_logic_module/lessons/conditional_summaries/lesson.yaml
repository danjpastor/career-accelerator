- activity_id: conditional_summaries_1
  title: Learn — Quick concept check
  type: recognition
  runtime: recognition
  prompt: Which function is designed to sum values that meet one or more conditions?
  answer_options:
  - SUMIFS
  - COUNT
  - LEFT
  - SORT
  starter: ''
  solution: SUMIFS
  hints:
  - Review the short explanation and focus on the role each field or formula plays.
  validator:
    type: exact_answer
    expected_answer: SUMIFS
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 4
  presentation:
