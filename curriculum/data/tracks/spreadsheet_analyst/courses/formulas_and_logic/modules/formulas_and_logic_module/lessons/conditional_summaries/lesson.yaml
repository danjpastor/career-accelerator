- activity_id: conditional_summaries_workbook_guided
  title: Try It — Calculate West-region revenue
  type: guided
  runtime: workbook
  prompt: |-
    On Analysis Workspace, calculate total West-region Revenue in B8 using the Orders sheet. Keep the target in B7 unchanged.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. Click **B8** beside West revenue.
    3. Enter `=SUMIF(Orders!D2:D37,"West",Orders!K2:K37)` and press **Enter**.
    4. The first range contains the Region criteria, `West` is the condition, and the last range contains Revenue to add.
    5. Leave the target in B7 unchanged.
    6. Format B8 as currency using **Format → Number → Currency**.
    7. Wait until Google Sheets shows that all changes are saved.
    8. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: B8 contains a conditional-sum formula that returns West revenue.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      cell: B8
      min_count: 1
      contains_any:
      - sumif
      - sumifs
    success_feedback: The West revenue summary is formula-driven and auditable.
