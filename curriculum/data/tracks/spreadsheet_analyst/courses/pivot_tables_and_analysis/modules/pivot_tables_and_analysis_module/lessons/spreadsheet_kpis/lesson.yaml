- activity_id: academy2_spreadsheet_kpis_guided
  title: Try It — Build the KPI block
  type: guided
  runtime: workbook
  prompt: Calculate and format the four KPIs in Analysis Workspace I3:I6, then add the requested conditional formatting to
    Delivered Rate.
  starter: ''
  solution: Use SUM of Orders Revenue for Total Revenue, AVERAGE of Revenue for Average Order Value, SUM of Units for Total
    Units, and Delivered count divided by total order count for Delivered Rate. Apply currency, number, and percentage formats,
    then add a conditional-format rule for I6 < 60%.
  hints:
  - The first three KPIs use common summary functions; the rate is a part divided by a whole.
  - Delivered Rate compares the number of Delivered orders with all orders.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and
    last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      range: I3:I6
      min_count: 4
      message: 'The workbook does not yet meet this requirement: I3:I6 contains four readable formula-driven KPIs and the
        rate has a saved warning rule.'
    - type: conditional_formatting
      sheet: Analysis Workspace
      range: I6
      message: Add a conditional-formatting rule to I6 that flags a Delivered Rate below 60%.
    success_feedback: You combined calculations, units, and visual emphasis into a compact stakeholder-ready KPI block.
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
  difficulty: beginner
  estimated_minutes: 12
  presentation:
    scenario: Northstar Operations practice workbook
    introduction: Apply the named skill to a real business task. The lesson explains the method, but you choose the cell references,
      ranges, and final formula.
    task: Calculate and format the four KPIs in Analysis Workspace I3:I6, then add the requested conditional formatting to
      Delivered Rate.
    requirements:
    - Use formulas tied to the complete Orders data.
    - Format Total Revenue and Average Order Value as U.S. dollars.
    - Format Delivered Rate as a percentage and flag values below 60%.
    expected_output: I3:I6 contains four readable formula-driven KPIs and the rate has a saved warning rule.
    skills_practiced:
    - spreadsheet.kpis
    after_correct: You combined calculations, units, and visual emphasis into a compact stakeholder-ready KPI block.
    common_errors:
    - Working in a different Google Sheet than the link saved in Career Accelerator.
    - Selecting Check My Work before Google Sheets finishes saving.
    - Using different cells, ranges, labels, or output text than the lesson requires.
    primary_workbook_action: Open Google Sheet
    check_action: Check My Work
    hide_download_upload: true
    success_criteria: I3:I6 contains four readable formula-driven KPIs and the rate has a saved warning rule.
    hide_exact_result: true
  instruction:
    phase: TRY IT
    title: Try It — Build the KPI block
    objective: Create formula-driven metrics and use formatting to make them readable.
    approach: Use the completed Orders table to calculate Total Revenue, Average Order Value, Total Units, and Delivered Rate
      in the prepared KPI area. Format money as currency and the rate as a percentage. Add a conditional rule that calls attention
      to a Delivered Rate below 60%.
    action_label: Open the workbook and solve the task
    watch_for: Use the named spreadsheet skill, verify a few results, and avoid changing source values that are not part of
      the task.
  required_for_completion: true
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving, then select Check My Work. Career Accelerator downloads the
      latest shared workbook automatically.
    sheet: Analysis Workspace
    columns:
    - Total Revenue
    - Average Order Value
    - Total Units
    - Delivered Rate
    row_range: H3:I6
    starting_state: The KPI labels exist in H3:H6, while I3:I6 is blank and has no conditional formatting.
    expected_result: I3:I6 contains four readable formula-driven KPIs and the rate has a saved warning rule.
    column_descriptions:
      Total Revenue: Revenue across all orders in the workbook.
      Average Order Value: Average revenue produced by one order.
      Total Units: Total number of units across all orders.
      Delivered Rate: Share of orders whose status is Delivered.
