  prompt: ''
  instruction:
    title: Example — See kpi summaries & business interpretation in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A support manager tracks Open Tickets, Average Resolution Hours, and Percent Resolved Within Target. The analyst places
      these three KPIs at the top of a summary sheet and adds a bar chart comparing open tickets by team.


      The analyst writes one sentence below the chart: “Billing has the most open tickets and is the only team above its weekly
      target.”


      **What to notice:** A dashboard is not a collection of decorations. Every number and chart should support a decision.'
