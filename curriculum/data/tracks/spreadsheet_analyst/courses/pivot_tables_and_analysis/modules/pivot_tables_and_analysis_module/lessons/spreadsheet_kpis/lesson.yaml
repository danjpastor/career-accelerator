- activity_id: spreadsheet_kpis_workbook_guided
  title: Try It — Build the KPI block
  type: guided
  runtime: workbook
  prompt: 'In Analysis Workspace, calculate Total Revenue, Average Order Value, Total Units, and Delivered Rate
    in I3:I6. Format the currency and percentage values appropriately. Add conditional formatting to I6 so a delivered
    rate below 60% is clearly flagged for attention.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range I3:I6.

    3. Use these columns for this task: **Total Revenue, Average Order Value, Total Units, Delivered Rate**.

    4. Select the full target range without the header unless the task says otherwise.

    5. Choose **Format → Conditional formatting**.

    6. Create the required single-color rule, color scale, or custom formula and select the requested formatting.

    7. Click **Done** and verify both a matching and a non-matching cell.

    8. Confirm the finished workbook matches this result: **I3:I6 contains four formula-driven KPIs, and I6 has
    a saved conditional-formatting rule that flags performance below 60%.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: I3:I6 contains four formula-driven KPIs, and I6 has a saved conditional-formatting rule that flags performance
    below 60%.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      range: I3:I6
      min_count: 4
    - type: conditional_formatting
      sheet: Analysis Workspace
      range: I6
      message: Add a conditional-formatting rule to I6 that flags a Delivered Rate below 60%.
    success_feedback: The KPI block is formula-driven, formatted for the business audience, and flags a low delivered
      rate.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Analysis Workspace
    columns:
    - Total Revenue
    - Average Order Value
    - Total Units
    - Delivered Rate
    row_range: H3:I6
    starting_state: The KPI labels exist in H3:H6, while I3:I6 is blank and has no conditional formatting.
    expected_result: I3:I6 contains four formula-driven KPIs, and I6 has a saved conditional-formatting rule that
      flags performance below 60%.
    column_descriptions:
      Total Revenue: Revenue across all orders in the workbook.
      Average Order Value: Average revenue produced by one order.
      Total Units: Total number of units across all orders.
      Delivered Rate: Share of orders whose status is Delivered.
    sample_values:
    - 'Total Revenue: $165,096.85'
    - 'Average Order Value: $4,586.02'
    - 'Total Units: 900'
    - 'Delivered Rate: 52.8%'
