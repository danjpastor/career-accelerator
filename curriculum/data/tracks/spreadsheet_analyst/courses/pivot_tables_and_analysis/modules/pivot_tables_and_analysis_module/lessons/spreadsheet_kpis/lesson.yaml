- activity_id: spreadsheet_kpis_workbook_guided
  title: Try It — Build the KPI block
  type: guided
  runtime: workbook
  prompt: |-
    In Analysis Workspace, calculate Total Revenue, Average Order Value, Total Units, and Delivered Rate in I3:I6. Format the currency and percentage values appropriately. Add conditional formatting to I6 so a delivered rate below 60% is clearly flagged for attention.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. In **I3**, enter `=SUM(Orders!K2:K37)` for Total Revenue.
    3. In **I4**, enter `=AVERAGE(Orders!K2:K37)` for Average Order Value.
    4. In **I5**, enter `=SUM(Orders!G2:G37)` for Total Units.
    5. In **I6**, enter `=COUNTIF(Orders!J2:J37,"Delivered")/COUNTA(Orders!A2:A37)` for Delivered Rate.
    6. Format I3:I4 as currency, I5 as a whole number, and I6 as a percentage.
    7. Select I6 and choose **Format → Conditional formatting**.
    8. Create a rule for **Less than 0.60**, choose a clear warning style, and select **Done**.
    9. Wait until Google Sheets shows that all changes are saved.
    10. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: I3:I6 contains four formula-driven KPIs, and I6 has a saved conditional-formatting rule that flags
    performance below 60%.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: formula_present
      sheet: Analysis Workspace
      range: I3:I6
      min_count: 4
    - type: conditional_formatting
      sheet: Analysis Workspace
      range: I6
      message: Add a conditional-formatting rule to I6 that flags a Delivered Rate below 60%.
    success_feedback: The KPI block is formula-driven, formatted for the business audience, and flags a low
      delivered rate.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Total Revenue
    - Average Order Value
    - Total Units
    - Delivered Rate
    row_range: H3:I6
    starting_state: The KPI labels exist in H3:H6, while I3:I6 is blank and has no conditional formatting.
    expected_result: I3:I6 contains four formula-driven KPIs, and I6 has a saved conditional-formatting rule
      that flags performance below 60%.
    column_descriptions:
      Total Revenue: Revenue across all orders in the workbook.
      Average Order Value: Average revenue produced by one order.
      Total Units: Total number of units across all orders.
      Delivered Rate: Share of orders whose status is Delivered.
    sample_values:
    - 'Total Revenue: $165,096.85'
    - 'Average Order Value: $4,586.02'
    - 'Total Units: 900'
    - 'Delivered Rate: 52.8%'
