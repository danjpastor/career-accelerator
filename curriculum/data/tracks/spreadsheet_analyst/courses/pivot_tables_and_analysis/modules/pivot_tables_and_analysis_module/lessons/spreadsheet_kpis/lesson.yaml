lesson_id: spreadsheet_kpis
title: KPI Summaries & Business Interpretation
order: 2
difficulty: beginner
description: Build a compact KPI block and a chart that communicates the most important operational result.
estimated_minutes: 40
content: lesson.md
objectives:
- Calculate four clear KPIs.
- Create a chart with a descriptive title and readable labels.
key_takeaways:
- A KPI should answer a business question, not merely display a number.
- Charts should emphasize comparison and use a specific title.
