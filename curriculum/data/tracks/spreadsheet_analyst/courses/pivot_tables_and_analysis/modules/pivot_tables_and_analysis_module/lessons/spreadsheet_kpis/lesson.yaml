  prompt: ''
  instruction:
    title: Learn — KPI Summaries & Business Interpretation
    objective: Calculate total, average, count, and rate KPIs.
    body: '# Turn calculations into a focused business summary


      A **key performance indicator**, or KPI, is a measure selected because it helps someone track an important goal. A useful
      KPI block shows the value, its label, the time period, and often a comparison with a target or prior period.


      Formatting should make meaning easier to see. Currency, percentages, and dates need appropriate formats. Conditional
      formatting can draw attention to exceptions, but too many colors make a report harder to read.


      Charts should answer a clear question. A bar chart works well for comparing categories; a line chart works well for
      change over time.


      In this lesson, you will build a compact summary and explain what the result means for the business.'
  presentation:
    scenario: A short Academy lesson
    introduction: Learn the idea in plain language before you use it.
    task: Read the explanation, then continue when the idea makes sense.
