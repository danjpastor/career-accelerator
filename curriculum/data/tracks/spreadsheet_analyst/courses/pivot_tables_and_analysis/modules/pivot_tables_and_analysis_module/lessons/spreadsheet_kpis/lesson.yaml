  estimated_minutes: 4
  presentation:
    scenario: Northstar Operations learning scenario
    introduction: Study the concept and worked example, then make a prediction before opening the workbook.
    task: Which chart is usually best for comparing revenue across a small number of regions?
    requirements:
    - Choose the answer that best follows the concept explained in the lesson.
    expected_output: One selected answer supported by the lesson concept.
    skills_practiced:
    - spreadsheet.kpis
    after_correct: Column and bar charts make differences among categories easy to compare against a shared scale.
  instruction:
    phase: LEARN & PREDICT
    title: Learn & Predict — Choosing and presenting KPIs
    objective: Match KPI questions to calculations and visual forms.
    why_it_matters: A dashboard should help a stakeholder understand performance quickly. Too many metrics or the wrong visual
      can hide the important signal.
    concept: Totals answer “how much,” averages answer “what is typical,” counts answer “how many,” and rates compare one
      count with another. Currency and percentage formats communicate units. Column or bar charts are effective for comparing
      categories.
    worked_example: An ecommerce summary shows Total Sales, Average Basket Value, Orders, and On-Time Delivery Rate. A conditional
      rule flags delivery rates below the service target, while a column chart compares Sales by Channel.
    action_label: Make a prediction
  required_for_completion: true
  answer_options:
  - Column chart
  - Scatter plot
  - Gauge with no scale
  - A separate pie chart for every region
  step_kind: knowledge_check
  completion_mode: validated
  xp: 50
