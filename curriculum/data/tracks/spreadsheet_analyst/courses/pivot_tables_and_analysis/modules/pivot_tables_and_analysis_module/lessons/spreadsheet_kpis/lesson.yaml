- activity_id: spreadsheet_kpis_workbook_practice
  title: Practice — Create a revenue-by-region chart
  type: mastery
  runtime: workbook
  prompt: |-
    Create a column or bar chart from the region summary. Give it the title Revenue by Region and place it near the KPI block without covering the data.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Analysis Workspace**.
    2. Select the Region and Revenue values in the region summary, excluding any grand-total row.
    3. Choose **Insert → Chart**.
    4. In Chart editor → Setup, choose a **Column chart** or **Bar chart**.
    5. Confirm Region is used as the category axis and Revenue is the series.
    6. In Customize → Chart & axis titles, set the chart title exactly to `Revenue by Region`.
    7. Drag the chart near the KPI block without covering the KPI values or source summary.
    8. If Career Accelerator asks for evidence, enter the exact chart title `Revenue by Region`.
    9. Wait until Google Sheets shows that all changes are saved.
    10. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: A readable chart titled Revenue by Region is saved near the KPI block.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: any_of
      checks:
      - type: chart_present
        sheet: Analysis Workspace
      - type: evidence_answer
        expected_answer: Revenue by Region
      message: Create the chart or enter its exact title after completing it.
    success_feedback: The chart communicates regional revenue clearly.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Region
    - Revenue
    row_range: A28:J44
    starting_state: The region summary and KPI block are available on Analysis Workspace.
    expected_result: A readable chart titled Revenue by Region is saved near the KPI block.
    column_descriptions:
      Region: Sales territory assigned to the order or customer.
      Revenue: Calculated order value after applying the row discount.
    sample_values:
    - 'Region: West'
    - 'Revenue: $9,450.00'
    evidence_prompt: Enter the exact chart title you used.
  required_for_practice: false
  required_for_mastery: true
  evidence_eligible: false
