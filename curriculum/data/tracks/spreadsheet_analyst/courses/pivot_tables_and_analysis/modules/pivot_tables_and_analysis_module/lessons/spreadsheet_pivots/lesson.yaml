        sheet: Analysis Workspace
        range: A28:D34
        min_count: 8
      message: 'The workbook does not yet meet this requirement: A saved region summary shows total Revenue for each region in descending order.'
    - type: evidence_answer
      expected_answer: West
      message: Review the region summary and enter the highest-revenue region.
    success_feedback: You summarized transaction-level revenue into a compact region-level comparison.
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
