- activity_id: academy2_spreadsheet_pivots_learn
  title: Learn — Pivot Tables, Dimensions & Measures
  type: recognition
  runtime: content
  step_kind: concept
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Learn — Pivot Tables, Dimensions & Measures
    objective: Distinguish dimensions from measures.
    body: '# Summarize a large table without writing many formulas


      A pivot table groups detailed rows into a smaller summary. A **dimension** is a category used to group the data, such as Region or Product Category. A **measure** is a number you summarize, such as Revenue, Quantity, or Average Resolution Time.


      The same source table can answer different questions depending on where fields are placed in Rows, Columns, Values, and Filters. The aggregation method matters: sum, count, and average answer different questions.


      In this lesson, you will build and interpret a pivot table, then check whether the source range and aggregation match the business question.'
    concept_heading: Summarize Without New Formulas
  presentation:
    scenario: A beginner is learning pivot tables, dimensions & measures before using it in real analysis.
    introduction: Start with the idea in plain language, then continue when it makes sense.
    task: Learn how pivot tables, dimensions & measures works and why an analyst would use it.
    requirements: []
    expected_output: A clear understanding of the lesson idea.
    skills_practiced:
    - spreadsheet.pivots
  validator: {}
  hints: []
  solution: ''
  required_for_completion: true
  required_for_practice: true
  required_for_mastery: false
