  instruction:
    phase: LEARN & PREDICT
    title: Learn & Predict — Dimensions, measures, and pivot layout
    objective: Choose which fields belong in Rows and Values.
    why_it_matters: Pivot tables let analysts summarize large tables quickly, but the result is meaningful only when grouping fields and numeric measures are assigned correctly.
    concept: A **dimension** describes how records should be grouped, such as Region or Category. A **measure** is the numeric value being summarized, such as Revenue or Units. Rows usually contain dimensions; Values usually contain measures with an aggregation such as SUM.
    worked_example: A support-ticket pivot uses Team in Rows and Ticket ID in Values summarized by COUNT. Team is the dimension; ticket count is the measure. Adding Priority as Columns would split each team’s count into priority groups.
    action_label: Make a prediction
    concept_heading: Let the Formula Decide
  required_for_completion: true
  answer_options:
  - Revenue
  - Region
  - Sales Rep name
  - Order Status text
  step_kind: knowledge_check
  completion_mode: validated
