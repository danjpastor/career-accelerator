  prompt: |-
    Create a second pivot or grouped summary with Category in Rows and Sum of Units in Values. Place it in Analysis Workspace starting at G28 and sort largest to smallest.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. Select the complete populated Orders table, including **Category** and **Units**.
    3. Choose **Insert → Pivot table**, choose **Existing sheet**, and enter `Analysis Workspace!G28`.
    4. Add **Category** under Rows.
    5. Add **Units** under Values and confirm Summarize by is **SUM**.
    6. Sort the category rows by **SUM of Units** in descending order.
    7. Confirm the highest-unit category appears first, then enter that category in Check Your Work.
    8. Wait until Google Sheets shows that all changes are saved.
    9. Return to Career Accelerator and select **Check My Work**.
