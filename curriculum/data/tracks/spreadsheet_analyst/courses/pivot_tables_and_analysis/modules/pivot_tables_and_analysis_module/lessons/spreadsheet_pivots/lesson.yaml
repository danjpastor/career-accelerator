lesson_id: spreadsheet_pivots
title: Pivot Tables, Dimensions & Measures
order: 1
difficulty: beginner
description: Use pivot tables—or equivalent grouped summaries—to explore revenue by region and units by category.
estimated_minutes: 40
content: lesson.md
objectives:
- Place a dimension in rows and a measure in values.
- Validate the highest-performing region and category.
key_takeaways:
- Dimensions describe groups; measures are aggregated.
- A pivot result should be checked against a known summary or total.
teaches: &id001
- spreadsheet.pivots
requires:
- spreadsheet.relationships
