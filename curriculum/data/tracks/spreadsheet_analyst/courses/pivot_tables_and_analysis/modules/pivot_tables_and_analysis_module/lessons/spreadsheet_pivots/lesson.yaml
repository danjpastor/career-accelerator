- activity_id: academy2_spreadsheet_pivots_example
  title: Example — See pivot tables, dimensions & measures in context
  type: recognition
  runtime: content
  step_kind: worked_example
  completion_mode: continue
  xp: 50
  estimated_minutes: 3
  prompt: ''
  instruction:
    title: Example — See pivot tables, dimensions & measures in context
    objective: Study a worked example before solving a different task.
    body: '## A separate example


      A donation table contains one row per donation. A nonprofit creates a pivot with Campaign in Rows and Donation Amount in Values using SUM. It then adds Payment Method as Columns.


      When the analyst accidentally changes the value to COUNT, the table shows the number of donations rather than the dollars raised. Both results are valid, but they answer different questions.


      **What to notice:** Dimensions organize the summary; measures and aggregation define what is being calculated.'
    concept_heading: Make the Data Consistent
  presentation:
