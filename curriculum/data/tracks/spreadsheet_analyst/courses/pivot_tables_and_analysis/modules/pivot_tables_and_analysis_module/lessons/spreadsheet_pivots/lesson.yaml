- activity_id: spreadsheet_pivots_workbook_guided
  title: Try It — Summarize revenue by region
  type: guided
  runtime: workbook
  prompt: |-
    Create a pivot table from Orders with Region in Rows and Sum of Revenue in Values. Place it in Analysis Workspace starting at A28. Sort the values largest to smallest.

    ### Complete this task in Google Sheets

    1. Select **Open Google Sheet**, then open **Orders**.
    2. Select the complete populated Orders table, including headers and the calculated columns needed for analysis.
    3. Choose **Insert → Pivot table**.
    4. Choose **Existing sheet**, enter `Analysis Workspace!A28`, and select **Create**.
    5. In the Pivot table editor, add **Region** under Rows.
    6. Add **Revenue** under Values and confirm Summarize by is **SUM**.
    7. Under the Region row settings, sort by **SUM of Revenue** in descending order.
    8. Confirm the highest-revenue region appears first, then enter that region in Check Your Work.
    9. Wait until Google Sheets shows that all changes are saved.
    10. Return to Career Accelerator and select **Check My Work**.
  starter: ''
  solution: A region summary or pivot is saved in A28:D34, with West as the highest-revenue region.
  hints:
  - Use the exact sheet, cells, and Google Sheets menu path shown in the numbered steps.
  - Wait until Google Sheets finishes saving, then select Check My Work.
  validator:
    type: workbook
    checks:
    - type: any_of
      checks:
      - type: pivot_present
        sheet: Analysis Workspace
      - type: populated_range
        sheet: Analysis Workspace
        range: A28:D34
        min_count: 8
    - type: evidence_answer
      expected_answer: West
      message: Review the region summary and enter the highest-revenue region.
    success_feedback: Your region summary is saved and you correctly identified West as the highest-revenue
      region.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Wait until Google Sheets finishes saving. Career Accelerator downloads the linked workbook
      automatically when Check My Work is selected.
    sheet: Analysis Workspace
    columns:
    - Region
    - Sum of Revenue
    row_range: A28:D34
    starting_state: A28:D34 is reserved for the region analysis.
    expected_result: A region summary or pivot is saved in A28:D34, with West as the highest-revenue region.
    column_descriptions:
      Region: Sales territory assigned to the order or customer.
      Sum of Revenue: Aggregated revenue for one dimension value.
    sample_values:
    - 'Region: West'
    - 'Sum of Revenue: $115,106.00'
    evidence_prompt: Which region has the highest total revenue?
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
