- activity_id: spreadsheet_pivots_workbook_guided
  title: Try It — Summarize revenue by region
  type: guided
  runtime: workbook
  prompt: 'Create a pivot table from Orders with Region in Rows and Sum of Revenue in Values. Place it in Analysis
    Workspace starting at A28. Sort the values largest to smallest.


    <!-- DCA GOOGLE SHEETS STEPS START -->

    ### Complete this task in Google Sheets


    1. Click **Open Google Sheet** to open the continuing Northstar Operations workbook.

    2. Open **Analysis Workspace** and work in Analysis Workspace, range A28:D34.

    3. Use these columns for this task: **Region, Sum of Revenue**.

    4. Select the complete source table, including its header row.

    5. Choose **Insert → Pivot table**, select **New sheet**, and click **Create**.

    6. Add the row, column, value, and filter fields named in the task in the Pivot table editor.

    7. Set the required summarize-by calculation and reconcile the grand total to the source data.

    8. Confirm the finished workbook matches this result: **A region summary or pivot is saved in A28:D34, with
    West as the highest-revenue region.**

    9. Wait until Google Sheets shows that saving is complete.

    10. Return to Career Accelerator and click **Check My Work**.

    <!-- DCA GOOGLE SHEETS STEPS END -->'
  starter: ''
  solution: A region summary or pivot is saved in A28:D34, with West as the highest-revenue region.
  hints:
  - Open the practice workbook and use the exact sheet, columns, and rows listed in the lesson.
  - Save the .xlsx working copy before selecting Check Workbook.
  validator:
    type: workbook
    checks:
    - type: any_of
      checks:
      - type: pivot_present
        sheet: Analysis Workspace
      - type: populated_range
        sheet: Analysis Workspace
        range: A28:D34
        min_count: 8
    - type: evidence_answer
      expected_answer: West
      message: Review the region summary and enter the highest-revenue region.
    success_feedback: Your region summary is saved and you correctly identified West as the highest-revenue region.
  workbook:
    workbook_name: Northstar Operations Practice Workbook.xlsx
    file_name: Northstar Operations Practice Workbook.xlsx
    template: workbooks/Northstar Operations Practice Workbook.xlsx
    save_instructions: Save the continuing working copy as an .xlsx file in the Academy workspace before selecting
      Check Workbook.
    sheet: Analysis Workspace
    columns:
    - Region
    - Sum of Revenue
    row_range: A28:D34
    starting_state: A28:D34 is reserved for the region analysis.
    expected_result: A region summary or pivot is saved in A28:D34, with West as the highest-revenue region.
    column_descriptions:
      Region: Sales territory assigned to the order or customer.
      Sum of Revenue: Aggregated revenue for one dimension value.
    sample_values:
    - 'Region: West'
    - 'Sum of Revenue: $115,106.00'
    evidence_prompt: Which region has the highest total revenue?
  required_for_practice: true
  required_for_mastery: false
  evidence_eligible: false
