- activity_id: academy2_spreadsheet_pivots_guided
  title: Try It — Summarize revenue by region
  type: guided
  runtime: workbook
  prompt: Create a region-level Revenue pivot or equivalent grouped summary beginning at Analysis Workspace A28.
  starter: ''
  solution: Insert a pivot from Orders, place it on Analysis Workspace at A28, add Region to Rows, add Revenue to Values as SUM, and sort descending. West should be the highest-revenue region.
  hints:
  - The group names belong in Rows; the numeric amount belongs in Values.
  - Confirm the Values field is summarized by SUM rather than COUNT.
  - Use the named function or feature with the sheet, fields, and range listed in the task. Then spot-check the first and last result before checking your work.
  validator:
    type: workbook
    checks:
    - type: any_of
      checks:
      - type: pivot_present
        sheet: Analysis Workspace
