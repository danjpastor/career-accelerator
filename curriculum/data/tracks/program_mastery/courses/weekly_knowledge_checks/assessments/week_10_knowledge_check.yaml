assessment_id: week_10_reporting_publication_check
title: Week 10 Knowledge Check
order: 10
description: An eight-question check covering Week 10 topics.
estimated_minutes: 25
instructions:
- Answer all eight multiple-choice questions independently.
- Score at least 80% (seven of eight) to pass.
- Review recommendations under missed questions before retaking the check.
requires:
- roadmap.portfolio_readiness
passing_score: 0.8
activities:
- activity_id: w10_q1
  title: Model dimensions and facts
  type: mastery
  runtime: recognition
  prompt: In a star schema, what usually belongs in a fact table?
  answer_options:
  - Events or measurements at a defined grain
  - Only descriptive category names
  - A list of report colors
  - Unrelated notes from every source
  starter: ''
  solution: Events or measurements at a defined grain
  hints: []
  validator:
    type: exact_answer
    expected_answer: Events or measurements at a defined grain
  required_for_practice: false
  required_for_mastery: false
  required_for_completion: true
  evidence_eligible: false
  difficulty: intermediate
  estimated_minutes: 3
  presentation:
    scenario: Week 10 Knowledge Check
    introduction: Choose the best answer based on the work completed this week.
    task: In a star schema, what usually belongs in a fact table?
    requirements:
    - Choose one answer.
    expected_output: One selected answer.
    review_recommendation: Review fact tables, dimensions, and star-schema grain.
